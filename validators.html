<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto 30px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; background: #065F46; color: white; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #065F46; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0; color:#065F46;">Add System User</h2>
        <form id="addUserForm">
            <div class="form-group"><label>Email Address</label><input type="email" id="uEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="uPass" required minlength="6"></div>
            <div class="form-group"><label>Full Name</label><input type="text" id="uName" required></div>
            <div class="form-group"><label>Role</label>
                <select id="uRole" required>
                    <option value="ADMIN">ADMIN</option>
                    <option value="STAFF">STAFF</option>
                    <option value="PBDD ADMIN">PBDD ADMIN</option>
                    <option value="PBDD PERSONNEL">PBDD PERSONNEL</option>
                    <option value="ARBO ADMIN">ARBO ADMIN</option>
                </select>
            </div>
            <div class="form-group"><label>Position / Title</label><input type="text" id="uPos" required></div>
            <button type="submit" class="btn" id="saveUserBtn">Create User</button>
        </form>
    </div>

    <div style="max-width: 1000px; margin: auto; background: white; border-radius: 8px; overflow: hidden;">
        <table>
            <thead><tr><th>Name</th><th>Role</th><th>Position</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="userTable"></tbody>
        </table>
    </div>

    <script>
        const sup = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        
        async function loadUsers() {
            const { data } = await sup.from('profiles').select('id, full_name, role, position, status').order('created_at', { ascending: false });
            document.getElementById('userTable').innerHTML = data.map(u => `
                <tr>
                    <td>${u.full_name}</td><td>${u.role}</td><td>${u.position || '—'}</td>
                    <td><strong style="color:${u.status==='Active'?'green':'red'}">${u.status || 'Active'}</strong></td>
                    <td>
                        <button class="btn" style="background:${u.status==='Active'?'#991b1b':'#10b981'}; padding:5px 10px; font-size:12px;" 
                        onclick="toggleStatus('${u.id}', '${u.status}')">${u.status==='Active'?'Set Inactive':'Set Active'}</button>
                    </td>
                </tr>
            `).join('');
        }

        window.toggleStatus = async (id, curStatus) => {
            const newStat = (curStatus === 'Active') ? 'Inactive' : 'Active';
            await sup.from('profiles').update({ status: newStat }).eq('id', id);
            loadUsers();
        };

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveUserBtn');
            btn.disabled = true; btn.textContent = "Processing...";

            try {
                // Call the secure RPC we set up in Step 1
                const { error } = await sup.rpc('admin_create_user', {
                    p_email: document.getElementById('uEmail').value,
                    p_password: document.getElementById('uPass').value,
                    p_full_name: document.getElementById('uName').value,
                    p_role: document.getElementById('uRole').value,
                    p_position: document.getElementById('uPos').value
                });

                if (error) throw error;
                alert('User created successfully!');
                e.target.reset();
                loadUsers();
            } catch(err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false; btn.textContent = "Create User";
            }
        });

        loadUsers();
    </script>
</body>
</html>
