<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARB Global Cleansing – Dashboard</title>
    
    <!-- Unified Stylesheet & Dependencies -->
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
</head>
<body>
    <div class="container">
        <h1>🏛️ ARB Global Cleansing <small>Activity Monitoring</small></h1>

        <!-- Navigation -->
        <nav class="nav" id="mainNav"></nav>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card" style="border-left-color:#94a3b8; cursor: default;">
                <div class="number">⏳</div>
                <div class="label">Loading Interface…</div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <button class="modal-close" id="closeModalBtn">&times;</button>
                <h2 id="modalTitle">ARB List</h2>
                <div id="modalBody"><p class="empty-msg">Loading…</p></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- MAIN DASHBOARD SCRIPT (ISOLATED) -->
    <script>
        // Wrapping everything in an anonymous async function prevents variables from leaking
        // and colliding with other files in your project like nav.js or config.js
        (async function() {
            
            // --- Helper: Console-Only Debugging ---
            function logDebug(msg, type = 'info') {
                console.log(`[DBG] ${msg}`);
            }

            // --- Helper: Toast ---
            let toastTimer;
            function popToast(msg, type = 'info') {
                const el = document.getElementById('toast');
                if (!el) return;
                const colors = { info: '#1e293b', ok: '#14532d', warn: '#78350f', err: '#7f1d1d' };
                el.style.borderLeftColor = type === 'ok' ? '#4ade80' : type === 'warn' ? '#facc15' : type === 'err' ? '#f87171' : '#e8a317';
                el.style.background = colors[type] || '#1e293b';
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
            }

            logDebug('Starting secure dashboard isolation environment...', 'info');

            // --- Setup Database Connection safely ---
            let secureDbClient = null;
            try {
                if (typeof window.supabase !== 'undefined' && window.supabase !== null) {
                    secureDbClient = window.supabase.createClient(
                        'https://xnwttnpfzcjbszwxsgox.supabase.co', 
                        'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI'
                    );
                    logDebug('Secure database link established', 'ok');
                } else {
                    logDebug('Database CDN missing or blocked', 'warn');
                }
            } catch (err) {
                logDebug(`Setup Exception: ${err.message}`, 'err');
            }

            // --- Navigation Renderer ---
            async function buildNavbar(user) {
                const navEl = document.getElementById('mainNav');
                if (!navEl) return;
                
                const curPath = window.location.pathname;
                const links = [
                    { label: 'Dashboard', url: '/dashboard.html', icon: '📊' },
                    { label: 'ARBO Management', url: '/arbo.html', icon: '🏢' },
                    { label: 'ARB Management', url: '/arb.html', icon: '👤' },
                    { label: 'Validators', url: '/validators.html', icon: '✅' },
                    { label: 'Reports', url: '/reports.html', icon: '📈' }
                ];

                let html = links.map(l => {
                    const active = curPath.includes(l.url.replace('/','')) || (l.url === '/dashboard.html' && curPath === '/') ? 'active' : '';
                    return `<a href="${l.url}" class="${active}">${l.icon} ${l.label}</a>`;
                }).join('');

                if (user) {
                    html += `<span class="user-badge">👤 ${user.email}</span>`;
                    html += `<span class="logout-link" id="navLogoutBtn">🚪 Logout</span>`;
                } else {
                    html += `<span class="user-badge" style="color:#b91c1c;">⚠️ Not Logged In</span>`;
                    html += `<span class="logout-link" style="color:#0a3d62" onclick="window.location.href='login.html'">🔑 Login</span>`;
                }
                
                navEl.innerHTML = html;

                // Safely bind logout click
                const logoutBtn = document.getElementById('navLogoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', async () => {
                        if (secureDbClient) await secureDbClient.auth.signOut();
                        window.location.href = 'login.html';
                    });
                }
            }

            // --- Modal Functions ---
            const modalEl = document.getElementById('modal');
            const modalTitleEl = document.getElementById('modalTitle');
            const modalBodyEl = document.getElementById('modalBody');
            
            function hideModal() { if (modalEl) modalEl.classList.remove('active'); }
            
            document.getElementById('closeModalBtn')?.addEventListener('click', hideModal);
            modalEl?.addEventListener('click', (e) => { if (e.target === modalEl) hideModal(); });

            async function displayModal(title, filterField, filterValue) {
                if (!modalEl || !modalTitleEl || !modalBodyEl) return;
                
                modalTitleEl.textContent = title + ' – ARB List';
                modalBodyEl.innerHTML = '<p class="empty-msg">⏳ Fetching Secure Data…</p>';
                modalEl.classList.add('active');

                if (!secureDbClient) {
                    modalBodyEl.innerHTML = '<p class="empty-msg">❌ Database connection required.</p>';
                    return;
                }

                try {
                    let req = secureDbClient.from('arb').select('id, first_name, last_name, validation_status, ao8, for_ta, with_ta, for_removal');
                    if (filterField) req = req.eq(filterField, filterValue);
                    
                    const { data, error } = await req.order('last_name', { ascending: true });
                    if (error) throw new Error(error.message);
                    
                    if (!data || data.length === 0) {
                        modalBodyEl.innerHTML = '<p class="empty-msg">📭 No records found for this category.</p>';
                        return;
                    }

                    let tHtml = `<table class="modal-table"><thead><tr><th>ID</th><th>Name</th><th>Validation</th><th>AO8</th><th>For TA</th><th>With TA</th><th>For Removal</th></tr></thead><tbody>`;
                    data.forEach(r => {
                        const sColor = r.validation_status === 'Validated' ? 'badge-success' : r.validation_status === 'Pending' ? 'badge-warning' : 'badge-danger';
                        tHtml += `<tr>
                            <td>${(r.id || '-').toString().substring(0,8)}</td>
                            <td>${(r.last_name || '') + ', ' + (r.first_name || '')}</td>
                            <td><span class="badge ${sColor}">${r.validation_status || 'Pending'}</span></td>
                            <td>${r.ao8 ? '✅' : '❌'}</td><td>${r.for_ta ? '✅' : '❌'}</td>
                            <td>${r.with_ta ? '✅' : '❌'}</td><td>${r.for_removal ? '✅' : '❌'}</td>
                        </tr>`;
                    });
                    modalBodyEl.innerHTML = tHtml + '</tbody></table>';
                } catch (err) {
                    modalBodyEl.innerHTML = `<p class="empty-msg" style="color:#b91c1c;">❌ Access Denied or Error: ${err.message}</p>`;
                }
            }

            // --- Execution Pipeline ---
            try {
                const gridEl = document.getElementById('statsGrid');
                
                // 1. If database failed to load globally
                if (!secureDbClient) {
                    logDebug('Halting execution: Offline Mode', 'warn');
                    await buildNavbar(null);
                    if (gridEl) {
                        gridEl.innerHTML = `
                            <div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;">
                                <div class="number">🔌</div>
                                <div class="label" style="font-size: 1.1rem; color:#b91c1c; margin-top: 10px;">System Offline</div>
                                <p style="font-size: 0.85rem; color:#64748b; margin-top: 5px;">The database engine could not be reached. Ensure you are connected to the internet.</p>
                            </div>`;
                    }
                    return;
                }

                // 2. Database available, Verify Auth State
                logDebug('Verifying security clearance...', 'info');
                const { data: authObj, error: authErr } = await secureDbClient.auth.getUser();
                const sessionUser = authObj ? authObj.user : null;

                // 3. Reject Unauthenticated
                if (!sessionUser) {
                    logDebug('Access denied. User lacks valid session token.', 'err');
                    popToast('Secure Login Required', 'warn');
                    await buildNavbar(null);
                    
                    if (gridEl) {
                        gridEl.innerHTML = `
                            <div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;">
                                <div class="number">🔒</div>
                                <div class="label" style="font-size: 1.1rem; color:#334155; margin-top: 10px;">Security Lockout</div>
                                <p style="font-size: 0.85rem; color:#64748b; margin-top: 5px;">Database rules require an active session to query global statistics.</p>
                                <button onclick="window.location.href='login.html'" style="margin-top: 15px; padding: 8px 16px; background: #0a3d62; color: white; border: none; border-radius: 6px; cursor: pointer;">Proceed to Login</button>
                            </div>`;
                    }
                    return;
                }

                // 4. Authenticated -> Build Safe UI
                logDebug(`Active Session Verified: ${sessionUser.email}`, 'ok');
                await buildNavbar(sessionUser);

                // 5. Query Real Data concurrently
                logDebug('Downloading statistical matrix...', 'info');
                const qrs = await Promise.all([
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }),
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }).eq('validation_status', 'Validated'),
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }).eq('ao8', true),
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }).eq('for_ta', true),
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }).eq('with_ta', true),
                    secureDbClient.from('arb').select('*', { count: 'exact', head: true }).eq('for_removal', true)
                ]);

                // Check for RLS rejections
                if (qrs[0].error) throw new Error(qrs[0].error.message);

                const c = qrs.map(r => r.count || 0);
                
                const stats = [
                    { label: 'GLOBAL ARBs', count: c[0], color: '#0a3d62', fField: null, fVal: null },
                    { label: 'VALIDATED', count: c[1], color: '#2e7d32', fField: 'validation_status', fVal: 'Validated' },
                    { label: 'AO 8', count: c[2], color: '#e8a317', fField: 'ao8', fVal: true },
                    { label: 'For TA', count: c[3], color: '#f59e0b', fField: 'for_ta', fVal: true },
                    { label: 'With TA', count: c[4], color: '#3b82f6', fField: 'with_ta', fVal: true },
                    { label: 'For Removal', count: c[5], color: '#b91c1c', fField: 'for_removal', fVal: true }
                ];

                if (gridEl) {
                    gridEl.innerHTML = '';
                    stats.forEach(st => {
                        const div = document.createElement('div');
                        div.className = 'stat-card';
                        div.style.borderLeftColor = st.color;
                        div.innerHTML = `<div class="number">${st.count}</div><div class="label">${st.label}</div>`;
                        
                        // Safely bind click event
                        div.addEventListener('click', () => displayModal(st.label, st.fField, st.fVal));
                        gridEl.appendChild(div);
                    });
                }
                
                logDebug('Realtime statistics rendered', 'ok');
                popToast('Dashboard Sync Complete', 'ok');

            } catch (fatalObj) {
                logDebug(`CRITICAL FAILURE: ${fatalObj.message}`, 'err');
                const gEl = document.getElementById('statsGrid');
                if (gEl) {
                    gEl.innerHTML = `
                        <div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;">
                            <div class="number">❌</div>
                            <div class="label" style="font-size: 1.1rem; color:#b91c1c; margin-top: 10px;">Execution Failed</div>
                            <p style="font-size: 0.85rem; color:#64748b; margin-top: 5px;">${fatalObj.message}</p>
                        </div>`;
                }
            }

        })();
    </script>
</body>
</html>
