<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARB Global Cleansing – Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>

    <style>
        /* Graphical Chart Styles */
        .charts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
            background: white;
            padding: 40px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
        }
        .chart-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
        }
        .chart-item svg {
            width: 110px;
            height: 110px;
            margin-bottom: 12px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05));
        }
        .chart-item .chart-label {
            font-size: 0.9rem;
            color: #334155;
            font-weight: 700;
            text-align: center;
        }
        .donut-text {
            font-size: 0.45rem;
            font-weight: bold;
            fill: #0a3d62;
            text-anchor: middle;
        }
        .circle-bg {
            fill: none;
            stroke: #f1f5f9;
            stroke-width: 3.5;
        }
        .circle-chart {
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            animation: fillAnimation 1s ease-out forwards;
        }
        @keyframes fillAnimation {
            from { stroke-dasharray: 0, 100; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ ARB Global Cleansing <small>Activity Monitoring</small></h1>

        <!-- Navigation -->
        <nav class="nav" id="mainNav"></nav>

        <!-- Graphical Presentation (Donut Charts) -->
        <div id="chartsContainer" class="charts-container" style="display: none;"></div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card" style="border-left-color:#94a3b8; cursor: default;">
                <div class="number">⏳</div>
                <div class="label">Loading Interface…</div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content wide">
                <button class="modal-close" id="closeModalBtn">&times;</button>
                <h2 id="modalTitle">ARB List</h2>
                <div id="modalBody"><p class="empty-msg">Loading…</p></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        (async function() {

            function logDebug(msg, type = 'info') {
                console.log(`[DBG] ${msg}`);
            }

            let toastTimer;
            function popToast(msg, type = 'info') {
                const el = document.getElementById('toast');
                if (!el) return;
                const colors = { info: '#1e293b', ok: '#14532d', warn: '#78350f', err: '#7f1d1d' };
                el.style.borderLeftColor = type === 'ok' ? '#4ade80' : type === 'warn' ? '#facc15' : type === 'err' ? '#f87171' : '#e8a317';
                el.style.background = colors[type] || '#1e293b';
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
            }

            function safe(value) { return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }

            let secureDbClient = null;
            let isDarmoPersonnel = false;
            let allowedTowns = [];

            try {
                if (typeof window.supabase !== 'undefined' && window.supabase !== null) {
                    secureDbClient = window.supabase.createClient(
                        'https://xnwttnpfzcjbszwxsgox.supabase.co', 
                        'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI'
                    );
                }
            } catch (err) {
                logDebug(`Setup Exception: ${err.message}`, 'err');
            }

            // Helper to fetch in chunks
            async function fetchInChunks(table, selectStr, column, idArray) {
                let results = [];
                const chunkSize = 150; 
                for(let i=0; i<idArray.length; i+=chunkSize) {
                    const chunk = idArray.slice(i, i+chunkSize);
                    const {data} = await secureDbClient.from(table).select(selectStr).in(column, chunk);
                    if(data) results.push(...data);
                }
                return results;
            }

            // --- Navigation Renderer ---
            async function buildNavbar(userProfile) {
                const navEl = document.getElementById('mainNav');
                if (!navEl) return;

                const curPath = window.location.pathname;
                const { data: navItems } = await secureDbClient.from('system_navigation').select('*').order('id', { ascending: true });

                let links = navItems && navItems.length > 0 ? navItems : [
                    { label: 'Dashboard', url: '/dashboard.html', icon: '📊' },
                    { label: 'ARBO Management', url: '/arbo.html', icon: '🏢' },
                    { label: 'ARB Management', url: '/arb.html', icon: '👤' },
                    { label: 'Validators', url: '/validators.html', icon: '✅' },
                    { label: 'Reports', url: '/reports.html', icon: '📈' }
                ];

                // STRICT MENU DEDUPLICATION
                const uniqueLinks = [];
                const seenLabels = new Set();
                for (const item of links) {
                    if (!seenLabels.has(item.label)) {
                        seenLabels.add(item.label);
                        uniqueLinks.push(item);
                    }
                }

                let html = uniqueLinks.map(l => {
                    const linkTarget = (l.url || '').replace('/', '');
                    const isActive = curPath.includes(linkTarget) && linkTarget !== '' ? 'active' : '';
                    return `<a href="${l.url}" class="${isActive}">${l.icon || ''} ${l.label}</a>`;
                }).join('');

                // STRICT NAME DISPLAY - Guaranteed to use Profile Name
                if (userProfile) {
                    const displayName = (userProfile.full_name && userProfile.full_name.trim() !== '') 
                        ? userProfile.full_name 
                        : 'System Admin'; // Absolute fallback just in case

                    html += `<span class="user-badge" style="margin-left: auto; color: #0a3d62; font-weight: 600;">👤 ${displayName} (${userProfile.role})</span>`;
                    html += `<span class="logout-link" id="navLogoutBtn" style="color: #b91c1c; font-weight: 600; margin-left: 10px; cursor: pointer;">🚪 Logout</span>`;
                } else {
                    html += `<span class="user-badge" style="margin-left: auto; color:#b91c1c;">⚠️ Not Logged In</span>`;
                    html += `<span class="logout-link" style="color:#0a3d62; margin-left: 10px; cursor: pointer;" onclick="window.location.href='login.html'">🔑 Login</span>`;
                }

                navEl.innerHTML = html;

                document.getElementById('navLogoutBtn')?.addEventListener('click', async () => {
                    if (secureDbClient) await secureDbClient.auth.signOut();
                    window.location.href = 'login.html';
                });
            }

            // --- Modal Functions ---
            const modalEl = document.getElementById('modal');
            const modalTitleEl = document.getElementById('modalTitle');
            const modalBodyEl = document.getElementById('modalBody');

            function hideModal() { if (modalEl) modalEl.classList.remove('active'); }
            document.getElementById('closeModalBtn')?.addEventListener('click', hideModal);
            modalEl?.addEventListener('click', (e) => { if (e.target === modalEl) hideModal(); });

            async function displayModal(title, filterField, filterValue) {
                if (!modalEl || !modalTitleEl || !modalBodyEl) return;

                modalTitleEl.textContent = title + ' – ARB List';
                modalBodyEl.innerHTML = '<p class="empty-msg">⏳ Fetching Secure Data…</p>';
                modalEl.classList.add('active');

                if (!secureDbClient) {
                    modalBodyEl.innerHTML = '<p class="empty-msg">❌ Database connection required.</p>';
                    return;
                }

                try {
                    let req = secureDbClient.from('arb').select('id, first_name, last_name, validation_status, ao8, for_ta, with_ta, for_removal, arbo_id, arb_validations(validator_type, date_validated, supporting_document_reference)');
                    if (filterField) req = req.eq(filterField, filterValue);

                    // JURISDICTION FILTER FOR MODAL
                    if (isDarmoPersonnel) {
                        if (allowedTowns.length > 0) {
                            req = req.in('municipality', allowedTowns);
                        } else {
                            // Prevent any data from loading if DARMO has no assigned jurisdiction
                            req = req.is('id', null); 
                        }
                    }

                    const { data, error } = await req.order('last_name', { ascending: true }).limit(1500);
                    if (error) throw new Error(error.message);

                    if (!data || data.length === 0) {
                        modalBodyEl.innerHTML = '<p class="empty-msg">📭 No records found for this category.</p>';
                        return;
                    }

                    const arbIds = data.map(r => String(r.id));
                    const profs = await fetchInChunks('arb_profiles', 'id, arb_id', 'arb_id', arbIds);
                    const profMap = {};
                    const profIds = [];
                    profs.forEach(p => {
                        profMap[p.arb_id] = p.id;
                        profIds.push(p.id);
                    });

                    const mems = await fetchInChunks('arbo_members', 'profile_id, membership_no', 'profile_id', profIds);
                    const memMap = {};
                    mems.forEach(m => {
                        memMap[m.profile_id] = m;
                    });

                    let tHtml = `<table class="modal-table"><thead><tr><th>ID</th><th>Name</th><th>Validation</th><th>Val. Type</th><th>Ref. No.</th><th>AO8</th><th>For TA</th><th>With TA</th><th>For Removal</th></tr></thead><tbody>`;
                    data.forEach(r => {
                        const sColor = r.validation_status === 'Validated' ? 'badge-success' : r.validation_status === 'Pending' ? 'badge-warning' : 'badge-danger';

                        let valType = '—';
                        let valRef = '—';
                        if (r.arb_validations && r.arb_validations.length > 0) {
                            const sortedVals = r.arb_validations.sort((a, b) => new Date(b.date_validated || 0) - new Date(a.date_validated || 0));
                            valType = sortedVals[0].validator_type || '—';
                            valRef = sortedVals[0].supporting_document_reference || '—';
                        }

                        const pId = profMap[String(r.id)];
                        const isMember = pId ? memMap[pId] : null;

                        if (r.arbo_id || isMember) {
                            valType = 'PBDD / ARBO MEMBERSHIP';
                            if (isMember && isMember.membership_no) {
                                valRef = isMember.membership_no;
                            } else if (valRef === '—') {
                                valRef = 'ARBO Registry';
                            }
                        }

                        tHtml += `<tr>
                            <td style="font-family: monospace; color:#64748b">${(r.id || '-').toString().substring(0,6)}</td>
                            <td style="font-weight:600; color:#0a3d62">${(r.last_name || '') + ', ' + (r.first_name || '')}</td>
                            <td><span class="badge ${sColor}">${r.validation_status || 'Pending'}</span></td>
                            <td style="font-size:0.75rem; font-weight:700; color:#475569;">${valType}</td>
                            <td style="font-size:0.75rem; color:#475569;">${safe(valRef)}</td>
                            <td>${r.ao8 ? '✅' : '❌'}</td><td>${r.for_ta ? '✅' : '❌'}</td>
                            <td>${r.with_ta ? '✅' : '❌'}</td><td>${r.for_removal ? '✅' : '❌'}</td>
                        </tr>`;
                    });
                    modalBodyEl.innerHTML = tHtml + '</tbody></table>';
                } catch (err) {
                    modalBodyEl.innerHTML = `<p class="empty-msg" style="color:#b91c1c;">❌ Access Denied or Error: ${err.message}</p>`;
                }
            }

            async function displayArboMembershipModal() {
                if (!modalEl || !modalTitleEl || !modalBodyEl) return;

                modalTitleEl.textContent = 'ARBO Membership List';
                modalBodyEl.innerHTML = '<p class="empty-msg">⏳ Fetching Secure Data…</p>';
                modalEl.classList.add('active');

                if (!secureDbClient) {
                    modalBodyEl.innerHTML = '<p class="empty-msg">❌ Database connection required.</p>';
                    return;
                }

                try {
                    // Added !inner(name, municipality) to strictly enforce the jurisdiction join
                    let req = secureDbClient
                        .from('arbo_members')
                        .select('id, arbo_id, arb_name, is_arb, membership_no, membership_status, date_from, arbo!inner(name, municipality)')
                        .or('membership_status.is.null,membership_status.ilike.ACTIVE,membership_status.ilike.INACTIVE')
                        .order('arb_name', { ascending: true });

                    // STRICT JURISDICTION FILTER FOR ARBO MODAL
                    if (isDarmoPersonnel) {
                        if (allowedTowns.length > 0) {
                            req = req.in('arbo.municipality', allowedTowns);
                        } else {
                            req = req.is('id', null); // Force empty if no jurisdiction
                        }
                    }

                    const { data, error } = await req;
                    if (error) throw new Error(error.message || JSON.stringify(error));
                    
                    if (!data || data.length === 0) {
                        modalBodyEl.innerHTML = '<p class="empty-msg">📭 No ARBO membership records found in your jurisdiction.</p>';
                        return;
                    }

                    let tHtml = `<table class="modal-table"><thead><tr><th>ARBO</th><th>Member</th><th>Type</th><th>Membership No.</th><th>Member Since</th><th>Status</th></tr></thead><tbody>`;
                    data.forEach(r => {
                        const status = r.membership_status || 'ACTIVE';
                        const statusClass = status === 'ACTIVE' ? 'badge-success' : 'badge-warning';
                        const memberType = r.is_arb ? 'ARB' : 'NON-ARB';
                        const arboName = Array.isArray(r.arbo) ? r.arbo[0]?.name : r.arbo?.name;
                        const joined = r.date_from ? new Date(r.date_from + 'T00:00:00').toLocaleDateString('en-PH') : '—';
                        tHtml += `<tr>
                            <td style="font-weight:600; color:#0a3d62">${arboName || 'ARBO #' + r.arbo_id}</td>
                            <td style="font-weight:600">${r.arb_name || '—'}</td>
                            <td><span class="badge ${r.is_arb ? 'badge-success' : 'badge-warning'}">${memberType}</span></td>
                            <td>${r.membership_no || '—'}</td>
                            <td>${joined}</td>
                            <td><span class="badge ${statusClass}">${status}</span></td>
                        </tr>`;
                    });
                    modalBodyEl.innerHTML = tHtml + '</tbody></table>';
                } catch (err) {
                    modalBodyEl.innerHTML = `<p class="empty-msg" style="color:#b91c1c;">❌ Access Denied or Error: ${err.message}</p>`;
                }
            }

            // --- Helper: Donut Chart Generator ---
            function createDonutHTML(value, total, color, label) {
                const percentage = total === 0 ? 0 : Math.min(100, Math.round((value / total) * 100));
                return `
                    <div class="chart-item">
                        <svg viewBox="0 0 36 36">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle-chart" stroke="${color}"
                                stroke-dasharray="${percentage}, 100"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="donut-text">${value}</text>
                        </svg>
                        <div class="chart-label">${label}</div>
                    </div>
                `;
            }

            // --- Execution Pipeline ---
            try {
                const gridEl = document.getElementById('statsGrid');
                const chartsEl = document.getElementById('chartsContainer');

                if (!secureDbClient) {
                    await buildNavbar(null);
                    if (gridEl) gridEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">🔌</div><div class="label" style="color:#b91c1c;">System Offline</div></div>`;
                    return;
                }

                const { data: authData, error: authErr } = await secureDbClient.auth.getUser();
                if (!authData || !authData.user) {
                    await buildNavbar(null);
                    if (gridEl) gridEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">🔒</div><div class="label">Security Lockout</div><button onclick="window.location.href='login.html'" class="btn btn-primary" style="margin-top:15px;">Login</button></div>`;
                    return;
                }

                const { data: profile } = await secureDbClient.from('profiles').select('*').eq('id', authData.user.id).single();

                if (String(profile?.role || '').toUpperCase() === 'ARBO ADMIN') {
                    window.location.replace('arbo.html');
                    return;
                }

                isDarmoPersonnel = String(profile?.role || '').toUpperCase() === 'DARMO PERSONNEL';

                // FETCH JURISDICTION SCOPES IF DARMO PERSONNEL
                if (isDarmoPersonnel) {
                    const { data: scopes } = await secureDbClient
                        .from('validator_access_scopes')
                        .select('municipality')
                        .eq('validator_user_id', profile.id)
                        .eq('is_active', true);

                    if (scopes && scopes.length > 0) {
                        allowedTowns = [...new Set(scopes.map(s => s.municipality).filter(Boolean))];
                    }
                }

                await buildNavbar(profile);

                // HELPER TO GENERATE FILTERED BASE QUERIES FOR ARB
                function buildArbQuery() {
                    let q = secureDbClient.from('arb').select('*', { count: 'exact', head: true });
                    if (isDarmoPersonnel) {
                        if (allowedTowns.length > 0) {
                            q = q.in('municipality', allowedTowns);
                        } else {
                            q = q.is('id', null); // Force 0 results if no jurisdiction is assigned
                        }
                    }
                    return q;
                }

                // HELPER TO GENERATE FILTERED QUERIES FOR ARBO MEMBERS
                function buildArboMembersQuery() {
                    let q = secureDbClient.from('arbo_members')
                        .select('id, arbo!inner(municipality)', { count: 'exact', head: true })
                        .or('membership_status.is.null,membership_status.ilike.ACTIVE,membership_status.ilike.INACTIVE');
                        
                    if (isDarmoPersonnel) {
                        if (allowedTowns.length > 0) {
                            q = q.in('arbo.municipality', allowedTowns);
                        } else {
                            q = q.is('id', null);
                        }
                    }
                    return q;
                }

                const qrs = await Promise.all([
                    buildArbQuery(),
                    buildArbQuery().eq('validation_status', 'Validated'),
                    buildArbQuery().eq('ao8', true),
                    buildArbQuery().eq('for_ta', true),
                    buildArbQuery().eq('with_ta', true),
                    buildArbQuery().eq('for_removal', true),
                    buildArboMembersQuery() // Uses the new strictly filtered function
                ]);

                // ROBUST ERROR CHECKING (Fixes the blank {"message":""} error screen)
                const failedQuery = qrs.find(r => r.error != null);
                if (failedQuery) {
                    const errObj = failedQuery.error;
                    const errorMsg = errObj.message || errObj.details || JSON.stringify(errObj);
                    throw new Error(`Database Query Failed: ${errorMsg}`); 
                }

                const c = qrs.map(r => r.count || 0);
                const totalArbs = c[0] || 0;

                const stats = [
                    { label: isDarmoPersonnel ? 'YOUR ARBs' : 'GLOBAL ARBs', count: c[0], color: '#0a3d62', fField: null, fVal: null },
                    { label: 'VALIDATED', count: c[1], color: '#2e7d32', fField: 'validation_status', fVal: 'Validated' },
                    { label: 'AO 8', count: c[2], color: '#e8a317', fField: 'ao8', fVal: true },
                    { label: 'For TA', count: c[3], color: '#f59e0b', fField: 'for_ta', fVal: true },
                    { label: 'With TA', count: c[4], color: '#3b82f6', fField: 'with_ta', fVal: true },
                    { label: 'For Removal', count: c[5], color: '#b91c1c', fField: 'for_removal', fVal: true },
                    { label: 'ARBO MEMBERSHIP', count: c[6], color: '#7c3aed', mode: 'arbo_membership' }
                ];

                // 1. Build Graphical Charts
                if (chartsEl) {
                    let chartsHTML = '';
                    stats.forEach(st => {
                        chartsHTML += createDonutHTML(st.count, totalArbs, st.color, st.label);
                    });
                    chartsEl.innerHTML = chartsHTML;
                    chartsEl.style.display = 'flex'; 
                }

                // 2. Build Interactive Detail Cards
                if (gridEl) {
                    gridEl.innerHTML = '';
                    stats.forEach(st => {
                        const div = document.createElement('div');
                        div.className = 'stat-card';
                        div.style.borderLeftColor = st.color;
                        div.innerHTML = `<div class="number">${st.count}</div><div class="label">${st.label}</div>`;
                        div.addEventListener('click', () => {
                            if (st.mode === 'arbo_membership') displayArboMembershipModal();
                            else displayModal(st.label, st.fField, st.fVal);
                        });
                        gridEl.appendChild(div);
                    });
                }

                popToast('Dashboard Sync Complete', 'ok');

            } catch (fatalObj) {
                const gEl = document.getElementById('statsGrid');
                if (gEl) gEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">❌</div><div class="label" style="color:#b91c1c;">Execution Failed</div><p>${fatalObj.message}</p></div>`;
            }

        })();
    </script>
</body>
</html>
