<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARB Global Cleansing – Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>

    <style>
        /* Graphical Chart Styles */
        .charts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            gap: 20px;
            background: white;
            padding: 40px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
        }
        .chart-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
        }
        .chart-item svg {
            width: 110px;
            height: 110px;
            margin-bottom: 12px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.05));
        }
        .chart-item .chart-label {
            font-size: 0.9rem;
            color: #334155;
            font-weight: 700;
            text-align: center;
        }
        .donut-text {
            font-size: 0.45rem;
            font-weight: bold;
            fill: #0a3d62;
            text-anchor: middle;
        }
        .circle-bg {
            fill: none;
            stroke: #f1f5f9;
            stroke-width: 3.5;
        }
        .circle-chart {
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
            animation: fillAnimation 1s ease-out forwards;
        }
        @keyframes fillAnimation {
            from { stroke-dasharray: 0, 100; }
        }

        /* Municipality validation progress */
        .municipality-progress-card {
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            margin-bottom: 30px;
        }
        .municipality-progress-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }
        .municipality-progress-header h2 {
            margin: 0;
            color: #0a3d62;
            font-size: 1.15rem;
        }
        .municipality-progress-header p {
            margin: 4px 0 0;
            color: #64748b;
            font-size: 0.82rem;
        }
        .municipality-bar-chart {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px 28px;
        }
        .municipality-bar-row {
            min-width: 0;
        }
        .municipality-bar-meta {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }
        .municipality-name {
            color: #334155;
            font-size: 0.86rem;
            font-weight: 700;
        }
        .municipality-result {
            color: #475569;
            font-size: 0.76rem;
            white-space: nowrap;
        }
        .municipality-track {
            height: 13px;
            overflow: hidden;
            background: #e2e8f0;
            border-radius: 999px;
        }
        .municipality-fill {
            height: 100%;
            min-width: 0;
            background: linear-gradient(90deg, #0a3d62, #2e7d32);
            border-radius: inherit;
            animation: municipalityBarFill 0.8s ease-out both;
        }
        .municipality-percent {
            color: #0a3d62;
            font-weight: 800;
        }
        .municipality-progress-empty {
            grid-column: 1 / -1;
            margin: 0;
            padding: 18px;
            color: #64748b;
            text-align: center;
            background: #f8fafc;
            border-radius: 8px;
        }
        @keyframes municipalityBarFill {
            from { width: 0; }
        }
        @media (max-width: 820px) {
            .municipality-bar-chart { grid-template-columns: 1fr; }
            .municipality-progress-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ ARB Global Cleansing <small>Activity Monitoring</small></h1>

        <!-- Navigation -->
        <nav class="nav" id="mainNav"></nav>

        <!-- Graphical Presentation (Donut Charts) -->
        <div id="chartsContainer" class="charts-container" style="display: none;"></div>

        <!-- Progress per Municipality (Bar Graph) -->
        <section id="municipalityProgressCard" class="municipality-progress-card" style="display: none;">
            <div class="municipality-progress-header">
                <div>
                    <h2>Progress per Municipality</h2>
                    <p>Validated ARBs compared with the total ARBs recorded in each municipality</p>
                </div>
            </div>
            <div id="municipalityBarChart" class="municipality-bar-chart"></div>
        </section>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card" style="border-left-color:#94a3b8; cursor: default;">
                <div class="number">⏳</div>
                <div class="label">Loading Interface…</div>
            </div>
        </div>

        <!-- Modal -->
        <div id="modal" class="modal">
            <div class="modal-content wide">
                <button class="modal-close" id="closeModalBtn">&times;</button>
                <h2 id="modalTitle">ARB List</h2>
                <div id="modalBody"><p class="empty-msg">Loading…</p></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        (async function() {

            function logDebug(msg, type = 'info') {
                console.log(`[DBG] ${msg}`);
            }

            let toastTimer;
            function popToast(msg, type = 'info') {
                const el = document.getElementById('toast');
                if (!el) return;
                const colors = { info: '#1e293b', ok: '#14532d', warn: '#78350f', err: '#7f1d1d' };
                el.style.borderLeftColor = type === 'ok' ? '#4ade80' : type === 'warn' ? '#facc15' : type === 'err' ? '#f87171' : '#e8a317';
                el.style.background = colors[type] || '#1e293b';
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
            }

            function safe(value) { return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }

            let secureDbClient = null;
            let isDarmoPersonnel = false;

            // Municipality names copied from the ARB Management location list.
            const MUNICIPALITIES = [
                'Cabusao', 'Del Gallego', 'Lupi', 'Ragay', 'Sipocot', 'Gainza', 'Libmanan',
                'Milaor', 'Minalabac', 'Pamplona', 'Pasacao', 'San Fernando', 'Baao',
                'Balatan', 'Bato', 'Buhi', 'Bula', 'Nabua', 'Iriga City'
            ];
            
            // Globally cache the exact filters parsed from your working arb.html logic
            window.darmoAllowedArbIds = []; 
            window.scopeFilterString = null; 

            try {
                if (typeof window.supabase !== 'undefined' && window.supabase !== null) {
                    secureDbClient = window.supabase.createClient(
                        'https://xnwttnpfzcjbszwxsgox.supabase.co', 
                        'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI'
                    );
                }
            } catch (err) {
                logDebug(`Setup Exception: ${err.message}`, 'err');
            }

            async function fetchAllRecords(queryBuilderFn) {
                let allRecords = [];
                let p = 0;
                const size = 1000;
                while (true) {
                    const { data, error } = await queryBuilderFn().range(p * size, (p + 1) * size - 1);
                    if (error) { console.error('Fetch error:', error); break; }
                    if (!data || data.length === 0) break;
                    allRecords.push(...data);
                    if (data.length < size) break;
                    p++;
                }
                return allRecords;
            }

            async function fetchInChunks(table, selectStr, column, idArray) {
                let results = [];
                const chunkSize = 150; 
                for(let i=0; i<idArray.length; i+=chunkSize) {
                    const chunk = idArray.slice(i, i+chunkSize);
                    const {data} = await secureDbClient.from(table).select(selectStr).in(column, chunk);
                    if(data) results.push(...data);
                }
                return results;
            }

            async function buildNavbar(userProfile) {
                const navEl = document.getElementById('mainNav');
                if (!navEl) return;

                const curPath = window.location.pathname;
                const { data: navItems } = await secureDbClient.from('system_navigation').select('*').order('id', { ascending: true });

                let links = navItems && navItems.length > 0 ? navItems : [
                    { label: 'Dashboard', url: '/dashboard.html', icon: '📊' },
                    { label: 'ARBO Management', url: '/arbo.html', icon: '🏢' },
                    { label: 'ARB Management', url: '/arb.html', icon: '👤' },
                    { label: 'Validators', url: '/validators.html', icon: '✅' },
                    { label: 'Reports', url: '/reports.html', icon: '📈' }
                ];

                const uniqueLinks = [];
                const seenLabels = new Set();
                for (const item of links) {
                    if (!seenLabels.has(item.label)) {
                        seenLabels.add(item.label);
                        uniqueLinks.push(item);
                    }
                }

                let html = uniqueLinks.map(l => {
                    const linkTarget = (l.url || '').replace('/', '');
                    const isActive = curPath.includes(linkTarget) && linkTarget !== '' ? 'active' : '';
                    return `<a href="${l.url}" class="${isActive}">${l.icon || ''} ${l.label}</a>`;
                }).join('');

                if (userProfile) {
                    const displayName = (userProfile.full_name && userProfile.full_name.trim() !== '') 
                        ? userProfile.full_name 
                        : 'System Admin';

                    html += `<span class="user-badge" style="margin-left: auto; color: #0a3d62; font-weight: 600;">👤 ${displayName} (${userProfile.role})</span>`;
                    html += `<span class="logout-link" id="navLogoutBtn" style="color: #b91c1c; font-weight: 600; margin-left: 10px; cursor: pointer;">🚪 Logout</span>`;
                } else {
                    html += `<span class="user-badge" style="margin-left: auto; color:#b91c1c;">⚠️ Not Logged In</span>`;
                    html += `<span class="logout-link" style="color:#0a3d62; margin-left: 10px; cursor: pointer;" onclick="window.location.href='login.html'">🔑 Login</span>`;
                }

                navEl.innerHTML = html;

                document.getElementById('navLogoutBtn')?.addEventListener('click', async () => {
                    if (secureDbClient) await secureDbClient.auth.signOut();
                    window.location.href = 'login.html';
                });
            }

            const modalEl = document.getElementById('modal');
            const modalTitleEl = document.getElementById('modalTitle');
            const modalBodyEl = document.getElementById('modalBody');

            function hideModal() { if (modalEl) modalEl.classList.remove('active'); }
            document.getElementById('closeModalBtn')?.addEventListener('click', hideModal);
            modalEl?.addEventListener('click', (e) => { if (e.target === modalEl) hideModal(); });

            async function displayModal(title, filterField, filterValue) {
                if (!modalEl || !modalTitleEl || !modalBodyEl) return;

                modalTitleEl.textContent = title + ' – ARB List';
                modalBodyEl.innerHTML = '<p class="empty-msg">⏳ Fetching Secure Data…</p>';
                modalEl.classList.add('active');

                if (!secureDbClient) {
                    modalBodyEl.innerHTML = '<p class="empty-msg">❌ Database connection required.</p>';
                    return;
                }

                try {
                    let data = [];
                    const selectStr = 'id, first_name, last_name, validation_status, ao8, for_ta, with_ta, for_removal, arbo_id, arb_validations(validator_type, date_validated, supporting_document_reference)';

                    // Use explicit JavaScript chunking for DARMO so we bypass HTTP query limits
                    if (isDarmoPersonnel) {
                        if (window.darmoAllowedArbIds.length === 0) {
                            modalBodyEl.innerHTML = '<p class="empty-msg">📭 No records found for this category.</p>';
                            return;
                        }

                        let chunkData = await fetchInChunks('arb', selectStr, 'id', window.darmoAllowedArbIds);
                        
                        // Filter out non-matching rows in JavaScript
                        if (filterField) {
                            chunkData = chunkData.filter(r => r[filterField] === filterValue);
                        }

                        // Emulate database sort and limit
                        data = chunkData.sort((a, b) => (a.last_name || '').localeCompare(b.last_name || '')).slice(0, 1500);

                    } else {
                        // Regular Global Admin query
                        let req = secureDbClient.from('arb').select(selectStr);
                        if (filterField) req = req.eq(filterField, filterValue);

                        const res = await req.order('last_name', { ascending: true }).limit(1500);
                        if (res.error) throw new Error(res.error.message);
                        data = res.data || [];
                    }

                    if (!data || data.length === 0) {
                        modalBodyEl.innerHTML = '<p class="empty-msg">📭 No records found for this category.</p>';
                        return;
                    }

                    const arbIds = data.map(r => String(r.id));
                    const profs = await fetchInChunks('arb_profiles', 'id, arb_id', 'arb_id', arbIds);
                    const profMap = {};
                    const profIds = [];
                    profs.forEach(p => {
                        profMap[p.arb_id] = p.id;
                        profIds.push(p.id);
                    });

                    const mems = await fetchInChunks('arbo_members', 'profile_id, membership_no', 'profile_id', profIds);
                    const memMap = {};
                    mems.forEach(m => {
                        memMap[m.profile_id] = m;
                    });

                    let tHtml = `<table class="modal-table"><thead><tr><th>ID</th><th>Name</th><th>Validation</th><th>Val. Type</th><th>Ref. No.</th><th>AO8</th><th>For TA</th><th>With TA</th><th>For Removal</th></tr></thead><tbody>`;
                    data.forEach(r => {
                        const sColor = r.validation_status === 'Validated' ? 'badge-success' : r.validation_status === 'Pending' ? 'badge-warning' : 'badge-danger';

                        let valType = '—';
                        let valRef = '—';
                        if (r.arb_validations && r.arb_validations.length > 0) {
                            const sortedVals = r.arb_validations.sort((a, b) => new Date(b.date_validated || 0) - new Date(a.date_validated || 0));
                            valType = sortedVals[0].validator_type || '—';
                            valRef = sortedVals[0].supporting_document_reference || '—';
                        }

                        const pId = profMap[String(r.id)];
                        const isMember = pId ? memMap[pId] : null;

                        if (r.arbo_id || isMember) {
                            valType = 'PBDD / ARBO MEMBERSHIP';
                            if (isMember && isMember.membership_no) {
                                valRef = isMember.membership_no;
                            } else if (valRef === '—') {
                                valRef = 'ARBO Registry';
                            }
                        }

                        tHtml += `<tr>
                            <td style="font-family: monospace; color:#64748b">${(r.id || '-').toString().substring(0,6)}</td>
                            <td style="font-weight:600; color:#0a3d62">${(r.last_name || '') + ', ' + (r.first_name || '')}</td>
                            <td><span class="badge ${sColor}">${r.validation_status || 'Pending'}</span></td>
                            <td style="font-size:0.75rem; font-weight:700; color:#475569;">${valType}</td>
                            <td style="font-size:0.75rem; color:#475569;">${safe(valRef)}</td>
                            <td>${r.ao8 ? '✅' : '❌'}</td><td>${r.for_ta ? '✅' : '❌'}</td>
                            <td>${r.with_ta ? '✅' : '❌'}</td><td>${r.for_removal ? '✅' : '❌'}</td>
                        </tr>`;
                    });
                    modalBodyEl.innerHTML = tHtml + '</tbody></table>';
                } catch (err) {
                    modalBodyEl.innerHTML = `<p class="empty-msg" style="color:#b91c1c;">❌ Access Denied or Error: ${err.message}</p>`;
                }
            }

            async function displayArboMembershipModal() {
                if (!modalEl || !modalTitleEl || !modalBodyEl) return;

                modalTitleEl.textContent = 'ARBO Membership List';
                modalBodyEl.innerHTML = '<p class="empty-msg">⏳ Fetching Secure Data…</p>';
                modalEl.classList.add('active');

                if (!secureDbClient) {
                    modalBodyEl.innerHTML = '<p class="empty-msg">❌ Database connection required.</p>';
                    return;
                }

                try {
                    let req = secureDbClient
                        .from('arbo_members')
                        .select('id, arbo_id, arb_name, is_arb, membership_no, membership_status, date_from, arbo(name)')
                        .or('membership_status.is.null,membership_status.ilike.ACTIVE,membership_status.ilike.INACTIVE');

                    if (isDarmoPersonnel) {
                        if (window.scopeFilterString) {
                            req = req.or(window.scopeFilterString);
                        } else {
                            req = req.is('id', null); 
                        }
                    }

                    const { data, error } = await req.order('arb_name', { ascending: true });
                    if (error) throw new Error(error.message || JSON.stringify(error));
                    
                    if (!data || data.length === 0) {
                        modalBodyEl.innerHTML = '<p class="empty-msg">📭 No ARBO membership records found in your jurisdiction.</p>';
                        return;
                    }

                    let tHtml = `<table class="modal-table"><thead><tr><th>ARBO</th><th>Member</th><th>Type</th><th>Membership No.</th><th>Member Since</th><th>Status</th></tr></thead><tbody>`;
                    data.forEach(r => {
                        const status = r.membership_status || 'ACTIVE';
                        const statusClass = status === 'ACTIVE' ? 'badge-success' : 'badge-warning';
                        const memberType = r.is_arb ? 'ARB' : 'NON-ARB';
                        const arboName = Array.isArray(r.arbo) ? r.arbo[0]?.name : r.arbo?.name;
                        const joined = r.date_from ? new Date(r.date_from + 'T00:00:00').toLocaleDateString('en-PH') : '—';
                        tHtml += `<tr>
                            <td style="font-weight:600; color:#0a3d62">${arboName || 'ARBO #' + r.arbo_id}</td>
                            <td style="font-weight:600">${r.arb_name || '—'}</td>
                            <td><span class="badge ${r.is_arb ? 'badge-success' : 'badge-warning'}">${memberType}</span></td>
                            <td>${r.membership_no || '—'}</td>
                            <td>${joined}</td>
                            <td><span class="badge ${statusClass}">${status}</span></td>
                        </tr>`;
                    });
                    modalBodyEl.innerHTML = tHtml + '</tbody></table>';
                } catch (err) {
                    modalBodyEl.innerHTML = `<p class="empty-msg" style="color:#b91c1c;">❌ Access Denied or Error: ${err.message}</p>`;
                }
            }

            function createDonutHTML(value, total, color, label) {
                const percentage = total === 0 ? 0 : Math.min(100, Math.round((value / total) * 100));
                return `
                    <div class="chart-item">
                        <svg viewBox="0 0 36 36">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle-chart" stroke="${color}"
                                stroke-dasharray="${percentage}, 100"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="20.35" class="donut-text">${value}</text>
                        </svg>
                        <div class="chart-label">${label}</div>
                    </div>
                `;
            }

            function normalizedMunicipality(value) {
                return String(value || '').trim().replace(/\s+/g, ' ').toUpperCase();
            }

            function municipalityFilter(municipalities) {
                return municipalities.map(name =>
                    `municipality.ilike."${String(name).replace(/"/g, '""')}"`
                ).join(',');
            }

            async function renderMunicipalityProgress(municipalities, allowedArbIds = null) {
                const cardEl = document.getElementById('municipalityProgressCard');
                const chartEl = document.getElementById('municipalityBarChart');
                if (!cardEl || !chartEl || !secureDbClient) return;

                cardEl.style.display = 'block';
                chartEl.innerHTML = '<p class="municipality-progress-empty">Loading municipality progress…</p>';

                if (!municipalities.length) {
                    chartEl.innerHTML = '<p class="municipality-progress-empty">No assigned municipality was found.</p>';
                    return;
                }

                const canonicalByName = new Map(municipalities.map(name => [normalizedMunicipality(name), name]));
                const allowedSet = Array.isArray(allowedArbIds) ? new Set(allowedArbIds.map(String)) : null;
                const filter = municipalityFilter(municipalities);

                const [landholdingRows, arboRows] = await Promise.all([
                    fetchAllRecords(() => secureDbClient.from('arb_landholdings')
                        .select('arb_profile_id, municipality').or(filter)),
                    fetchAllRecords(() => secureDbClient.from('arbo')
                        .select('id, municipality').or(filter))
                ]);

                const profileIds = [...new Set((landholdingRows || [])
                    .map(row => row.arb_profile_id).filter(Boolean).map(String))];
                const profileRows = profileIds.length
                    ? await fetchInChunks('arb_profiles', 'id, arb_id', 'id', profileIds)
                    : [];
                const arbIdByProfile = new Map(profileRows.map(row => [String(row.id), String(row.arb_id)]));
                const municipalitiesByArb = new Map();

                (landholdingRows || []).forEach(row => {
                    const municipality = canonicalByName.get(normalizedMunicipality(row.municipality));
                    const arbId = arbIdByProfile.get(String(row.arb_profile_id));
                    if (!municipality || !arbId || (allowedSet && !allowedSet.has(arbId))) return;
                    if (!municipalitiesByArb.has(arbId)) municipalitiesByArb.set(arbId, new Set());
                    municipalitiesByArb.get(arbId).add(municipality);
                });

                const arboMunicipalityById = new Map();
                (arboRows || []).forEach(row => {
                    const municipality = canonicalByName.get(normalizedMunicipality(row.municipality));
                    if (municipality) arboMunicipalityById.set(String(row.id), municipality);
                });

                const arboIds = [...arboMunicipalityById.keys()];
                const arboLinkedArbs = arboIds.length
                    ? await fetchInChunks('arb', 'id, validation_status, arbo_id', 'arbo_id', arboIds)
                    : [];

                arboLinkedArbs.forEach(row => {
                    const arbId = String(row.id);
                    if ((allowedSet && !allowedSet.has(arbId)) || municipalitiesByArb.has(arbId)) return;
                    const municipality = arboMunicipalityById.get(String(row.arbo_id));
                    if (municipality) municipalitiesByArb.set(arbId, new Set([municipality]));
                });

                const municipalityArbIds = [...municipalitiesByArb.keys()];
                const landholdingLinkedArbs = municipalityArbIds.length
                    ? await fetchInChunks('arb', 'id, validation_status', 'id', municipalityArbIds)
                    : [];
                const arbRowsById = new Map();
                [...arboLinkedArbs, ...landholdingLinkedArbs].forEach(row => arbRowsById.set(String(row.id), row));

                const progress = new Map(municipalities.map(name => [name, { total: 0, validated: 0 }]));
                municipalitiesByArb.forEach((municipalitySet, arbId) => {
                    const arb = arbRowsById.get(String(arbId));
                    if (!arb) return;
                    municipalitySet.forEach(municipality => {
                        const item = progress.get(municipality);
                        if (!item) return;
                        item.total += 1;
                        if (String(arb.validation_status || '').toUpperCase() === 'VALIDATED') item.validated += 1;
                    });
                });

                chartEl.innerHTML = municipalities.map(name => {
                    const item = progress.get(name) || { total: 0, validated: 0 };
                    const percentage = item.total ? Math.round((item.validated / item.total) * 100) : 0;
                    return `<div class="municipality-bar-row">
                        <div class="municipality-bar-meta">
                            <span class="municipality-name">${safe(name)}</span>
                            <span class="municipality-result">${item.validated.toLocaleString()} / ${item.total.toLocaleString()} &nbsp; <span class="municipality-percent">${percentage}%</span></span>
                        </div>
                        <div class="municipality-track" role="progressbar" aria-label="${safe(name)} validation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percentage}">
                            <div class="municipality-fill" style="width:${percentage}%"></div>
                        </div>
                    </div>`;
                }).join('');
            }

            // --- MAIN EXECUTION PIPELINE ---
            try {
                const gridEl = document.getElementById('statsGrid');
                const chartsEl = document.getElementById('chartsContainer');

                if (!secureDbClient) {
                    await buildNavbar(null);
                    if (gridEl) gridEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">🔌</div><div class="label" style="color:#b91c1c;">System Offline</div></div>`;
                    return;
                }

                const { data: authData } = await secureDbClient.auth.getUser();
                if (!authData || !authData.user) {
                    await buildNavbar(null);
                    if (gridEl) gridEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">🔒</div><div class="label">Security Lockout</div><button onclick="window.location.href='login.html'" class="btn btn-primary" style="margin-top:15px;">Login</button></div>`;
                    return;
                }

                const { data: profile } = await secureDbClient.from('profiles').select('*').eq('id', authData.user.id).single();

                if (String(profile?.role || '').toUpperCase() === 'ARBO ADMIN') {
                    window.location.replace('arbo.html');
                    return;
                }

                isDarmoPersonnel = String(profile?.role || '').toUpperCase() === 'DARMO PERSONNEL';
                await buildNavbar(profile);

                let counts = [0, 0, 0, 0, 0, 0, 0];
                let totalArbs = 0;
                let visibleMunicipalities = [...MUNICIPALITIES];

                // -------------------------------------------------------------
                // EXACT COPY OF YOUR ARB.HTML JURISDICTION GENERATOR 
                // -------------------------------------------------------------
                if (isDarmoPersonnel) {
                    const today = new Date().toISOString().slice(0, 10);
                    const { data: scopes } = await secureDbClient.from('validator_access_scopes')
                        .select('municipality,barangay')
                        .eq('validator_user_id', profile.id)
                        .eq('is_active', true)
                        .lte('assigned_from', today);
                        
                    const userScopes = (scopes || []).filter(s => !s.assigned_until || s.assigned_until >= today);
                    const assignedMunicipalities = new Set(userScopes.map(scope => normalizedMunicipality(scope.municipality)));
                    visibleMunicipalities = MUNICIPALITIES.filter(name => assignedMunicipalities.has(normalizedMunicipality(name)));
                    let allowedIds = new Set();
                    
                    for (const scope of userScopes) {
                        // 1. Gather via ARBOs using fetchAllRecords
                        let qArbo = () => {
                            let q = secureDbClient.from('arbo').select('id').ilike('municipality', scope.municipality);
                            if (scope.barangay) {
                                const parts = scope.barangay.match(/^(.*?)(?:\((.*?)\))?$/);
                                const p1 = parts[1] ? parts[1].trim() : '';
                                const p2 = parts[2] ? parts[2].trim() : '';
                                let conds = [`barangay.ilike.%${scope.barangay}%`];
                                if (p1) conds.push(`barangay.ilike.%${p1}%`);
                                if (p2) conds.push(`barangay.ilike.%${p2}%`);
                                q = q.or(conds.join(','));
                            }
                            return q;
                        };
                        const arboData = await fetchAllRecords(qArbo);
                        if (arboData && arboData.length > 0) {
                            const arbs = await fetchInChunks('arb', 'id', 'arbo_id', arboData.map(a => a.id));
                            arbs.forEach(a => allowedIds.add(String(a.id)));
                        }

                        // 2. Gather via Landholdings using fetchAllRecords
                        let qLand = () => {
                            let q = secureDbClient.from('arb_landholdings').select('arb_profile_id').ilike('municipality', scope.municipality);
                            if (scope.barangay) {
                                const parts = scope.barangay.match(/^(.*?)(?:\((.*?)\))?$/);
                                const p1 = parts[1] ? parts[1].trim() : '';
                                const p2 = parts[2] ? parts[2].trim() : '';
                                let conds = [`barangay.ilike.%${scope.barangay}%`];
                                if (p1) conds.push(`barangay.ilike.%${p1}%`);
                                if (p2) conds.push(`barangay.ilike.%${p2}%`);
                                q = q.or(conds.join(','));
                            }
                            return q;
                        };
                        const landData = await fetchAllRecords(qLand);
                        if (landData && landData.length > 0) {
                            const profIds = [...new Set(landData.map(l => l.arb_profile_id).filter(Boolean))];
                            if (profIds.length > 0) {
                                const profs = await fetchInChunks('arb_profiles', 'arb_id', 'id', profIds);
                                profs.forEach(p => { if (p.arb_id) allowedIds.add(String(p.arb_id)); });
                            }
                        }
                    }
                    
                    window.darmoAllowedArbIds = [...allowedIds];

                    // Generate the arbo_members filter exactly like arb.html
                    const filterParts = userScopes.map(s => {
                        const m = s.municipality ? s.municipality.replace(/"/g, '""') : '';
                        const b = s.barangay ? s.barangay.replace(/"/g, '""') : '';
                        if (m && b) return `and(municipality.eq."${m}",barangay.eq."${b}")`;
                        else if (m) return `municipality.eq."${m}"`;
                        return null;
                    }).filter(Boolean);
                    if (filterParts.length > 0) window.scopeFilterString = filterParts.join(',');

                    // Retrieve statistics in memory to bypass PostgREST limits
                    const finalArbs = await fetchInChunks('arb', 'id, validation_status, ao8, for_ta, with_ta, for_removal', 'id', window.darmoAllowedArbIds);
                    
                    counts[0] = finalArbs.length; 
                    counts[1] = finalArbs.filter(a => a.validation_status === 'Validated').length;
                    counts[2] = finalArbs.filter(a => a.ao8 === true).length;
                    counts[3] = finalArbs.filter(a => a.for_ta === true).length;
                    counts[4] = finalArbs.filter(a => a.with_ta === true).length;
                    counts[5] = finalArbs.filter(a => a.for_removal === true).length;

                    let arboMemReq = secureDbClient.from('arbo_members')
                        .select('id', { count: 'exact', head: true })
                        .or('membership_status.is.null,membership_status.ilike.ACTIVE,membership_status.ilike.INACTIVE');
                        
                    if (window.scopeFilterString) arboMemReq = arboMemReq.or(window.scopeFilterString);
                    else arboMemReq = arboMemReq.is('id', null);
                    
                    const arboMemRes = await arboMemReq;
                    if (arboMemRes.error) throw new Error(arboMemRes.error.message);
                    counts[6] = arboMemRes.count || 0;
                    
                    totalArbs = counts[0];

                } else {
                    // -------------------------------------------------------------
                    // GLOBAL ADMIN LOGIC (No jurisdiction filters needed)
                    // -------------------------------------------------------------
                    function buildArbQuery() { return secureDbClient.from('arb').select('id', { count: 'exact', head: true }); }
                    
                    const qrs = await Promise.all([
                        buildArbQuery(),
                        buildArbQuery().eq('validation_status', 'Validated'),
                        buildArbQuery().eq('ao8', true),
                        buildArbQuery().eq('for_ta', true),
                        buildArbQuery().eq('with_ta', true),
                        buildArbQuery().eq('for_removal', true),
                        secureDbClient.from('arbo_members').select('id', { count: 'exact', head: true })
                            .or('membership_status.is.null,membership_status.ilike.ACTIVE,membership_status.ilike.INACTIVE')
                    ]);
                    
                    const failedQuery = qrs.find(r => r.error != null);
                    if (failedQuery) throw new Error(failedQuery.error.message);
                    
                    counts = qrs.map(r => r.count || 0);
                    totalArbs = counts[0];
                }

                // -------------------------------------------------------------
                // UI RENDER
                // -------------------------------------------------------------
                const stats = [
                    { label: isDarmoPersonnel ? 'YOUR ARBs' : 'GLOBAL ARBs', count: counts[0], color: '#0a3d62', fField: null, fVal: null },
                    { label: 'VALIDATED', count: counts[1], color: '#2e7d32', fField: 'validation_status', fVal: 'Validated' },
                    { label: 'AO 8', count: counts[2], color: '#e8a317', fField: 'ao8', fVal: true },
                    { label: 'For TA', count: counts[3], color: '#f59e0b', fField: 'for_ta', fVal: true },
                    { label: 'With TA', count: counts[4], color: '#3b82f6', fField: 'with_ta', fVal: true },
                    { label: 'For Removal', count: counts[5], color: '#b91c1c', fField: 'for_removal', fVal: true },
                    { label: 'ARBO MEMBERSHIP', count: counts[6], color: '#7c3aed', mode: 'arbo_membership' }
                ];

                if (chartsEl) {
                    let chartsHTML = '';
                    stats.forEach(st => {
                        chartsHTML += createDonutHTML(st.count, totalArbs, st.color, st.label);
                    });
                    chartsEl.innerHTML = chartsHTML;
                    chartsEl.style.display = 'flex'; 
                }

                if (gridEl) {
                    gridEl.innerHTML = '';
                    stats.forEach(st => {
                        const div = document.createElement('div');
                        div.className = 'stat-card';
                        div.style.borderLeftColor = st.color;
                        div.innerHTML = `<div class="number">${st.count}</div><div class="label">${st.label}</div>`;
                        div.addEventListener('click', () => {
                            if (st.mode === 'arbo_membership') displayArboMembershipModal();
                            else displayModal(st.label, st.fField, st.fVal);
                        });
                        gridEl.appendChild(div);
                    });
                }

                renderMunicipalityProgress(
                    visibleMunicipalities,
                    isDarmoPersonnel ? window.darmoAllowedArbIds : null
                ).catch(err => {
                    console.error('Municipality progress error:', err);
                    const cardEl = document.getElementById('municipalityProgressCard');
                    const chartEl = document.getElementById('municipalityBarChart');
                    if (cardEl) cardEl.style.display = 'block';
                    if (chartEl) chartEl.innerHTML = `<p class="municipality-progress-empty" style="color:#b91c1c;">Unable to load municipality progress: ${safe(err.message)}</p>`;
                });

                popToast('Dashboard Sync Complete', 'ok');

            } catch (fatalObj) {
                const gEl = document.getElementById('statsGrid');
                if (gEl) gEl.innerHTML = `<div class="stat-card" style="border-left-color:#b91c1c; grid-column: 1 / -1; cursor: default;"><div class="number">❌</div><div class="label" style="color:#b91c1c;">Execution Failed</div><p>${fatalObj.message}</p></div>`;
            }

        })();
    </script>
</body>
</html>
