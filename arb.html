                );

                async function renderServerPage(page) {
                    const resultsEl =
                        document.getElementById(
                            'arbFilterResults'
                        );

                    if (!resultsEl) return;

                    resultsEl.innerHTML = `
                        <p class="empty-msg">
                            ⏳ Loading ARB records...
                        </p>
                    `;

                    const searchType =
                        document.getElementById(
                            'serverSearchType'
                        ).value;
                    const term = String(
                        document.getElementById(
                            'serverSearchTerm'
                        ).value || ''
                    ).trim();
                    const lifeFilter =
                        document.getElementById(
                            'serverLifeFilter'
                        ).value;
                    const validationFilter =
                        document.getElementById(
                            'serverValidationFilter'
                        ).value;
                    const from = page * pageSize;
                    const to = from + pageSize - 1;

                    try {
                        let arbs = [];
                        let profiles = [];
                        let totalRows = 0;
                        const profileFirst = [
                            'fb_name',
                            'sequence',
                            'district'
                        ].includes(searchType);

                        if (profileFirst) {
                            let profileQuery = secureDbClient
                                .from('arb_profiles')
                                .select('*', {
                                    count: 'exact'
                                })
                                .order('arb_id', {
                                    ascending: true
                                })
                                .range(from, to);

                            if (term) {
                                const column =
                                    searchType === 'fb_name'
                                        ? 'fb_name'
                                        : searchType === 'sequence'
                                            ? 'sequence_no'
                                            : 'district';

                                profileQuery = profileQuery.ilike(
                                    column,
                                    `%${term
                                        .replaceAll('%', '\\%')
                                        .replaceAll('_', '\\_')}%`
                                );
                            }

                            if (lifeFilter) {
                                profileQuery = profileQuery.eq(
                                    'life_status',
                                    lifeFilter
                                );
                            }

                            const profileResult =
                                await profileQuery;

                            if (profileResult.error) {
                                throw profileResult.error;
                            }

                            profiles = profileResult.data || [];
                            totalRows = profileResult.count || 0;
                            arbs = await fetchRowsInChunks(
                                'arb',
                                `
                                    id,
                                    first_name,
                                    middle_name,
                                    last_name,
                                    life_status,
                                    validation_status,
                                    arbo:arbo_id (
                                        id,
                                        name,
                                        barangay,
                                        municipality
                                    )
                                `,
                                'id',
                                profiles.map(function (profile) {
                                    return profile.arb_id;
                                })
                            );

                            if (validationFilter) {
                                arbs = arbs.filter(function (arb) {
                                    return (
                                        arb.validation_status ===
                                        validationFilter
                                    );
                                });
                            }
                        } else {
                            let arbQuery = secureDbClient
                                .from('arb')
                                .select(`
                                    id,
                                    first_name,
                                    middle_name,
                                    last_name,
                                    life_status,
                                    validation_status,
                                    arbo:arbo_id (
                                        id,
                                        name,
                                        barangay,
                                        municipality
                                    )
                                `, {
                                    count: 'exact'
                                })
                                .order('id', {
                                    ascending: true
                                })
                                .range(from, to);

                            if (searchType === 'arb_id' && term) {
                                arbQuery = arbQuery.eq('id', term);
                            }

                            if (searchType === 'name' && term) {
                                const token = term
                                    .split(/[(),]/)
                                    .map(function (item) {
                                        return item.trim();
                                    })
                                    .filter(Boolean)[0] || term;
                                const pattern = `%${token
                                    .replaceAll('%', '\\%')
                                    .replaceAll('_', '\\_')}%`;

                                arbQuery = arbQuery.or(
                                    'first_name.ilike.' + pattern +
                                    ',middle_name.ilike.' + pattern +
                                    ',last_name.ilike.' + pattern
                                );
                            }

                            if (lifeFilter) {
                                arbQuery = arbQuery.eq(
                                    'life_status',
                                    lifeFilter
                                );
                            }

                            if (validationFilter) {
                                arbQuery = arbQuery.eq(
                                    'validation_status',
                                    validationFilter
                                );
                            }

                            const arbResult = await arbQuery;

                            if (arbResult.error) {
                                throw arbResult.error;
                            }

                            arbs = arbResult.data || [];
                            totalRows = arbResult.count || 0;
                            profiles = await fetchRowsInChunks(
                                'arb_profiles',
                                '*',
                                'arb_id',
                                arbs.map(function (arb) {
                                    return String(arb.id);
                                })
                            );
                        }

                        const profileMap = new Map(
                            profiles.map(function (profile) {
                                return [
                                    String(profile.arb_id),
                                    profile
                                ];
                            })
                        );

                        if (arbs.length === 0) {
                            resultsEl.innerHTML = `
                                <p class="empty-msg">
                                    No ARB record matched the filters.
                                </p>
                            `;
                            return;
                        }

                        let html = `
                            <p>
                                <strong>${totalRows}</strong>
                                matching record(s); page
                                ${page + 1}.
                            </p>

                            <table class="modal-table">
                                <thead>
                                    <tr>
                                        <th>ARB</th>
                                        <th>Town</th>
                                        <th>Barangay</th>
                                        <th>District</th>
                                        <th>ARBO</th>
                                        <th>Life</th>
                                        <th>Validation</th>
                                        <th>Classification</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;

                        arbs.forEach(function (arb) {
                            const profile =
                                profileMap.get(String(arb.id)) || {};

                            html += `
                                <tr>
                                    <td><strong>${safe(
                                        fullName(arb)
                                    )}</strong></td>
                                    <td>${displayValue(
                                        arb.arbo?.municipality
                                    )}</td>
                                    <td>${displayValue(
                                        arb.arbo?.barangay
                                    )}</td>
                                    <td>${displayValue(
                                        profile.district
                                    )}</td>
                                    <td>${displayValue(
                                        arb.arbo?.name
                                    )}</td>
                                    <td>${displayValue(
                                        profile.life_status ||
                                        arb.life_status
                                    )}</td>
                                    <td>${displayValue(
                                        arb.validation_status
                                    )}</td>
                                    <td>${displayValue(
                                        profile.split_status
                                    )}</td>
                                    <td>
                                        <a
                                            class="btn btn-primary"
                                            style="text-decoration:none;"
                                            href="arb-profile.html?id=${
                                                encodeURIComponent(arb.id)
                                            }"
                                        >
                                            Open
                                        </a>
                                    </td>
                                </tr>
                            `;
                        });

                        html += `
                                </tbody>
                            </table>

                            <div class="modal-actions">
                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    id="previousArbPageBtn"
                                    ${page === 0 ? 'disabled' : ''}
                                >
                                    Previous
                                </button>

                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    id="nextArbPageBtn"
                                    ${to + 1 >= totalRows
                                        ? 'disabled'
                                        : ''}
                                >
                                    Next
                                </button>
                            </div>
                        `;

                        resultsEl.innerHTML = html;

                        document
                            .getElementById('previousArbPageBtn')
                            ?.addEventListener('click', function () {
                                currentPage = Math.max(
                                    0,
                                    currentPage - 1
                                );
                                renderServerPage(currentPage);
                            });

                        document
                            .getElementById('nextArbPageBtn')
                            ?.addEventListener('click', function () {
                                currentPage += 1;
                                renderServerPage(currentPage);
                            });
                    } catch (err) {
                        resultsEl.innerHTML = `
                            <p
                                class="empty-msg"
                                style="color:#b91c1c;"
                            >
                                ❌ ${safe(err.message)}
                            </p>
                        `;
                    }
                }

                document
                    .getElementById('applyServerFiltersBtn')
                    ?.addEventListener('click', function () {
                        currentPage = 0;
                        renderServerPage(currentPage);
                    });

                document
                    .getElementById('clearServerFiltersBtn')
                    ?.addEventListener('click', function () {
                        document.getElementById(
                            'serverSearchType'
                        ).value = 'name';
                        document.getElementById(
                            'serverSearchTerm'
                        ).value = '';
                        document.getElementById(
                            'serverLifeFilter'
                        ).value = '';
                        document.getElementById(
                            'serverValidationFilter'
                        ).value = '';
                        currentPage = 0;
                        renderServerPage(currentPage);
                    });

                document
                    .getElementById('serverSearchTerm')
                    ?.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter') {
                            currentPage = 0;
                            renderServerPage(currentPage);
                        }
                    });

                await renderServerPage(currentPage);
            }

                    const lifeValues = [

                                })
                                .filter(Boolean)
                        )
                    ].sort();

                    const splitValues = [

                                .map(function (profile) {

                                })
                                .filter(Boolean)
                        )

                                            filters.district

                                    (

                                            filters.arbo
                                    ) &&
                                    (
                                        !filters.life ||
                                        profile.life_status ===
                                            filters.life
                                    ) &&
                                    (

                                            .validation_status ===

                                        )}

                                                btn
                                                btn-primary
                                            "
                                            style="
                                                text-decoration:none;

                                            href="arb-profile.html?id=${

                                                    arb.id

                }

                await loadProfile(arbId);

                popToast(
                    'ARB Profile synchronized.',
                    'ok'
                );
            } catch (fatalObj) {
                const profileContent =
                    document.getElementById(
                        'profileContent'
                    );

                profileContent.innerHTML = `
                    <div
                        style="
                            text-align:center;
                            padding:40px;
                            color:#b91c1c;
                        "
                    >
                        <p>
                            ❌ ${safe(fatalObj.message)}
                        </p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
