<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARB Global Validation – ARB Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        /* -------- Modern DAR Color Scheme (Green & Gold) -------- */
        :root {
            --primary-green: #065F46;
            --hover-green: #047857;
            --dar-gold: #D97706;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --bg-light: #f8fafc;
            --border-light: #e2e8f0;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-dark); background: #f1f5f9; }

        .profile-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--border-light); }
        .profile-header h2 { margin: 0; color: var(--primary-green); font-weight: 600; }

        .management-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-weight: 700; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; color: var(--text-dark); transition: border-color 0.2s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary-green); outline: none; box-shadow: 0 0 0 3px rgba(6, 95, 70, 0.1); }
        .form-group textarea { min-height: 90px; resize: vertical; }

        .checkbox-row { display: flex; gap: 18px; flex-wrap: wrap; padding: 8px 0; }
        .checkbox-row label { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text-dark); }

        .checkbox-column { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
        .checkbox-column label { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-dark); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        .btn-primary { background: var(--primary-green) !important; color: white !important; border: none !important; border-radius: 6px; padding: 8px 16px; font-weight: 600; transition: all 0.2s; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary:hover { background: var(--hover-green) !important; transform: translateY(-1px); }
        .btn-primary:disabled { background: #94a3b8 !important; cursor: not-allowed; opacity: 0.8; transform: none; }

        /* CLEAN, SMALL ACTION BUTTON GRID */
        .action-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; min-width: 140px; }
        .update-validation-btn { grid-column: span 3; }
        .btn-sm { padding: 4px 6px !important; font-size: 0.65rem; text-align: center; border-radius: 4px; width: 100%; box-sizing: border-box; white-space: nowrap; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef08a; color: #713f12; } 
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-neutral { background: #f1f5f9; color: #475569; }

        .arb-table-wrap { overflow-x: auto; margin-top: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border-radius: 8px; background: white; border: 1px solid var(--border-light); }
        .arb-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .arb-table th { background: var(--bg-light); color: var(--primary-green); padding: 12px 8px; text-align: left; border-bottom: 2px solid var(--border-light); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
        .arb-table td { padding: 10px 8px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
        .arb-table tr:hover { background: #f8fafc; }

        .empty-card { color: var(--text-muted); font-style: italic; text-align: center; padding: 40px; }

        .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: var(--bg-light); padding: 16px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border-light); }
        .filter-row .form-group { min-width: 140px; flex: 1; }
        .filter-actions { display: flex; gap: 8px; align-items: center; }

        .search-container { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #ffffff; padding: 16px 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--border-light); }
        .search-container .search-input-group { flex: 3; min-width: 300px; display: flex; }
        
        /* -------- NEW INTELLIGENT SEARCH INPUT -------- */
        .omni-search-input {
            flex: 1;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            font-family: inherit;
            transition: all 0.25s ease-in-out;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.02);
        }
        .omni-search-input:focus {
            border-color: var(--primary-green);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(6, 95, 70, 0.15);
        }

        .search-container .search-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .toggle-filters-btn { background: none; border: none; color: var(--primary-green); font-weight: 700; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: background 0.2s; }
        .toggle-filters-btn:hover { background: #ecfdf5; }

        .advanced-filters { margin-top: 12px; padding: 16px; background: #ffffff; border-radius: 10px; border: 1px solid var(--border-light); display: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .advanced-filters.open { display: block; }
        .advanced-filters .filter-row { background: transparent; padding: 0; margin-bottom: 0; border: none; }

        /* -------- STRICT CONSTANT MODAL UI -------- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.7); z-index: 1000; place-items: center; transition: all 0.3s ease; }
        .modal.active { display: grid; }

        .modal-content { 
            background: #fff; width: 95%; max-width: 1200px; height: 88vh !important; 
            border-radius: 12px; display: flex; flex-direction: column; 
            overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .sub-modal-content { height: auto !important; max-height: 90vh !important; max-width: 650px !important; }

        .modal-header-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: var(--primary-green); color: #fff; border-bottom: 3px solid var(--dar-gold); flex-shrink: 0; }
        .window-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; display: inline-block; padding: 0; margin: 0; transition: transform 0.2s; }
        .window-btn:hover { transform: scale(1.1); }
        .btn-close-win { background: #ff5f56; }
        .btn-min-win { background: #ffbd2e; }
        .btn-max-win { background: #27c93f; }

        .modal-body-scroll { padding: 0; overflow-y: auto; flex: 1; background: var(--bg-light); display: flex; flex-direction: column; height: 100%; } 

        .profile-modal { display: flex; flex-direction: column; overflow: hidden; height: 100%; flex: 1; } 
        .profile-modal .modal-body { display: flex; flex: 1; overflow: hidden; background: #fff; height: 100%; }

        .profile-sidebar { width: 280px; min-width: 250px; background: #f8fafc; padding: 30px 20px; border-right: 1px solid var(--border-light); overflow-y: auto; flex-shrink: 0; height: 100%; box-sizing: border-box; }
        .profile-sidebar .avatar { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(145deg, var(--primary-green), #047857); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; margin: 0 auto 16px; border: 4px solid #d1fae5; object-fit: cover; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .profile-sidebar .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-sidebar .sidebar-name { text-align: center; font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; color: var(--primary-green); line-height: 1.2; }
        .profile-sidebar .sidebar-id { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; font-family: monospace; }
        .profile-sidebar .badge-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .profile-sidebar .sidebar-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .profile-sidebar .sidebar-actions .btn { width: 100%; padding: 12px; font-weight: 600; border-radius: 8px; }

        .profile-tabs { flex: 1; padding: 24px 30px; background: white; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; min-width: 0; }
        .profile-tabs .tab-nav { display: flex; gap: 10px; border-bottom: 2px solid var(--border-light); margin-bottom: 24px; flex-wrap: wrap; flex-shrink: 0; }
        .profile-tabs .tab-nav button { background: none; border: none; padding: 10px 20px; font-weight: 600; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-size: 0.95rem; }
        .profile-tabs .tab-nav button:hover { color: var(--primary-green); }
        .profile-tabs .tab-nav button.active { color: var(--primary-green); border-bottom-color: var(--primary-green); }

        .profile-tabs .tab-content { display: none; flex: 1; overflow-y: auto; padding-right: 15px; min-height: 0; }
        .profile-tabs .tab-content.active { display: block; }

        .profile-tabs .tab-content h4 { margin-top: 0; color: var(--primary-green); border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; font-size: 1.15rem; font-weight: 600; }
        .profile-tabs .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 40px; margin-bottom: 30px; }
        .profile-tabs .detail-item { display: flex; flex-direction: column; border-bottom: 1px solid #f1f5f9; padding: 8px 0; }
        .profile-tabs .detail-item .label { font-size: 0.8rem; font-weight: 500; color: #64748b; margin-bottom: 4px; }
        .profile-tabs .detail-item .value { font-size: 1rem; color: var(--text-dark); font-weight: 400; word-break: break-word; }

        .table-wrap { overflow-x: auto; border: 1px solid var(--border-light); border-radius: 8px; }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .table-wrap th { background: var(--bg-light); color: var(--primary-green); padding: 12px 10px; text-align: left; border-bottom: 2px solid var(--border-light); font-weight: 700; }
        .table-wrap td { padding: 12px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }

        @media (max-width: 800px) {
            .profile-modal .modal-body { flex-direction: column; }
            .profile-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-light); padding: 20px; }
            .profile-tabs .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 style="color: var(--primary-green); font-weight: 800; margin-bottom: 20px;">🏛️ ARB Global Validation <small style="color: var(--dar-gold); font-size: 1.2rem; font-weight: 600;">ARB Management</small></h1>

    <nav class="nav" id="mainNav"></nav>

    <div class="search-container">
        <div class="search-input-group">
            <input id="globalSearchInput" class="omni-search-input" placeholder="✨ Intelligent Search: Type Name, ID, Title, Landholding, CoCROM, Sequence, or Location..." autocomplete="off" aria-label="Search">
        </div>
        <div class="search-actions">
            <button type="button" class="btn btn-primary" id="globalSearchBtn" style="padding: 14px 20px; font-size: 1.05rem;">🔍 Search</button>
            <button type="button" class="toggle-filters-btn" id="toggleFiltersBtn">⚙️ Advanced Filters</button>
            <button type="button" class="btn btn-primary" id="refreshListBtn">🔄 Refresh</button>
            <button type="button" class="btn btn-primary" id="batchValidateBtn">✅ Batch Validate</button>
            <button type="button" class="btn btn-primary" id="generateReportBtn">📄 Print Validation Form</button>
        </div>
    </div>

    <div class="advanced-filters" id="advancedFilters">
        <div class="filter-row" id="filterRow">
            <div class="form-group">
                <label for="filterTown">Municipality</label>
                <select id="filterTown"><option value="">All</option></select>
            </div>
            <div class="form-group">
                <label for="filterBarangay">Barangay</label>
                <select id="filterBarangay"><option value="">All</option></select>
            </div>
            <div class="form-group">
                <label for="filterValidation">Validation</label>
                <select id="filterValidation"><option value="">All</option>
                    <option value="Pending">Pending</option>
                    <option value="Validated">Validated</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterSplit">SPLIT Status</label>
                <select id="filterSplit"><option value="">All</option>
                    <option value="SPLIT">SPLIT</option>
                    <option value="NON-SPLIT">NON-SPLIT</option>
                    <option value="PENDING VALIDATION">PENDING VALIDATION</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterAli">With ALI Case</label>
                <select id="filterAli"><option value="">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterTa">With Transfer Action</label>
                <select id="filterTa"><option value="">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterCocrom">Has CoCROM</label>
                <select id="filterCocrom"><option value="">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-group">
                <label for="filterTitleDist">Title Distributed</label>
                <select id="filterTitleDist"><option value="">All</option>
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="filter-actions">
                <button type="button" class="btn btn-primary" id="applyFiltersBtn">Apply Filters</button>
                <button type="button" class="btn btn-primary" id="clearFiltersBtn" style="background:#64748b; border-color:#475569;">Clear</button>
            </div>
        </div>
    </div>

    <div id="arbListContainer">
        <div class="arb-table-wrap">
            <table class="arb-table" id="arbTable">
                <thead>
                    <tr>
                        <th style="width:30px;"><input type="checkbox" id="selectAllArbs" title="Select All on page"></th>
                        <th>Name</th>
                        <th>Title Number</th>
                        <th>Lot No.</th>
                        <th>Area</th>
                        <th>Survey No.</th>
                        <th>Municipality</th>
                        <th>Barangay</th>
                        <th>Validation</th>
                        <th>Life</th>
                        <th>CoCROM</th>
                        <th>TA</th>
                        <th>ALI</th>
                        <th style="min-width: 160px; text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="arbTableBody">
                    <tr><td colspan="14" class="empty-card">⏳ Loading Data... Please wait.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="paginationControls" style="display:flex; justify-content:flex-start; align-items:center; gap:15px; flex-wrap:wrap; margin-top: 15px;">
            <div style="display:flex; gap:10px; align-items:center;">
                <button type="button" class="btn btn-primary" id="prevPageBtn" disabled>Previous</button>
                <span id="pageInfo" style="font-weight: 600; color: var(--primary-green);">Page 1</span>
                <button type="button" class="btn btn-primary" id="nextPageBtn">Next</button>
            </div>
            <div style="display:flex; gap:6px; align-items:center; padding-left:15px; border-left:2px solid #cbd5e1;">
                <span style="font-size:0.85rem; font-weight:700; color:var(--primary-green);">Jump to:</span>
                <input type="number" id="pageJumpInput" min="1" style="width:65px; padding:8px; border:1px solid #cbd5e1; border-radius:6px; text-align:center; font-weight:bold;">
                <button type="button" class="btn btn-primary btn-sm" id="pageJumpBtn" style="width:auto; padding: 8px 14px;">Go</button>
            </div>
        </div>
    </div>

    <!-- Main Profile Modal (Fixed Size) -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modalContentContainer"></div>
    </div>

    <!-- Secondary Forms Modal (Dynamic Size, Overlays Main Modal) -->
    <div id="subModal" class="modal" style="z-index: 1050; background: rgba(15,23,42,0.8);">
        <div class="modal-content sub-modal-content" id="subModalContentContainer"></div>
    </div>

</div>
<div id="toast"></div>

        function safe(value) { return String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
        function displayValue(value) { return (value === null || value === undefined || String(value).trim() === '') ? '—' : safe(value); }
        function formatDateValue(value) {
            if (!value) return '—';
            const d = new Date(value);
            return isNaN(d.getTime()) ? safe(value) : d.toLocaleDateString('en-PH', {year:'numeric', month:'short', day:'numeric'});
        }
        function badge(value, kind='warning') {
            const cls = kind==='success'?'badge-success':kind==='danger'?'badge-danger':kind==='info'?'badge-info':kind==='neutral'?'badge-neutral':'badge-warning';
            return `<span class="badge ${cls}">${displayValue(value)}</span>`;
        }
        function boolBadge(value) { return value ? badge('YES','success') : badge('NO','neutral'); }
        function emptyToNull(value) { const t = String(value ?? '').trim(); return t === '' ? null : t; }
        function fullName(arb) {
            if (!arb) return '—';
            const parts = [arb.last_name ? arb.last_name+',' : '', arb.first_name || '', arb.middle_name || ''].filter(Boolean);
            return parts.join(' ').trim() || '—';
        }
        function arbInitials(arb) {
            const parts = [arb.first_name, arb.last_name].filter(Boolean);
            if (parts.length === 0) return 'ARB';
            return parts.map(p => p.charAt(0).toUpperCase()).join('');
        }

            el.style.borderLeftColor = type==='ok'?'#10b981':type==='warn'?'#facc15':type==='err'?'#f87171':'#e8a317';
            el.style.background = colors[type] || '#1e293b';
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._toastTimer);
            el._toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
        }

        function compressImage(dataUrl, maxWidth=400, quality=0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let scaleSize = maxWidth / img.width;
                    if(scaleSize > 1) scaleSize = 1;
                    canvas.width = img.width * scaleSize;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = dataUrl;
            });
        }

        async function fetchAllRecords(queryBuilderFn) {
            let allRecords = [];
            let p = 0;
            const size = 1000;
            while(true) {
                const {data, error} = await queryBuilderFn().range(p*size, (p+1)*size - 1);
                if (error) { console.error('Fetch error:', error); break; }
                if (!data || data.length === 0) break;
                allRecords.push(...data);
                if (data.length < size) break;
                p++;
            }
            return allRecords;
        }

        async function fetchInChunks(table, selectStr, column, idArray) {
            let results = [];
            const chunkSize = 150; 
            for(let i=0; i<idArray.length; i+=chunkSize) {
                const chunk = idArray.slice(i, i+chunkSize);
                const {data} = await secureDbClient.from(table).select(selectStr).in(column, chunk);
                if(data) results.push(...data);
            }
            return results;
        }

        async function loadArbs(page = 0) {
            const tbody = document.getElementById('arbTableBody');
            if (!tbody) return;
            tbody.innerHTML = `<tr><td colspan="14" class="empty-card">⏳ Loading Data... Please wait.</td></tr>`;

            const selectAllCb = document.getElementById('selectAllArbs');
            if(selectAllCb) selectAllCb.checked = false;

            const town = document.getElementById('filterTown').value;
            const barangay = document.getElementById('filterBarangay').value;
            const validation = document.getElementById('filterValidation').value;
            const split = document.getElementById('filterSplit').value;
            const ali = document.getElementById('filterAli').value;
            const ta = document.getElementById('filterTa').value;
            const cocrom = document.getElementById('filterCocrom').value;
            const titleDist = document.getElementById('filterTitleDist').value;
            const searchTerm = document.getElementById('globalSearchInput').value.trim();

            try {
                let filterSets = [];

                let locationFilterActive = Boolean(town || barangay);
                let profileFilterActive = Boolean(split || cocrom !== '' || titleDist !== '');
                let baseArbFilterActive = Boolean(validation || ali !== '' || ta !== '');

                // Explicit Location Filters
                if (locationFilterActive) {
                    let locIds = new Set();
                    let arboQ = () => {
                        let q = secureDbClient.from('arbo').select('id');
                        if (town) q = q.ilike('municipality', town); 
                        if (barangay) {
                            const parts = barangay.match(/^(.*?)(?:\((.*?)\))?$/);
                            const p1 = parts[1] ? parts[1].trim() : '';
                            const p2 = parts[2] ? parts[2].trim() : '';
                            let conds = [`barangay.ilike.%${barangay}%`];
                            if (p1) conds.push(`barangay.ilike.%${p1}%`);
                            if (p2) conds.push(`barangay.ilike.%${p2}%`);
                            q = q.or(conds.join(','));
                        }
                        return q;
                    };
                    const arboData = await fetchAllRecords(arboQ);
                    if (arboData.length > 0) {
                        const arbs = await fetchInChunks('arb', 'id', 'arbo_id', arboData.map(a => a.id));
                        arbs.forEach(a => locIds.add(String(a.id)));
                    }

                    let landQ = () => {
                        let q = secureDbClient.from('arb_landholdings').select('arb_profile_id');
                        if (town) q = q.ilike('municipality', town);
                        if (barangay) {
                            const parts = barangay.match(/^(.*?)(?:\((.*?)\))?$/);
                            const p1 = parts[1] ? parts[1].trim() : '';
                            const p2 = parts[2] ? parts[2].trim() : '';
                            let conds = [`barangay.ilike.%${barangay}%`];
                            if (p1) conds.push(`barangay.ilike.%${p1}%`);
                            if (p2) conds.push(`barangay.ilike.%${p2}%`);
                            q = q.or(conds.join(','));
                        }
                        return q;
                    };
                    const landData = await fetchAllRecords(landQ);
                    const profIds = [...new Set(landData.map(l => l.arb_profile_id).filter(Boolean))];
                    if (profIds.length > 0) {
                        const profs = await fetchInChunks('arb_profiles', 'arb_id', 'id', profIds);
                        profs.forEach(p => { if(p.arb_id) locIds.add(String(p.arb_id)); });
                    }
                    filterSets.push([...locIds]);
                }

                // Explicit Profile Filters
                if (profileFilterActive) {
                    let profQ = () => {
                        let q = secureDbClient.from('arb_profiles').select('arb_id');
                        if (split) q = q.eq('split_status', split);
                        if (cocrom === 'true') q = q.not('cocrom_no', 'is', null).neq('cocrom_no', '');
                        if (cocrom === 'false') q = q.is('cocrom_no', null);
                        if (titleDist !== '') q = q.eq('is_title_distribute', titleDist === 'true');
                        return q;
                    };
                    const profiles = await fetchAllRecords(profQ);
                    filterSets.push(profiles.map(p => String(p.arb_id)).filter(Boolean));
                }

                // Explicit Arb Flags
                if (baseArbFilterActive) {
                    let arbQ = () => {
                        let q = secureDbClient.from('arb').select('id');
                        if (validation) q = q.eq('validation_status', validation);
                        if (ali !== '') q = q.eq('with_ali_case', ali === 'true');
                        if (ta !== '') q = q.eq('with_ta', ta === 'true');
                        return q;
                    };
                    const arbs = await fetchAllRecords(arbQ);
                    filterSets.push(arbs.map(a => String(a.id)));
                }

                // INTELLIGENT OMNI-SEARCH
                if (searchTerm) {
                    let globalSearchIds = new Set();
                    const safeTerm = searchTerm.replace(/[,"]/g, ' ').replace(/\s+/g, ' ').trim();
                    const pattern = `%${safeTerm}%`;
                    const tokens = safeTerm.split(' ').filter(t => t.length > 0);

                    let arbOr = `generated_arb_id.ilike.${pattern},first_name.ilike.${pattern},last_name.ilike.${pattern},middle_name.ilike.${pattern}`;
                    if (!isNaN(safeTerm) && safeTerm.trim() !== '') arbOr += `,id.eq.${safeTerm}`;
                    if (tokens.length > 1) {
                        const conditions = tokens.map(token => `first_name.ilike.%${token}%,last_name.ilike.%${token}%`).join(',');
                        arbOr += `,` + conditions;
                    }

                    const [arbRes, profRes, lhRes, epcRes, arboRes] = await Promise.all([
                        fetchAllRecords(() => secureDbClient.from('arb').select('id').or(arbOr)),
                        fetchAllRecords(() => secureDbClient.from('arb_profiles').select('arb_id').or(`sequence_no.ilike.${pattern},fb_name.ilike.${pattern}`)),
                        fetchAllRecords(() => secureDbClient.from('arb_landholdings').select('arb_profile_id')
                            .or(`claim_no.ilike.${pattern},survey_no.ilike.${pattern},asp_no.ilike.${pattern},lot_no.ilike.${pattern},lhid.ilike.${pattern},ccloa_title_raw.ilike.${pattern},title_no.ilike.${pattern},title_type.ilike.${pattern},cocrom_certificate_no.ilike.${pattern},cocrom_reference_raw.ilike.${pattern},release_status.ilike.${pattern},ep_cloa_serial_no.ilike.${pattern},original_mother_title_no.ilike.${pattern},municipality.ilike.${pattern},barangay.ilike.${pattern},landowner.ilike.${pattern}`)),
                        fetchAllRecords(() => secureDbClient.from('epcloais_import_profile_matches').select('arb_profile_id')
                            .or(`cocrom_certificate_no.ilike.${pattern},ep_cloa_serial_no.ilike.${pattern},title_no.ilike.${pattern},claim_no.ilike.${pattern},lhid_raw.ilike.${pattern}`)),
                        fetchAllRecords(() => secureDbClient.from('arbo').select('id').or(`name.ilike.${pattern},municipality.ilike.${pattern},barangay.ilike.${pattern}`))
                    ]);

                    arbRes.forEach(r => globalSearchIds.add(String(r.id)));
                    profRes.forEach(r => globalSearchIds.add(String(r.arb_id)));

                    const combinedProfIds = [...new Set([...lhRes.map(r => r.arb_profile_id), ...epcRes.map(r => r.arb_profile_id)].filter(Boolean))];
                    const arboIds = arboRes.map(a => a.id);

                    const resolvingPromises = [];
                    if (combinedProfIds.length > 0) resolvingPromises.push(fetchInChunks('arb_profiles', 'arb_id', 'id', combinedProfIds));
                    else resolvingPromises.push(Promise.resolve([]));

                    if (arboIds.length > 0) resolvingPromises.push(fetchInChunks('arb', 'id', 'arbo_id', arboIds));
                    else resolvingPromises.push(Promise.resolve([]));

                    const [resolvedProfs, resolvedArbs] = await Promise.all(resolvingPromises);
                    resolvedProfs.forEach(p => { if (p.arb_id) globalSearchIds.add(String(p.arb_id)); });
                    resolvedArbs.forEach(a => globalSearchIds.add(String(a.id)));

                    filterSets.push([...globalSearchIds]);
                }

                let finalIds = null;
                if (filterSets.length > 0) {
                    finalIds = filterSets[0];
                    for (let i = 1; i < filterSets.length; i++) {
                        const setB = new Set(filterSets[i]);
                        finalIds = finalIds.filter(id => setB.has(id));
                    }
                    if (finalIds.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="14" class="empty-card">No ARBs match the specific combination of filters.</td></tr>`;
                        document.getElementById('pageInfo').textContent = `Page 1 of 1`;
                        document.getElementById('prevPageBtn').disabled = true;
                        document.getElementById('nextPageBtn').disabled = true;
                        return;
                    }
                }

                let arbs = [];
                if (finalIds !== null) {
                    totalRecords = finalIds.length;
                    const pageIds = finalIds.slice(page * pageSize, (page + 1) * pageSize);

                    if (pageIds.length > 0) {
                        const res = await secureDbClient.from('arb').select(`
                            id, first_name, middle_name, last_name, validation_status, life_status,
                            with_ali_case, ali_case_status, ali_case_type, with_ta, for_disqualification, generated_arb_id,
                            arbo:arbo_id ( id, name, municipality, barangay )
                        `).in('id', pageIds).order('id', { ascending: true });

                        if (res.error) throw res.error;
                        arbs = res.data;
                    }
                } else {
                    const res = await secureDbClient.from('arb').select(`
                        id, first_name, middle_name, last_name, validation_status, life_status,
                        with_ali_case, ali_case_status, ali_case_type, with_ta, for_disqualification, generated_arb_id,
                        arbo:arbo_id ( id, name, municipality, barangay )
                    `, { count: 'exact' })
                    .order('id', { ascending: true })
                    .range(page * pageSize, (page + 1) * pageSize - 1);

                    if (res.error) throw res.error;
                    arbs = res.data;
                    totalRecords = res.count || 0;
                }

                if (arbs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="14" class="empty-card">No ARBs match the filters.</td></tr>`;
                } else {
                    const arbIds = arbs.map(a => String(a.id));

                    // Fetch Profiles robustly
                    const { data: profileData } = await secureDbClient.from('arb_profiles').select(`
                        id, arb_id, split_status, cocrom_no, is_title_distribute, generated_arb_ic, fb_name, life_status
                    `).in('arb_id', arbIds);

                    const profileMap = {};
                    const profIds = [];
                    (profileData || []).forEach(p => { 
                        profileMap[p.arb_id] = p; 
                        if (p.id) profIds.push(p.id);
                    });

                    // Fetch Landholdings robustly
                    let lhData = [];
                    if (profIds.length > 0) {
                        const { data: landholdings } = await secureDbClient.from('arb_landholdings').select(`
                            arb_profile_id, municipality, barangay, title_no, ep_cloa_serial_no, ccloa_title_raw, survey_no, lot_no, landholding_area, cocrom_certificate_no
                        `).in('arb_profile_id', profIds);
                        lhData = landholdings || [];
                    }

                    const lhMap = {};
                    lhData.forEach(lh => {
                        if(!lhMap[lh.arb_profile_id]) lhMap[lh.arb_profile_id] = [];
                        lhMap[lh.arb_profile_id].push(lh);
                    });

                    let html = '';
                    arbs.forEach(arb => {
                        const profile = profileMap[String(arb.id)] || {};
                        const arbo = arb.arbo || {};
                        const arbLhs = profile.id ? (lhMap[profile.id] || []) : [];

                        let dispMunicipality = arbo.municipality || '—';
                        let dispBarangay = arbo.barangay || '—';
                        let dispTitle = '—';
                        let dispLot = '—';
                        let dispArea = '—';
                        let dispSurvey = '—';
                        let dispCocrom = '—';

                        if (arbLhs.length > 0) {
                            const validLandholding = arbLhs.find(l => l.municipality);
                            if (validLandholding) {
                                dispMunicipality = validLandholding.municipality;
                                dispBarangay = validLandholding.barangay || dispBarangay;
                            }
                            const lh = arbLhs[0];
                            dispTitle = lh.title_no || lh.ep_cloa_serial_no || lh.ccloa_title_raw || '—';
                            dispLot = lh.lot_no || '—';
                            dispArea = lh.landholding_area || '—';
                            dispSurvey = lh.survey_no || '—';
                            dispCocrom = profile.cocrom_no || lh.cocrom_certificate_no || '—';
                        } else {
                            dispCocrom = profile.cocrom_no || '—';
                        }

                        let aliTag = badge('NO', 'neutral');
                        if (arb.with_ali_case) {
                            const safeName = safe(fullName(arb)).replace(/'/g, "\\'");
                            const safeType = safe(arb.ali_case_type || 'Type Unknown').replace(/'/g, "\\'");
                            const safeStatus = safe(arb.ali_case_status || 'Status Unknown').replace(/'/g, "\\'");
                            aliTag = `<span class="badge badge-danger" style="cursor:pointer; box-shadow: 0 0 0 2px rgba(220,38,38,0.4);" title="Click to view ALI status" onclick="window.showAliInfo('${safeName}', '${safeType}', '${safeStatus}')">YES 🔍</span>`;
                        }

                        const taTag = arb.with_ta ? badge('YES','warning') : badge('NO', 'neutral');
                        const cocromTag = (dispCocrom !== '—') ? badge('YES','success') : badge('NO', 'neutral');

                        const validationBadge = badge(arb.validation_status || 'PENDING', arb.validation_status==='Validated'?'success':arb.validation_status==='Rejected'?'danger':'warning');
                        const lStatus = arb.life_status || profile.life_status || 'UNKNOWN';
                        const lifeBadge = badge(lStatus, lStatus==='Active'?'success':lStatus==='Dead'?'danger':'neutral');

                        html += `<tr>
                            <td><input type="checkbox" class="arb-select-cb" value="${arb.id}"></td>
                            <td>
                                <strong style="color:var(--text-dark); font-size:0.95rem;">${safe(fullName(arb))}</strong>
                                <div style="font-size:0.75rem; color:var(--text-muted); font-family:monospace; margin-top:2px;">${displayValue(arb.generated_arb_id || profile.generated_arb_ic || arb.id)}</div>
                            </td>
                            <td>${displayValue(dispTitle)}</td>
                            <td>${displayValue(dispLot)}</td>
                            <td>${displayValue(dispArea)}</td>
                            <td>${displayValue(dispSurvey)}</td>
                            <td>${displayValue(dispMunicipality)}</td>
                            <td>${displayValue(dispBarangay)}</td>
                            <td>${validationBadge}</td>
                            <td>${lifeBadge}</td>
                            <td>${cocromTag}</td>
                            <td>${taTag}</td>
                            <td>${aliTag}</td>
                            <td>
                                <div class="action-group">
                                    <button class="btn btn-primary btn-sm view-arb-btn" data-arb-id="${arb.id}">View</button>
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm edit-arb-btn" data-arb-id="${arb.id}">Edit</button>` : ''}
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm tag-arb-btn" data-arb-id="${arb.id}">ALI TAG</button>` : ''}
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm gen-id-btn" data-arb-id="${arb.id}" data-name="${safe(fullName(arb))}">ID</button>` : ''}
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm photo-btn" data-arb-id="${arb.id}">Photo</button>` : ''}
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm arbo-btn" data-arb-id="${arb.id}">ARBO</button>` : ''}
                                    ${canEdit() ? `<button class="btn btn-primary btn-sm update-validation-btn" data-arb-id="${arb.id}" data-current="${arb.validation_status||'Pending'}">VALIDATE</button>` : ''}
                                </div>
                            </td>
                        </tr>`;
                    });
                    tbody.innerHTML = html;
                }

                const maxPages = Math.ceil(totalRecords/pageSize) || 1;
                document.getElementById('pageInfo').textContent = `Page ${page+1} of ${maxPages}`;
                document.getElementById('prevPageBtn').disabled = (page === 0);
                document.getElementById('nextPageBtn').disabled = (page * pageSize + pageSize >= totalRecords);

                const jumpInput = document.getElementById('pageJumpInput');
                if (jumpInput) {
                    jumpInput.max = maxPages;
                    jumpInput.value = page + 1;
                }

                document.querySelectorAll('.view-arb-btn').forEach(btn => btn.addEventListener('click', () => openArbProfile(btn.dataset.arbId)));
                document.querySelectorAll('.edit-arb-btn').forEach(btn => btn.addEventListener('click', () => openEditArb(btn.dataset.arbId)));
                document.querySelectorAll('.tag-arb-btn').forEach(btn => btn.addEventListener('click', () => openTagArb(btn.dataset.arbId)));
                document.querySelectorAll('.photo-btn').forEach(btn => btn.addEventListener('click', () => openPhotoUpload(btn.dataset.arbId)));
                document.querySelectorAll('.arbo-btn').forEach(btn => btn.addEventListener('click', () => openAssignArbo(btn.dataset.arbId)));

                // Re-routed individual VALIDATE button directly to the full comprehensive validation form
                document.querySelectorAll('.update-validation-btn').forEach(btn => btn.addEventListener('click', () => openValidationForm(btn.dataset.arbId, btn.dataset.current)));

                // Double-click preventer for PDF gen
                document.querySelectorAll('.gen-id-btn').forEach(btn => btn.addEventListener('click', function() {
                    generateArbId(this.dataset.arbId, this.dataset.name, this);
                }));

                document.getElementById('selectAllArbs')?.addEventListener('change', function() {
                    document.querySelectorAll('.arb-select-cb').forEach(cb => cb.checked = this.checked);
                });

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;color:#991b1b;">Error: ${safe(err.message)}</td></tr>`;
                popToast(err.message, 'err');
            }
        }

        async function populateFilterOptions() {
            const townSelect = document.getElementById('filterTown');
            const towns = Object.keys(locData).sort();
            townSelect.innerHTML = '<option value="">All</option>' + towns.map(t => `<option value="${safe(t)}">${safe(t)}</option>`).join('');

            document.getElementById('filterTown').addEventListener('change', function() {
                const barangaySelect = document.getElementById('filterBarangay');
                const selectedTown = this.value;
                if (!selectedTown) {
                    barangaySelect.innerHTML = '<option value="">All</option>';
                    return;
                }
                const barangays = locData[selectedTown].sort();
                barangaySelect.innerHTML = '<option value="">All</option>' + barangays.map(b => `<option value="${safe(b)}">${safe(b)}</option>`).join('');
            });
        }

        async function loadArboList() {
            try {
                const { data } = await secureDbClient.from('arbo').select('id, name').order('name');
                arboList = data || [];
            } catch(e) { console.warn('Failed to load ARBO list:', e); }
        }

        async function openArbProfile(arbId) {
            showModal('ARB Profile', '<p class="empty-msg" style="padding:40px;">Loading ARB profile...</p>');

            try {
                const arbRes = await secureDbClient.from('arb').select(`
                    *, arbo:arbo_id ( id, name, municipality, barangay )
                `).eq('id', arbId).single();
                if (arbRes.error) throw arbRes.error;
                const arb = arbRes.data;

                let profile = {};
                let profileId = null;
                const profRes = await secureDbClient.from('arb_profiles').select('*').eq('arb_id', String(arbId)).single();
                if (profRes.error && profRes.error.code !== 'PGRST116') throw profRes.error;
                if (profRes.data) {
                    profile = profRes.data;
                    profileId = profile.id;
                } else {
                    profile = { id: null };
                }

                let heirs = [], landholdings = [], tags = [], validations = [];
                if (profileId) {
                    const [hRes, lRes, tRes, vRes] = await Promise.all([
                        secureDbClient.from('arb_heirs').select('*').eq('arb_profile_id', profileId).order('created_at', {ascending:true}),
                        secureDbClient.from('arb_landholdings').select('*').eq('arb_profile_id', profileId).order('is_primary', {ascending:false}),
                        secureDbClient.from('arb_tags').select('*').eq('arb_profile_id', profileId).order('created_at', {ascending:false}),
                        secureDbClient.from('arb_validations').select('*').eq('arb_id', arbId).order('date_validated', {ascending:false})
                    ]);
                    heirs = hRes.data || [];
                    landholdings = lRes.data || [];
                    tags = tRes.data || [];
                    validations = vRes.data || [];
                }

                const arbo = arb.arbo || {};

                let dispMunicipality = arbo.municipality;
                let dispBarangay = arbo.barangay;
                let dispTitle = '—';

                if (landholdings && landholdings.length > 0) {
                    const validLandholding = landholdings.find(l => l.municipality);
                    if (validLandholding) {
                        dispMunicipality = validLandholding.municipality;
                        dispBarangay = validLandholding.barangay || dispBarangay;
                    }
                    const lh = landholdings[0];
                    dispTitle = lh.title_no || lh.ep_cloa_serial_no || lh.ccloa_title_raw || '—';
                }

                const body = `
                    <div class="profile-modal">
                        <div class="modal-body">
                            <!-- Sidebar -->
                            <div class="profile-sidebar">
                                <div class="avatar">
                                    ${profile.image_base64 ? `<img src="${profile.image_base64}" alt="Photo">` : safe(arbInitials(arb))}
                                </div>
                                <div class="sidebar-name">${safe(fullName(arb))}</div>
                                <div class="sidebar-id">${displayValue(arb.generated_arb_id || profile.generated_arb_ic || arb.id)}</div>
                                <div class="badge-group">
                                    ${badge(arb.life_status || profile.life_status || 'Unknown', (arb.life_status || profile.life_status)==='Active'?'success':(arb.life_status || profile.life_status)==='Dead'?'danger':'neutral')}
                                    ${badge(arb.validation_status || 'Pending', arb.validation_status==='Validated'?'success':arb.validation_status==='Rejected'?'danger':'warning')}
                                    ${badge(profile.split_status || 'N/A', profile.split_status==='SPLIT'?'warning':'neutral')}
                                </div>
                                <div class="sidebar-actions">
                                    ${profileId ? (canEdit() ? `<button class="btn btn-primary" id="profileEditBtn">✏️ Edit Profile</button>` : '') : `<p class="empty-card" style="font-size:0.8rem;">⚠️ Profile record missing. Please create one via Edit.</p>`}
                                    ${profileId && canEdit() ? `<button class="btn btn-primary" id="profileAddHeirBtn">👪 Add Heir</button>` : ''}
                                    ${profileId && canEdit() ? `<button class="btn btn-primary" id="profileAddTagBtn">⚖️ ALI Tag</button>` : ''}
                                    ${profileId && canEdit() ? `<button class="btn btn-primary" id="profileAddValidationBtn">✅ Validate</button>` : ''}
                                    ${!profileId && canEdit() ? `<button class="btn btn-primary" id="profileCreateProfileBtn">📝 Create Profile</button>` : ''}
                                </div>
                            </div>
                            <!-- Tabs Content -->
                            <div class="profile-tabs">
                                <div class="tab-nav">
                                    <button class="active" data-tab="overview">Profile & Landholdings</button>
                                    <button data-tab="heirs">Heirs (${heirs.length})</button>
                                    <button data-tab="tags">Tags (${tags.length})</button>
                                    <button data-tab="validations">Validations (${validations.length})</button>
                                </div>
                                <div class="tab-content active" id="tab-overview">
                                    ${renderOverview(arb, profile, arbo, dispMunicipality, dispBarangay, dispTitle)}
                                    <h4 style="margin-top:25px; border-bottom:2px solid #e2e8f0; padding-bottom:8px;">Landholding Details</h4>
                                    ${renderLandholdings(landholdings)}
                                </div>
                                <div class="tab-content" id="tab-heirs">
                                    ${renderHeirs(heirs)}
                                </div>
                                <div class="tab-content" id="tab-tags">
                                    ${renderTags(tags)}
                                </div>
                                <div class="tab-content" id="tab-validations">
                                    ${renderValidations(validations)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                showModal(`ARB Profile - ${fullName(arb)}`, body);

                document.querySelectorAll('.tab-nav button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const tabId = this.dataset.tab;
                        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
                        document.getElementById('tab-'+tabId).classList.add('active');
                    });
                });

                if (canEdit()) {
                    if (profileId) {
                        document.getElementById('profileEditBtn')?.addEventListener('click', () => { openEditArb(arbId); });
                        document.getElementById('profileAddHeirBtn')?.addEventListener('click', () => { openHeirForm(arbId); });
                        document.getElementById('profileAddTagBtn')?.addEventListener('click', () => { openTagArb(arbId); });
                        document.getElementById('profileAddValidationBtn')?.addEventListener('click', () => { openValidationForm(arbId, arb.validation_status); });
                    } else {
                        document.getElementById('profileCreateProfileBtn')?.addEventListener('click', async function() {
                            this.disabled = true; this.textContent = "Processing...";
                            try {
                                const { data, error } = await secureDbClient.from('arb_profiles').insert({
                                    arb_id: String(arbId),
                                    created_at: new Date().toISOString(),
                                    updated_at: new Date().toISOString()
                                }).select('id').single();
                                if (error) { popToast('RLS policy error: ' + error.message, 'err'); return; }
                                hideModal();
                                popToast('Profile created successfully. Re-open to edit.', 'ok');
                                openArbProfile(arbId);
                            } catch (e) { popToast(e.message, 'err'); }
                        });
                    }
                }

            } catch (err) {
                const mBody = document.getElementById('modalBody');
                if (mBody) mBody.innerHTML = `<p class="empty-msg" style="color:#991b1b;">❌ ${safe(err.message)}</p>`;
                popToast(err.message, 'err');
            }
        }

        async function openHeirForm(arbId) {

            if (profRes.error) { popToast('Profile not found. Please create profile first.', 'err'); return; }
            const profileId = profRes.data.id;
            const formHtml = `
