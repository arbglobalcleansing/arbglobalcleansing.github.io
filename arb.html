                                    <div class="form-group full" id="finalOwnerSection" style="display:none;padding:12px;border:1px solid #0f766e;border-radius:8px;background:#f0fdfa;">
                                        <label>New Owner / AO8 Transferee (recorded as NON-ARB)</label>
                                        <input name="new_owner_name" id="newOwnerName" placeholder="Complete name">
                                        <input name="new_owner_contact" placeholder="Contact number" style="margin-top:8px;">
                                        <label style="margin-top:8px">Date of Order of Finality</label><input type="date" name="finality_date" id="finalityDate">
                                    </div>
                                    <div class="form-group full" id="heirSection" style="display:none;"><label>Heirs (for Transfer Action)</label><div id="heirList"></div><button type="button" class="btn btn-primary btn-sm" id="addHeirRowBtn">+ Add Heir</button></div>
                                </div>
                                <div class="modal-actions"><button type="button" class="btn btn-primary" id="cancelTagBtn" style="background:#64748b !important;border-color:#475569 !important;">Cancel</button><button type="submit" class="btn btn-primary">Save Tag</button></div>
                            </form>
                        `;
                    showSubModal('Tag ARB', formHtml);

                    const tagTypeSelect = document.getElementById('tagType');
                    const tagStatusSelect = document.getElementById('tagStatus');
                    document.getElementById('aliCategory').addEventListener('change', function() {
                        document.getElementById('aliType').innerHTML = activeAliRows.filter(r => r
                            .ali_category === this.value).map(r =>
                            `<option value="${safe(r.case_type)}">${safe(r.case_type)}</option>`).join(
                            '');
                        updateLandholdingVisibility();
                    });

                    function updateLandholdingVisibility() {
                        const type = tagTypeSelect.value;
                        const aliType = document.getElementById('aliType').value;
                        const affectsWholeLandholding = type === 'CANCELLATION OF TITLE' || (type ===
                            'ALI CASE' && aliType === 'LAND CONVERSION');
                        const group = document.getElementById('tagLandholdingGroup');
                        const select = document.getElementById('tagLandholding');
                        group.style.display = affectsWholeLandholding ? 'flex' : 'none';
                        select.required = affectsWholeLandholding;
                        if (!affectsWholeLandholding) select.value = '';
                    }

                    function updateStatuses() {
                        const type = tagTypeSelect.value;
                        const opts = statusOptions[type] || [];
                        const previousStatus = tagStatusSelect.value;
                        tagStatusSelect.innerHTML = opts.map(s => `<option value="${s}">${s}</option>`).join('');
                        if (opts.includes(previousStatus)) tagStatusSelect.value = previousStatus;
                        document.getElementById('heirSection').style.display = ['TRANSFER ACTION', 'DEAD']
                        .includes(type) ? 'block' : 'none';
                        document.getElementById('reasonGrp').style.display = ['ALI CASE', 'TRANSFER ACTION']
                            .includes(type) ? 'flex' : 'none';
                        document.getElementById('aliCategoryGrp').style.display = type === 'ALI CASE' ?
                            'flex' : 'none';
                        document.getElementById('aliTypeGrp').style.display = type === 'ALI CASE' ? 'flex' :
                            'none';
                        document.getElementById('deathDocSection').style.display = type === 'DEAD' ?
                            'flex' : 'none';
                        document.getElementById('deathDocumentFile').required = type === 'DEAD';
                        updateLandholdingVisibility();
                        const finalMode = type === 'AO8' && tagStatusSelect.value === 'WITH ORDER OF FINALITY';
                        document.getElementById('finalOwnerSection').style.display = finalMode ? 'flex' :
                            'none';
                        document.getElementById('newOwnerName').required = finalMode;
                        document.getElementById('finalityDate').required = finalMode;
                    }
                    tagTypeSelect.addEventListener('change', updateStatuses);
                    tagStatusSelect.addEventListener('change', updateStatuses);
                    document.getElementById('aliType').addEventListener('change', updateLandholdingVisibility);
                    updateStatuses();

                    document.getElementById('addHeirRowBtn')?.addEventListener('click', function() {
                        const container = document.getElementById('heirList');
                        const row = document.createElement('div');
                        row.style.marginBottom = '6px';
                        row.innerHTML = `
                                <input type="text" name="heir_name[]" placeholder="Heir Name" style="width:40%;">
                                <input type="text" name="heir_relation[]" placeholder="Relation" style="width:30%;">
                                <input type="text" name="heir_contact[]" placeholder="Contact" style="width:25%;">
                                <button type="button" class="btn btn-danger btn-sm remove-heir-btn">Remove</button>
                            `;
                        container.appendChild(row);
                        row.querySelector('.remove-heir-btn').addEventListener('click', function() { row
                            .remove(); });
                    });

                    document.getElementById('cancelTagBtn').addEventListener('click', hideSubModal);
                    document.getElementById('tagArbForm').addEventListener('submit', async function(e) {
                        e.preventDefault();
                        const submitBtn = e.target.querySelector('button[type="submit"]');
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Processing...';

                        const fd = new FormData(e.target);
                        const tagType = fd.get('tag_type');
                        const status = fd.get('status');
                        const caseRef = emptyToNull(fd.get('case_reference_no'));
                        let caseDetails = emptyToNull(fd.get('case_details'));
                        const targetDate = fd.get('action_date');
                        const aliCategory = fd.get('ali_category');
                        const aliType = fd.get('ali_type');
                        const requiresLandholding = tagType === 'CANCELLATION OF TITLE' || (tagType ===
                            'ALI CASE' && aliType === 'LAND CONVERSION');
                        const landholdingId = requiresLandholding ? emptyToNull(fd.get(
                            'arb_landholding_id')) : null;

                        try {
                            if (requiresLandholding && !landholdingId) throw new Error(
                                'Select the particular landholding affected by this case.');
                            if (tagType === 'DEAD') {
                                const deathFile = document.getElementById('deathDocumentFile').files[
                                0];
                                if (!deathFile) { popToast(
                                        'A death supporting document is required.', 'warn');
                                    submitBtn.disabled = false;
                                    submitBtn.textContent = 'Save Tag'; return; }
                                if (deathFile.size > MAX_SOURCE_PHOTO_BYTES) { popToast(
                                        'Supporting document must be 12 MB or smaller.',
                                    'warn');
                                    submitBtn.disabled = false;
                                    submitBtn.textContent = 'Save Tag'; return; }
                                const storagePath =
                                    `${arbId}/${crypto.randomUUID()}-${deathFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
                                const upload = await secureDbClient.storage.from(
                                    'arb-supporting-documents').upload(storagePath, deathFile, {
                                    contentType: deathFile.type,
                                    upsert: false
                                });
                                if (upload.error) throw upload.error;
                                const docInsert = await secureDbClient.from(
                                    'arb_supporting_documents').insert({
                                        arb_id: Number(arbId),
                                        arb_profile_id: profileId,
                                        document_type: fd.get('death_document_type'),
                                        storage_path: storagePath,
                                        original_file_name: deathFile.name,
                                        mime_type: deathFile.type,
                                        file_size_bytes: deathFile.size,
                                        uploaded_by: currentUser?.id,
                                        uploaded_by_name: currentUserProfile?.full_name ||
                                            currentUser?.email
                                    }).select('unique_document_no').single();
                                if (docInsert.error) { await secureDbClient.storage.from(
                                        'arb-supporting-documents').remove([storagePath]);
                                    throw docInsert.error; }
                                caseDetails = [caseDetails,
                                    `Supporting document: ${docInsert.data.unique_document_no}`
                                ].filter(Boolean).join(' | ');
                            }

                            if (tagType === 'ALI CASE') {
                                caseDetails =
                                    `[${aliCategory}] [${aliType}] ${caseDetails || ''}`.trim();
                            }

                            const tagPayload = {
                                arb_profile_id: profileId,
                                arb_id: Number(arbId),
                                arb_landholding_id: landholdingId,
                                tag_type: tagType,
                                status: status,
                                case_reference_no: caseRef,
                                case_details: caseDetails,
                                tagged_by: currentUserProfile?.full_name || currentUser?.email ||
                                    null,
                                tagged_by_user_id: currentUser?.id || null,
                                updated_at: new Date().toISOString(),
                                updated_by: currentUserProfile?.full_name || currentUser?.email ||
                                    null,
                                created_at: new Date().toISOString(),
                                ali_category: tagType === 'ALI CASE' ? aliCategory : null,
                                ali_type: tagType === 'ALI CASE' ? aliType : null
                            };

                            const arbUpdate = {};
                            let lifeUpdate = null;
                            switch (tagType) {
                                case 'ALI CASE':
                                    arbUpdate.with_ali_case = true;
                                    arbUpdate.ali_case_status = status;
                                    arbUpdate.ali_case_type = aliType;
                                    break;
                                case 'TRANSFER ACTION':
                                    arbUpdate.with_ta = true;
                                    arbUpdate.for_ta = true;
                                    arbUpdate.ta_status = status;
                                    break;
                                case 'DISQUALIFICATION':
                                    arbUpdate.for_disqualification = true;
                                    arbUpdate.disqualification_reason = caseDetails || status;
                                    break;
                                case 'CANCELLATION OF TITLE':
                                    arbUpdate.for_removal = true;
                                    arbUpdate.removal_reason = caseDetails || status;
                                    break;
                                case 'IDENTIFICATION OF NEW ARB':
                                    break;
                                case 'DISQUALIFICATION AND IDENTIFICATION':
                                    arbUpdate.for_disqualification = true;
                                    arbUpdate.disqualification_reason = caseDetails || status;
                                    break;
                                case 'AO8':
                                    arbUpdate.ao8 = true;
                                    break;
                                case 'DEAD':
                                    arbUpdate.life_status = 'Dead';
                                    lifeUpdate = 'Dead';
                                    break;
                                case 'WITH OPEN CASE':
                                    arbUpdate.with_existing_complain = true;
                                    break;
                            }

                            const { error: tagErr } = await secureDbClient.from('arb_tags').insert(
                                tagPayload);
                            if (tagErr) throw tagErr;

                            if (['ALI CASE', 'TRANSFER ACTION', 'DISQUALIFICATION',
                                    'CANCELLATION OF TITLE', 'IDENTIFICATION OF NEW ARB',
                                    'DISQUALIFICATION AND IDENTIFICATION', 'AO8'
                                ].includes(tagType)) {
                                const { data: existingMon } = await secureDbClient.from(
                                    'arb_legal_monitoring').select('id').eq('arb_id', arbId)
                                    .eq('case_type', tagType).single();
                                const trackingPayload = {
                                    arb_id: arbId,
                                    arb_profile_id: profileId,
                                    arb_landholding_id: landholdingId,
                                    case_type: tagType,
                                    action_category: tagType,
                                    status: status,
                                    current_target_date: targetDate,
                                    case_reference_no: caseRef,
                                    finality_date: emptyToNull(fd.get('finality_date')),
                                    new_owner_name: emptyToNull(fd.get('new_owner_name')),
                                    new_owner_contact: emptyToNull(fd.get(
                                    'new_owner_contact')),
                                    new_owner_is_arb: false,
                                    updated_by: currentUser?.id,
                                    reason_for_rollback: fd.get('rollback_reason'),
                                    remarks: caseDetails
                                };
                                let legalMonitoringId;
                                if (existingMon) {
                                    const { data: updated, error } = await secureDbClient.from(
                                        'arb_legal_monitoring').update(trackingPayload).eq(
                                        'id', existingMon.id).select('id').single();
                                    if (error) throw error;
                                    legalMonitoringId = updated.id;
                                } else {
                                    trackingPayload.created_by = currentUser?.id;
                                    const { data: inserted, error } = await secureDbClient.from(
                                        'arb_legal_monitoring').insert(trackingPayload)
                                        .select('id').single();
                                    if (error) throw error;
                                    legalMonitoringId = inserted.id;
                                }
                                const { error: historyError } = await secureDbClient.from(
                                    'arb_legal_action_history').insert({
                                        legal_monitoring_id: legalMonitoringId,
                                        arb_id: Number(arbId),
                                        arb_landholding_id: landholdingId,
                                        action_type: tagType,
                                        previous_status: null,
                                        new_status: status,
                                        action_date: new Date().toISOString().slice(0,
                                        10),
                                        target_date: targetDate,
                                        case_reference_no: caseRef,
                                        remarks: caseDetails,
                                        acted_by: currentUser?.id,
                                        acted_by_name: currentUserProfile?.full_name ||
                                            currentUser?.email
                                    });
                                if (historyError) throw historyError;
                            }

                            if (Object.keys(arbUpdate).length > 0) {
                                const { error: arbErr } = await secureDbClient.from('arb')
                                    .update(arbUpdate).eq('id', arbId);
                                if (arbErr) throw arbErr;
                            }
                            if (lifeUpdate) {
                                const { error: lifeErr } = await secureDbClient.from(
                                    'arb_profiles').update({ life_status: lifeUpdate })
                                    .eq('arb_id', String(arbId));
                                if (lifeErr) throw lifeErr;
                            }

                            const heirNamesArr = fd.getAll('heir_name[]').filter(Boolean);
                            if (heirNamesArr.length > 0) {
                                const heirs = heirNamesArr.map((name, i) => ({
                                    arb_profile_id: profileId,
                                    heir_name: name,
                                    heir_relation: fd.getAll('heir_relation[]')[i] ||
                                        null,
                                    heir_contact: fd.getAll('heir_contact[]')[i] ||
                                        null,
                                    is_verified: false,
                                    is_selected: false,
                                    created_by: currentUserProfile?.full_name ||
                                        currentUser?.email || null,
                                    updated_by: currentUserProfile?.full_name ||
                                        currentUser?.email || null,
                                    created_at: new Date().toISOString(),
                                    updated_at: new Date().toISOString()
                                }));
                                const { error: heirErr } = await secureDbClient.from(
                                    'arb_heirs').insert(heirs);
                                if (heirErr) throw heirErr;
                            }

                            hideSubModal();
                            popToast('Tag applied successfully.', 'ok');
                            openArbProfile(arbId);
                            loadArbs(currentPage);
                        } catch (err) {
                            if (err.message && err.message.includes('policy')) {
                                popToast(
                                    'RLS policy error: Please ensure you have insert permission on arb_tags and arb_heirs.',
                                    'err');
                            } else {
                                popToast(err.message, 'err');
                            }
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Save Tag';
                        }
                    });
                } catch (e) { popToast(e.message, 'err'); }
            }

            async function generateArbId(arbId, arbName, btnElement) {
                if (!canCaptureAndIssueId()) { popToast('Insufficient permissions.', 'err'); return; }
                if (btnElement) { btnElement.disabled = true;
                    btnElement.textContent = 'Processing...'; }

                try {
                    const arbRes = await secureDbClient.from('arb').select(
                        `*, arbo:arbo_id(name, municipality, barangay)`).eq('id', arbId).single();
                    if (arbRes.error) throw arbRes.error;
                    const arb = arbRes.data;

                    const profRes = await secureDbClient.from('arb_profiles').select(
                        'id, sequence_no, generated_arb_ic, photo_path, image_base64').eq('arb_id', String(arbId))
                        .single();
                    let profile = profRes.data;
                    if (!profile) { popToast('Profile not found. Please create profile first.', 'err'); return; }

                    let seq = profile.sequence_no;
                    if (!seq) {
                        const { count } = await secureDbClient.from('arb_profiles').select('*', { count: 'exact',
                            head: true });
                        seq = String((count || 0) + 1).padStart(6, '0');
                    } else if (!isNaN(seq)) {
                        seq = String(seq).padStart(6, '0');
                    }
                    const newId = `DAR-Camsur-${seq}`;

                    await secureDbClient.from('arb_profiles').update({ generated_arb_ic: newId, sequence_no: seq })
                        .eq('id', profile.id);
                    await secureDbClient.from('arb').update({ generated_arb_id: newId }).eq('id', arbId);

                    const { data: lhData } = await secureDbClient.from('arb_landholdings')
                        .select(
                            'municipality, barangay, title_no, ep_cloa_serial_no, ccloa_title_raw, landholding_area, asp_no, lot_no'
                            )
                        .eq('arb_profile_id', profile.id);

                    let tTown = arb.arbo?.municipality;
                    let tBrgy = arb.arbo?.barangay;
                    if (!tTown && lhData && lhData.length > 0) {
                        const valid = lhData.find(l => l.municipality);
                        if (valid) {
                            tTown = valid.municipality;
                            tBrgy = valid.barangay || tBrgy;
                        }
                    }
                    const address =
                        `${tBrgy ? tBrgy + ', ' : ''}${tTown || ''}`.replace(/,\s*$/, '').trim() ||
                        "Address Not Available";

                    let lhDisp = lhData && lhData.length > 0 ? lhData[0] : {};
                    let tTitle = lhDisp.title_no || lhDisp.ep_cloa_serial_no || lhDisp.ccloa_title_raw || '—';
                    let tArea = lhDisp.landholding_area || '—';
                    let tAsp = lhDisp.asp_no || '—';
                    let tLot = lhDisp.lot_no || '—';

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });

                    doc.setDrawColor(217, 119, 6);
                    doc.setLineWidth(0.8);
                    doc.rect(1, 1, 83.6, 52);
                    doc.setLineWidth(0.2);

                    doc.setFillColor(6, 95, 70);
                    doc.rect(0, 0, 85.6, 12, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(8);
                    doc.setFont("helvetica", "bold");
                    doc.text("DEPARTMENT OF AGRARIAN REFORM", 42.8, 6, { align: "center" });
                    doc.setFontSize(6);
                    doc.setFont("helvetica", "normal");
                    doc.text("AGRARIAN REFORM BENEFICIARY IDENTIFICATION CARD", 42.8, 10, { align: "center" });

                    doc.setTextColor(0, 0, 0);

                    const imgWidth = 20;
                    const imgHeight = 22;
                    const printablePhoto = await imageUrlToJpegDataUrl(await getProfilePhotoUrl(profile)).catch(
                    () => '');
                    if (printablePhoto) {
                        try { doc.addImage(printablePhoto, 'JPEG', 4, 15, imgWidth, imgHeight); } catch (e) {
                            doc.setDrawColor(200, 200, 200);
                            doc.rect(4, 15, imgWidth, imgHeight);
                            doc.text("NO PHOTO", 14, 26, { align: "center" });
                        }
                    } else {
                        doc.setDrawColor(200, 200, 200);
                        doc.rect(4, 15, imgWidth, imgHeight);
                        doc.text("NO PHOTO", 14, 26, { align: "center" });
                    }

                    const qrValue = JSON.stringify({ type: 'DAR_ARB_ID', arb_id: String(arbId), card_no: newId,
                        name: fullName(arb), issued: new Date().toISOString().slice(0, 10) });
                    const qrImage = qrCodeDataUrl(qrValue);
                    if (qrImage) {
                        doc.addImage(qrImage, 'PNG', 68, 15, 13, 13);
                        doc.setFontSize(4.5);
                        doc.setTextColor(71, 85, 105);
                        doc.text('SCAN TO VERIFY', 74.5, 30, { align: 'center' });
                    }

                    doc.setFontSize(8.2);
                    doc.setFont("helvetica", "bold");
                    doc.text(doc.splitTextToSize(String(arbName || fullName(arb)).toUpperCase(), 37), 28, 18);

                    doc.setFontSize(6);
                    doc.setFont("helvetica", "normal");

                    doc.text(`ID No.: ${newId}`, 28, 23);
                    doc.text(`Title No.: ${tTitle}`, 28, 26);
                    doc.text(`Area: ${tArea}   Lot: ${tLot}   ASP: ${tAsp}`, 28, 29);

                    const arboName = arb.arbo?.name || "No ARBO Assigned";
                    const splitArbo = doc.splitTextToSize(`ARBO : ${arboName}`, 55);
                    doc.text(splitArbo, 28, 32);

                    const splitAddress = doc.splitTextToSize(`Address : ${address}`, 55);
                    doc.text(splitAddress, 28, 36);

                    doc.setDrawColor(145, 145, 145);
                    doc.setLineWidth(0.10);
                    doc.line(4, 46, 26, 46);
                    doc.setFontSize(5);
                    doc.text("ARB Signature", 15, 49, { align: "center" });

                    doc.line(50, 46, 80, 46);
                    doc.text("Authorized Signature", 65, 49, { align: "center" });

                    doc.setTextColor(100, 100, 100);
                    doc.text(`Generated: ${new Date().toLocaleDateString()}`, 42.8, 52, { align: "center" });

                    doc.save(`ARB_ID_${newId}.pdf`);

                    popToast(`ARB ID generated and downloaded: ${newId}`, 'ok');
                    loadArbs(currentPage);
                } catch (e) {
                    popToast(e.message, 'err');
                } finally {
                    if (btnElement) { btnElement.disabled = false;
                        btnElement.textContent = 'ID'; }
                }
            }

            async function openPhotoUpload(arbId) {
                if (!canCaptureAndIssueId()) { popToast('Insufficient permissions.', 'err'); return; }
                const formHtml = `

            /**
             * AGGRESSIVE OCR parser – captures EVERY ARB ID found in the text.
             * Scans globally for [ARB:ID], extracts name and any following tokens.
             * Also detects action keywords, actual name, and mobile number.
             */
            function parseOcrArbRows(ocrText) {
                const rows = [];
                const clean = ocrText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                // Step 1: Find all ARB IDs using a global regex
                const arbRegex = /\[ARB\s*:\s*(\d+)\s*\]/gi;
                let match;
                const seenIds = new Set();

                // We'll scan the entire text, but we need the context around each match.
                // We'll extract the substring before and after each match.
                while ((match = arbRegex.exec(clean)) !== null) {
                    const arbId = match[1].trim();
                    if (seenIds.has(arbId)) continue;
                    seenIds.add(arbId);

                    // Get the substring before the match to extract the name
                    const before = clean.substring(0, match.index);
                    const nameMatch = before.match(/([A-Z][A-Z\s,.]+)\s*$/i);
                    let name = nameMatch ? nameMatch[1].trim() : '';

                    // Get the substring after the match to extract tokens
                    const after = clean.substring(match.index + match[0].length);
                    // Take up to 6 tokens (survey, lot, area, title, maybe extra)
                    const tokenMatch = after.match(/^\s*([^\s]+)\s+([^\s]+)\s+([^\s]+)\s+([^\s]+)\s+([^\s]+)?\s+([^\s]+)?/);
                    let survey = '',
                        lot = '',
                        area = '',
                        title = '';
                    if (tokenMatch) {
                        survey = tokenMatch[1] || '';
                        lot = tokenMatch[2] || '';
                        area = tokenMatch[3] || '';
                        title = tokenMatch[4] || '';
                    } else {
                        // Fallback: just take the first 4 tokens after the ARB
                        const tokens = after.trim().split(/\s+/);
                        if (tokens.length > 0) survey = tokens[0];
                        if (tokens.length > 1) lot = tokens[1];
                        if (tokens.length > 2) area = tokens[2];
                        if (tokens.length > 3) title = tokens[3];
                    }

                    // Detect action from the surrounding text (within 200 chars)
                    const context = clean.substring(Math.max(0, match.index - 100), Math.min(clean.length, match.index +
                        200));
                    const contextUpper = context.toUpperCase();
                    let action = null;
                    if (contextUpper.includes('GURANG') && !contextUpper.includes('NO')) action = 'VALIDATED';
                    else if (contextUpper.includes('NAGHALI') && !contextUpper.includes('NO')) action = 'DISQUALIFICATION';
                    else if (contextUpper.includes('BINENTA') && !contextUpper.includes('NO')) action = 'AO8';
                    else if (contextUpper.includes('NAGADAN') && !contextUpper.includes('NO')) action = 'TRANSFER ACTION';

                    // Extract actual name (like "PANGARAN KANG AKTUAL ...")
                    const actualNameMatch = context.match(/(?:AKTUAL|actual)[\s\S]{0,30}([A-Z][A-Z\s,.]+)/i);
                    let actualName = actualNameMatch ? actualNameMatch[1].trim() : null;

                    // Extract mobile number (09...)
                    const mobileMatch = context.match(/(09|0)[0-9]{9,10}/);
                    let mobile = mobileMatch ? mobileMatch[0] : null;

                    // Determine if ARBO MEMBER = YES (search in context)
                    const arboMember = (contextUpper.includes('ARBO') && contextUpper.includes('YES')) ? 'YES' : 'NO';

                    rows.push({
                        arbId,
                        name: name || '',
                        survey: survey || '',
                        lot: lot || '',
                        area: area || '',
                        title: title || '',
                        arboMember,
                        action,
                        actualName,
                        mobile,
                        raw: match[0]
                    });
                }

                return rows;
            }

                }

            /**
             * Perform the appropriate action on an ARB based on the selected action.
             */
            async function performActionOnArb(arbId, action, actualName, mobile, arboId) {
                const today = new Date().toISOString().substring(0, 10);
                const userName = currentUserProfile?.full_name || currentUser?.email || 'System';
                const userId = currentUser?.id || null;

                // Get profile ID
                const profRes = await secureDbClient.from('arb_profiles').select('id').eq('arb_id', String(arbId))
                    .single();
                if (profRes.error) throw new Error('Profile not found for ARB ' + arbId);
                const profileId = profRes.data.id;

                switch (action) {
                    case 'VALIDATED':
                        // Update validation status to Validated
                        const { error: valErr } = await secureDbClient.from('arb')
                            .update({ validation_status: 'Validated', updated_at: new Date().toISOString() })
                            .eq('id', arbId);
                        if (valErr) throw valErr;
                        // Add a validation record
                        const valPayload = {
                            arb_id: Number(arbId),
                            arb_landholding_id: null,
                            validator_type: 'System',
                            validator_name: userName,
                            position: null,
                            date_validated: today,
                            validation_basis: 'GURANG NA — validated from OCR capture',
                            supporting_document_reference: 'OCR Capture',
                            recorded_by: userName,
                            recorded_by_user_id: userId,
                            updated_at: new Date().toISOString()
                        };
                        const { error: vErr } = await saveValidationRecord(valPayload);
                        if (vErr) throw vErr;
                        break;

                    case 'DISQUALIFICATION':
                        // Create a DISQUALIFICATION tag
                        const tagPayload = {
                            arb_profile_id: profileId,
                            arb_id: Number(arbId),
                            arb_landholding_id: null,
                            tag_type: 'DISQUALIFICATION',
                            status: 'FOR DISQUALIFICATION',
                            case_details: 'NAGHALI NA — disqualified based on validation form OCR capture',
                            tagged_by: userName,
                            tagged_by_user_id: userId,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            updated_by: userName
                        };
                        const { error: tagErr } = await secureDbClient.from('arb_tags').insert(tagPayload);
                        if (tagErr) throw tagErr;
                        // Update ARB flag
                        const { error: arbErr } = await secureDbClient.from('arb')
                            .update({ for_disqualification: true, validation_status: 'Rejected',
                                updated_at: new Date().toISOString() })
                            .eq('id', arbId);
                        if (arbErr) throw arbErr;
                        break;

                    case 'AO8':
                        // Create an AO8 tag with the captured name
                        const ao8Payload = {
                            arb_profile_id: profileId,
                            arb_id: Number(arbId),
                            arb_landholding_id: null,
                            tag_type: 'AO8',
                            status: 'WITH ORDER OF FINALITY',
                            case_details: `BINENTA NA — AO8 transfer. New owner: ${actualName || 'Unknown'}. Mobile: ${mobile || 'N/A'}`,
                            tagged_by: userName,
                            tagged_by_user_id: userId,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            updated_by: userName
                        };
                        const { error: ao8TagErr } = await secureDbClient.from('arb_tags').insert(ao8Payload);
                        if (ao8TagErr) throw ao8TagErr;
                        // Also create a legal monitoring record
                        const ao8MonPayload = {
                            arb_id: arbId,
                            arb_profile_id: profileId,
                            arb_landholding_id: null,
                            case_type: 'AO8',
                            action_category: 'AO8',
                            status: 'WITH ORDER OF FINALITY',
                            current_target_date: today,
                            new_owner_name: actualName || null,
                            new_owner_contact: mobile || null,
                            new_owner_is_arb: false,
                            remarks: `BINENTA NA — AO8 transfer from OCR capture. New owner: ${actualName || 'Unknown'}`,
                            created_by: userId,
                            updated_by: userId
                        };
                        const { error: monErr } = await secureDbClient.from('arb_legal_monitoring')
                            .insert(ao8MonPayload);
                        if (monErr) throw monErr;
                        // Update ARB flag
                        const { error: ao8ArbErr } = await secureDbClient.from('arb')
                            .update({ ao8: true, updated_at: new Date().toISOString() })
                            .eq('id', arbId);
                        if (ao8ArbErr) throw ao8ArbErr;
                        break;

                    case 'TRANSFER ACTION':
                        // Create a TRANSFER ACTION tag with the captured name
                        const taPayload = {
                            arb_profile_id: profileId,
                            arb_id: Number(arbId),
                            arb_landholding_id: null,
                            tag_type: 'TRANSFER ACTION',
                            status: 'FOR FIELD VALIDATION',
                            case_details: `NAGADAN NA — Transfer Action. Heir/transferee: ${actualName || 'Unknown'}. Mobile: ${mobile || 'N/A'}`,
                            tagged_by: userName,
                            tagged_by_user_id: userId,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString(),
                            updated_by: userName
                        };
                        const { error: taTagErr } = await secureDbClient.from('arb_tags').insert(taPayload);
                        if (taTagErr) throw taTagErr;
                        // Also create a legal monitoring record
                        const taMonPayload = {
                            arb_id: arbId,
                            arb_profile_id: profileId,
                            arb_landholding_id: null,
                            case_type: 'TRANSFER ACTION',
                            action_category: 'TRANSFER ACTION',
                            status: 'FOR FIELD VALIDATION',
                            current_target_date: today,
                            new_owner_name: actualName || null,
                            new_owner_contact: mobile || null,
                            new_owner_is_arb: false,
                            remarks: `NAGADAN NA — Transfer Action from OCR capture. Heir: ${actualName || 'Unknown'}`,
                            created_by: userId,
                            updated_by: userId
                        };
                        const { error: taMonErr } = await secureDbClient.from('arb_legal_monitoring')
                            .insert(taMonPayload);
                        if (taMonErr) throw taMonErr;
                        // Update ARB flag
                        const { error: taArbErr } = await secureDbClient.from('arb')
                            .update({ with_ta: true, for_ta: true, updated_at: new Date().toISOString() })
                            .eq('id', arbId);
                        if (taArbErr) throw taArbErr;
                        break;

                    default:
                        throw new Error('Unknown action: ' + action);
                }

                // If ARBO MEMBER = YES and an ARBO was selected, assign the ARB to that ARBO
                if (arboId) {
                    const arboNum = parseInt(arboId);
                    if (!isNaN(arboNum) && arboNum > 0) {
                        const { error: arboAssignErr } = await secureDbClient.from('arb')
                            .update({ arbo_id: arboNum, validation_status: 'Validated',
                                updated_at: new Date().toISOString() })
                            .eq('id', arbId);
                        if (arboAssignErr) throw arboAssignErr;
                        // Also create a validation record for the ARBO assignment
                        const arboValPayload = {
                            arb_id: Number(arbId),
                            arb_landholding_id: null,
                            validator_type: 'System',
                            validator_name: userName,
                            position: null,
                            date_validated: today,
                            validation_basis: 'ARBO MEMBER = YES — assigned to ARBO from OCR capture',
                            supporting_document_reference: 'ARBO Membership',
                            recorded_by: userName,
                            recorded_by_user_id: userId,
                            updated_at: new Date().toISOString()
                        };
                        const { error: arboValErr } = await saveValidationRecord(arboValPayload);
                        if (arboValErr) console.warn('Failed to record ARBO validation:', arboValErr);
                    }
                }
            }

            /**
             * Helper: Convert file to image pages (for PDF)
             */
            async function validationFilePages(file) {
                if (file.type !== 'application/pdf') return [file];
                if (!window.pdfjsLib) throw new Error('PDF reader is still loading. Please try again.');
                window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                const pages = [];
                for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    pages.push(canvas);
                }
                return pages;
            }

            async function generateBarangayReport(municipality, targetBrgy, valStatus) {
                popToast(`Gathering data for ${municipality}, please wait...`, 'info');
                try {
                    const lhData = await fetchAllRecords(() => secureDbClient.from('arb_landholdings').select('*')
                        .ilike('municipality', municipality));
                    if (!lhData || lhData.length === 0) {
                        popToast('No landholdings found for this municipality.', 'warn');
                        return;
                    }

                    const profIds = [...new Set(lhData.map(l => l.arb_profile_id).filter(Boolean))];
                    const profData = await fetchInChunks('arb_profiles', 'id, arb_id', 'id', profIds);

                    const arbIds = [...new Set(profData.map(p => p.arb_id).filter(Boolean))];
                    const arbData = await fetchInChunks('arb', 'id, first_name, middle_name, last_name, validation_status, arbo_id',
                        'id', arbIds);

                    const validArbMap = {};
                    arbData.forEach(a => {
                        let keep = true;
                        if (valStatus === 'Validated' && a.validation_status !== 'Validated') keep = false;
                        if (valStatus === 'Unvalidated' && a.validation_status === 'Validated') keep = false;
                        if (keep) validArbMap[a.id] = a;
                    });

                    const profMap = {};
                    profData.forEach(p => { profMap[p.id] = p; });

                    const grouped = {};
                    let matchCount = 0;

                    const targetBrgyUpper = targetBrgy ? targetBrgy.toUpperCase() : '';
                    let p1 = '',
                        p2 = '';
                    if (targetBrgy) {
                        const parts = targetBrgy.match(/^(.*?)(?:\((.*?)\))?$/);
                        p1 = parts[1] ? parts[1].trim().toUpperCase() : '';
                        p2 = parts[2] ? parts[2].trim().toUpperCase() : '';
                    }

                    lhData.forEach(lh => {
                        const brgy = lh.barangay || 'Unknown Barangay';

                        if (targetBrgy && targetBrgy !== '') {
                            const brgyUpper = brgy.toUpperCase();
                            let isMatch = false;
                            if (brgyUpper === targetBrgyUpper) isMatch = true;
                            if (!isMatch && p1 && brgyUpper.includes(p1)) isMatch = true;
                            if (!isMatch && p2 && brgyUpper.includes(p2)) isMatch = true;

                            if (!isMatch) return;
                        }

                        const p = profMap[lh.arb_profile_id];
                        const a = p ? validArbMap[p.arb_id] : null;
                        if (!a) return;

                        const groupKey = (targetBrgy && targetBrgy !== '') ? targetBrgy : brgy;
                        if (!grouped[groupKey]) grouped[groupKey] = [];
                        matchCount++;

                        const arbName = fullName(a);

                        grouped[groupKey].push({
                            arbId: String(a.id),
                            name: arbName,
                            survey: lh.survey_no || '',
                            lot: lh.lot_no || '',
                            area: lh.landholding_area || '',
                            title: lh.title_no || lh.ep_cloa_serial_no || lh.ccloa_title_raw || ''
                        });
                    });

                    if (matchCount === 0) {
                        popToast('No ARBs found matching the selected filters.', 'warn');
                        return;
                    }

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [215.9, 330.2] });
                    const brgyKeys = Object.keys(grouped).sort();

                    for (let i = 0; i < brgyKeys.length; i++) {
                        const brgy = brgyKeys[i];
                        if (i > 0) doc.addPage();

                        const year = new Date().getFullYear();
                        let reportRef =

            let currentTableViewRows = [];

            async function saveTableCell(el) {
                if (!isFullAdmin()) return;
                const table = el.dataset.table,
                    id = el.dataset.id,
                    field = el.dataset.field;
                let value = el.value;
                if (table === 'arb' && field === 'validation_status') {
                    const requestedStatus = value;
                    el.value = el.dataset.previous || 'Pending';
                    openValidationForm(id, requestedStatus, { returnToTable: true });
                    return;
                }
                if (el.dataset.type === 'boolean') value = value === 'true';
                if (value === '') value = null;
                el.disabled = true;
                try {
                    if (table === 'arb_profiles' && field === 'cocrom_no') {
                        await updateCocromForMother(id, value);
                        popToast('COCROM number updated for all ARBs under the same Mother CLOA.', 'ok');
                        return;
                    }
                    const payload = { [field]: value, updated_at: new Date().toISOString() };
                    if (table === 'arb_profiles') payload.updated_by = currentUserProfile?.full_name ||
                        currentUser?.email || null;
                    const { error } = await secureDbClient.from(table).update(payload).eq('id', id);
                    if (error) throw error;
                    popToast('Table value updated.', 'ok');
                } catch (e) { popToast(e.message, 'err'); } finally { el.disabled = false; }
            }

                let max = Math.ceil(totalRecords / pageSize) || 1;
                if (target >= 1 && target <= max) {
                    currentPage = target - 1;
                    loadArbs(currentPage);
                } else {
                    popToast(`Please enter a page between 1 and ${max}`, 'warn');
                    input.value = currentPage + 1;
                }
            });
            document.getElementById('pageJumpInput')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('pageJumpBtn').click();
            });

            document.getElementById('toggleFiltersBtn')?.addEventListener('click', function() {
                const filters = document.getElementById('advancedFilters');
                filters.classList.toggle('open');
                this.textContent = filters.classList.contains('open') ? 'Hide Filters' : 'Advanced Filters';
            });

            (async function init() {
                try {
                    if (!secureDbClient) {
                        await buildNavbar(null);
                        document.getElementById('arbTableBody').innerHTML =
                            `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;color:#991b1b;">Database connection required.</td></tr>`;
                        return;
                    }

                    const { data: authData } = await secureDbClient.auth.getUser();
                    if (!authData?.user) {
                        await buildNavbar(null);
                        document.getElementById('arbTableBody').innerHTML =
                            `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;">Please <a href="login.html">login</a> to continue.</td></tr>`;
                        return;
                    }
                    currentUser = authData.user;
                    const { data: profile, error: profErr } = await secureDbClient.from('profiles').select('*')
                        .eq('id', currentUser.id).single();
                    if (profErr && profErr.code !== 'PGRST116') throw profErr;
                    currentUserProfile = profile;
                    if (!canValidateOrAssign()) document.getElementById('captureValidationBtn')?.remove();
                    if (!isFullAdmin()) document.getElementById('duplicateReviewBtn')?.remove();

                    if (String(profile?.role).toUpperCase() === 'ARBO ADMIN') {
                        document.body.innerHTML = `
                                <div style="display:flex;height:100vh;width:100%;align-items:center;justify-content:center;background:#f1f5f9;">
                                    <div style="text-align:center;background:white;padding:40px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,0.1);">
                                        <h1 style="color:#991b1b;font-size:3rem;margin:0;">ACCESS</h1>
                                        <h2 style="color:#0f172a;margin-top:15px;">Access Denied</h2>
                                        <p style="color:#475569;">Your role does not have permission to view the ARB Management page.</p>
                                        <button onclick="window.location.href='dashboard.html'" class="btn btn-primary" style="margin-top:20px;">Return to Dashboard</button>
                                    </div>
                                </div>`;
                        return;
                    }

                    if (String(profile?.status).toUpperCase() === 'INACTIVE') {
                        document.body.innerHTML = `
                                <div style="display:flex;height:100vh;width:100%;align-items:center;justify-content:center;background:#f1f5f9;">
                                    <div style="text-align:center;background:white;padding:40px;border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,0.1);">
                                        <h1 style="color:#991b1b;font-size:3rem;margin:0;">INACTIVE</h1>
                                        <h2 style="color:#0f172a;margin-top:15px;">Account Inactive</h2>
                                        <p style="color:#475569;">Your account has been marked as inactive by the administrator.</p>
                                    </div>
                                </div>`;
                        return;
                    }

                    await buildNavbar(profile);
                    await populateFilterOptions();
                    await loadArboList();
                    await loadArbs(0);
                    popToast('ARB Management ready.', 'ok');
                } catch (e) {
                    console.error(e);
                    document.getElementById('arbTableBody').innerHTML =
                        `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;color:#991b1b;">Error: ${safe(e.message)}</td></tr>`;
                }
            })();

        })();
    </script>
</body>
</html>
