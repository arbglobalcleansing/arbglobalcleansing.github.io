        async function openTagArb(arbId) {
            if (!canEdit()) { popToast('Insufficient permissions.','err'); return; }
            try {
                const profRes = await secureDbClient.from('arb_profiles').select('id').eq('arb_id', String(arbId)).single();
                if (profRes.error) { popToast('Profile not found. Please create profile first.', 'err'); return; }
                const profileId = profRes.data.id;

                const tagTypes = [
                    { value: 'ALI CASE', label: 'ALI Case' },
                    { value: 'TRANSFER ACTION', label: 'Transfer Action' },
                    { value: 'DISQUALIFICATION', label: 'Disqualification' },
                    { value: 'DEAD', label: 'Mark as Dead' },
                    { value: 'ALIVE', label: 'Mark as Alive' },
                    { value: 'WITH COMPLAIN', label: 'With Existing Complain' }
                ];
                const statusOptions = {
                    'ALI CASE': ['AT DARPO', 'AT DARMO with MEMO', 'AT DARPO with COMPLIANCE - COMPLETE', 'AT DARPO with COMPLIANCE - INCOMPLETE', 'AT LEGAL', 'FORWARDED TO REGION', 'WITH ORDER - GRANTED', 'WITH ORDER - DENIED', 'WITH MR', 'WITH ORDER OF FINALITY', 'FORWARDED TO ROD', 'EXECUTED'],
                    'TRANSFER ACTION': ['AT DARPO', 'AT DARMO with MEMO', 'AT DARPO with COMPLIANCE - COMPLETE', 'AT DARPO with COMPLIANCE - INCOMPLETE', 'AT LEGAL', 'FORWARDED TO REGION', 'WITH ORDER - GRANTED', 'WITH ORDER - DENIED', 'WITH MR', 'WITH ORDER OF FINALITY', 'FORWARDED TO ROD', 'EXECUTED'],
                    'DISQUALIFICATION': ['FOR DISQUALIFICATION'],
                    'DEAD': ['DECEASED'],
                    'ALIVE': ['ACTIVE'],
                    'WITH COMPLAIN': ['EXISTING']
                };

                const formHtml = `
                    <form id="tagArbForm">
                        <div class="form-grid">
                            <div class="form-group full"><label>Date of Tagging / Target Date</label><input type="date" name="action_date" value="${new Date().toISOString().substring(0,10)}" required></div>
                            <div class="form-group"><label for="tagType">Tag Type</label><select id="tagType" name="tag_type" required>${tagTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}</select></div>

                            <div class="form-group" id="aliCategoryGrp" style="display:none;">
                                <label>ALI Category</label>
                                <select id="aliCategory" name="ali_category">
                                    <option value="SPLIT ALI">SPLIT ALI</option>
                                    <option value="REGULAR ALI">REGULAR ALI</option>
                                </select>
                            </div>
                            <div class="form-group" id="aliTypeGrp" style="display:none;">
                                <label>ALI Type</label>
                                <select id="aliType" name="ali_type">
                                    <option value="DISQUALIFICATION">DISQUALIFICATION</option>
                                    <option value="IDENTIFICATION AS ARB">IDENTIFICATION AS ARB</option>
                                </select>
                            </div>

                            <div class="form-group full" id="reasonGrp" style="display:none;"><label>Reason for Rollback</label><input type="text" name="rollback_reason" placeholder="Required if moving target date backward..."></div>
                            <div class="form-group full"><label for="tagStatus">Status</label><select id="tagStatus" name="status"></select></div>
                            <div class="form-group full"><label for="tagCaseRef">Case Reference No.</label><input id="tagCaseRef" name="case_reference_no"></div>
                            <div class="form-group full"><label for="tagCaseDetails">Case Details / Reason</label><textarea id="tagCaseDetails" name="case_details"></textarea></div>
                            <div class="form-group full" id="heirSection" style="display:none;"><label>Heirs (for Transfer Action)</label><div id="heirList"></div><button type="button" class="btn btn-primary btn-sm" id="addHeirRowBtn">+ Add Heir</button></div>
                        </div>
                        <div class="modal-actions"><button type="button" class="btn btn-primary" id="cancelTagBtn" style="background:#64748b !important; border-color:#475569 !important;">Cancel</button><button type="submit" class="btn btn-primary">Save Tag</button></div>
                    </form>
                `;
                showSubModal('Tag ARB', formHtml);

                const tagTypeSelect = document.getElementById('tagType');
                const tagStatusSelect = document.getElementById('tagStatus');
                function updateStatuses() {
                    const type = tagTypeSelect.value;
                    const opts = statusOptions[type] || [];
                    tagStatusSelect.innerHTML = opts.map(s => `<option value="${s}">${s}</option>`).join('');
                    document.getElementById('heirSection').style.display = (type === 'TRANSFER ACTION') ? 'block' : 'none';
                    document.getElementById('reasonGrp').style.display = ['ALI CASE', 'TRANSFER ACTION'].includes(type) ? 'flex' : 'none';
                    document.getElementById('aliCategoryGrp').style.display = type === 'ALI CASE' ? 'flex' : 'none';
                    document.getElementById('aliTypeGrp').style.display = type === 'ALI CASE' ? 'flex' : 'none';
                }
                tagTypeSelect.addEventListener('change', updateStatuses);
                updateStatuses();

                document.getElementById('addHeirRowBtn')?.addEventListener('click', function() {
                    const container = document.getElementById('heirList');
                    const row = document.createElement('div');
                    row.style.marginBottom = '6px';
                    row.innerHTML = `
                        <input type="text" name="heir_name[]" placeholder="Heir Name" style="width:40%;">
                        <input type="text" name="heir_relation[]" placeholder="Relation" style="width:30%;">
                        <input type="text" name="heir_contact[]" placeholder="Contact" style="width:25%;">
                        <button type="button" class="btn btn-danger btn-sm remove-heir-btn">✕</button>
                    `;
                    container.appendChild(row);
                    row.querySelector('.remove-heir-btn').addEventListener('click', function() { row.remove(); });
                });

                document.getElementById('cancelTagBtn').addEventListener('click', hideSubModal);
                document.getElementById('tagArbForm').addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const submitBtn = e.target.querySelector('button[type="submit"]');
                    submitBtn.disabled = true; submitBtn.textContent = 'Processing...';

                    const fd = new FormData(e.target);
                    const tagType = fd.get('tag_type');
                    const status = fd.get('status');
                    const caseRef = emptyToNull(fd.get('case_reference_no'));
                    let caseDetails = emptyToNull(fd.get('case_details'));
                    const targetDate = fd.get('action_date');
                    const aliCategory = fd.get('ali_category');
                    const aliType = fd.get('ali_type');

                    if (tagType === 'ALI CASE') {
                        caseDetails = `[${aliCategory}] [${aliType}] ${caseDetails || ''}`.trim();
                    }

                    const tagPayload = {
                        arb_profile_id: profileId,
                        tag_type: tagType,
                        status: status,
                        case_reference_no: caseRef,
                        case_details: caseDetails,
                        tagged_by: currentUserProfile?.full_name || currentUser?.email || null,
                        tagged_by_user_id: currentUser?.id || null,
                        updated_at: new Date().toISOString(),
                        updated_by: currentUserProfile?.full_name || currentUser?.email || null,
                        created_at: targetDate + 'T00:00:00Z',
                        ali_category: tagType === 'ALI CASE' ? aliCategory : null,
                        ali_type: tagType === 'ALI CASE' ? aliType : null
                    };

                    const arbUpdate = {};
                    let lifeUpdate = null;
                    switch(tagType) {
                        case 'ALI CASE':
                            arbUpdate.with_ali_case = true;
                            arbUpdate.ali_case_status = status;
                            arbUpdate.ali_case_type = aliType; // Updating proper db schema field
                            break;
                        case 'TRANSFER ACTION':
                            arbUpdate.with_ta = true;
                            arbUpdate.for_ta = true;
                            arbUpdate.ta_status = status;
                            break;
                        case 'DISQUALIFICATION':
                            arbUpdate.for_disqualification = true;
                            arbUpdate.disqualification_reason = caseDetails || status;
                            break;
                        case 'DEAD':
                            arbUpdate.life_status = 'Dead';
                            lifeUpdate = 'Dead';
                            break;
                        case 'ALIVE':
                            arbUpdate.life_status = 'Active';
                            lifeUpdate = 'Active';
                            break;
                        case 'WITH COMPLAIN':
                            arbUpdate.with_existing_complain = true;
                            break;
                    }

                    try {
                        const { error: tagErr } = await secureDbClient.from('arb_tags').insert(tagPayload);
                        if (tagErr) throw tagErr;

                        if (['ALI CASE', 'TRANSFER ACTION', 'DISQUALIFICATION'].includes(tagType)) {
                            const { data: existingMon } = await secureDbClient.from('arb_legal_monitoring').select('id').eq('arb_id', arbId).eq('case_type', tagType).single();
                            const trackingPayload = {
                                arb_id: arbId,
                                case_type: tagType,
                                status: status,
                                current_target_date: targetDate,
                                reason_for_rollback: fd.get('rollback_reason'),
                                remarks: caseDetails
                            };
                            if (existingMon) {
                                await secureDbClient.from('arb_legal_monitoring').update(trackingPayload).eq('id', existingMon.id);
                            } else {
                                await secureDbClient.from('arb_legal_monitoring').insert(trackingPayload);
                            }
                        }

                        if (Object.keys(arbUpdate).length > 0) {
                            const { error: arbErr } = await secureDbClient.from('arb').update(arbUpdate).eq('id', arbId);
                            if (arbErr) throw arbErr;
                        }
                        if (lifeUpdate) {
                            const { error: lifeErr } = await secureDbClient.from('arb_profiles').update({ life_status: lifeUpdate }).eq('arb_id', String(arbId));
                            if (lifeErr) throw lifeErr;
                        }

                        const heirNamesArr = fd.getAll('heir_name[]').filter(Boolean);
                        if (heirNamesArr.length > 0) {
                            const heirs = heirNamesArr.map((name, i) => ({
                                arb_profile_id: profileId,
                                heir_name: name,
                                heir_relation: fd.getAll('heir_relation[]')[i] || null,
                                heir_contact: fd.getAll('heir_contact[]')[i] || null,
                                is_verified: false,
                                is_selected: false,
                                created_by: currentUserProfile?.full_name || currentUser?.email || null,
                                updated_by: currentUserProfile?.full_name || currentUser?.email || null,
                                created_at: new Date().toISOString(),
                                updated_at: new Date().toISOString()
                            }));
                            const { error: heirErr } = await secureDbClient.from('arb_heirs').insert(heirs);
                            if (heirErr) throw heirErr;
                        }

                        hideSubModal();
                        popToast('Tag applied successfully.', 'ok');
                        openArbProfile(arbId);
                        loadArbs(currentPage);
                    } catch(err) {
                        if (err.message && err.message.includes('policy')) {
                            popToast('RLS policy error: Please ensure you have insert permission on arb_tags and arb_heirs.', 'err');
                        } else {
                            popToast(err.message, 'err');
                        }
                        submitBtn.disabled = false; submitBtn.textContent = 'Save Tag';
                    }
                });
            } catch(e) { popToast(e.message, 'err'); }
        }

        async function generateArbId(arbId, arbName, btnElement) {
            if (!canEdit()) { popToast('Insufficient permissions.','err'); return; }
            if (btnElement) { btnElement.disabled = true; btnElement.textContent = 'Processing...'; }

            try {
                const arbRes = await secureDbClient.from('arb').select(`*, arbo:arbo_id(name, municipality, barangay)`).eq('id', arbId).single();
                if (arbRes.error) throw arbRes.error;
                const arb = arbRes.data;

                const profRes = await secureDbClient.from('arb_profiles').select('id, sequence_no, generated_arb_ic, image_base64').eq('arb_id', String(arbId)).single();
                let profile = profRes.data;
                if (!profile) { popToast('Profile not found. Please create profile first.', 'err'); return; }

                let seq = profile.sequence_no;
                if (!seq) {
                    const { count } = await secureDbClient.from('arb_profiles').select('*', { count: 'exact', head: true });
                    seq = String((count || 0) + 1).padStart(6, '0');
                } else if (!isNaN(seq)) {
                    seq = String(seq).padStart(6, '0');
                }
                const newId = `DAR-Camsur-${seq}`;

                await secureDbClient.from('arb_profiles').update({ generated_arb_ic: newId, sequence_no: seq }).eq('id', profile.id);
                await secureDbClient.from('arb').update({ generated_arb_id: newId }).eq('id', arbId);

                // Fetch landholding for fallback address & new ID details
                const { data: lhData } = await secureDbClient.from('arb_landholdings')
                    .select('municipality, barangay, title_no, ep_cloa_serial_no, ccloa_title_raw, landholding_area, asp_no, lot_no')
                    .eq('arb_profile_id', profile.id);

                let tTown = arb.arbo?.municipality;
                let tBrgy = arb.arbo?.barangay;
                if (!tTown && lhData && lhData.length > 0) {
                    const valid = lhData.find(l => l.municipality);
                    if (valid) {
                        tTown = valid.municipality;
                        tBrgy = valid.barangay || tBrgy;
                    }
                }
                const address = `${tBrgy ? tBrgy + ', ' : ''}${tTown || ''}`.replace(/,\s*$/, '').trim() || "Address Not Available";

                let lhDisp = lhData && lhData.length > 0 ? lhData[0] : {};
                let tTitle = lhDisp.title_no || lhDisp.ep_cloa_serial_no || lhDisp.ccloa_title_raw || '—';
                let tArea = lhDisp.landholding_area || '—';
                let tAsp = lhDisp.asp_no || '—';
                let tLot = lhDisp.lot_no || '—';

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });

                doc.setFillColor(6, 95, 70); // Primary green
                doc.rect(0, 0, 85.6, 12, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(8);
                doc.setFont("helvetica", "bold");
                doc.text("DEPARTMENT OF AGRARIAN REFORM", 42.8, 6, { align: "center" });
                doc.setFontSize(6);
                doc.setFont("helvetica", "normal");
                doc.text("Beneficiary Identity Card", 42.8, 10, { align: "center" });

                doc.setTextColor(0, 0, 0);

                const imgWidth = 20;
                const imgHeight = 22;
                if (profile.image_base64) {
                    try { doc.addImage(profile.image_base64, 'JPEG', 4, 15, imgWidth, imgHeight); } 
                    catch(e) { doc.setDrawColor(200, 200, 200); doc.rect(4, 15, imgWidth, imgHeight); doc.text("NO PHOTO", 14, 26, { align: "center" }); }
                } else {
                    doc.setDrawColor(200, 200, 200);
                    doc.rect(4, 15, imgWidth, imgHeight);
                    doc.text("NO PHOTO", 14, 26, { align: "center" });
                }

                doc.setFontSize(9);
                doc.setFont("helvetica", "bold");
                doc.text(safe(arbName || fullName(arb)).toUpperCase(), 28, 18);

                doc.setFontSize(6);
                doc.setFont("helvetica", "normal");

                doc.text(`ID Number : ${newId}`, 28, 21);
                doc.text(`Title No : ${tTitle}`, 28, 24);
                doc.text(`Area : ${tArea}   Lot No : ${tLot}   ASP : ${tAsp}`, 28, 27);

                const arboName = arb.arbo?.name || "No ARBO Assigned";
                const splitArbo = doc.splitTextToSize(`ARBO : ${arboName}`, 55);
                doc.text(splitArbo, 28, 30);

                const splitAddress = doc.splitTextToSize(`Address : ${address}`, 55);
                doc.text(splitAddress, 28, 34);

                doc.setDrawColor(0, 0, 0);
                doc.line(4, 46, 26, 46); 
                doc.setFontSize(5);
                doc.text("ARB Signature", 15, 49, { align: "center" });

                doc.line(50, 46, 80, 46); 
                doc.text("Authorized Signature", 65, 49, { align: "center" });

                doc.setTextColor(100, 100, 100);
                doc.text(`Generated: ${new Date().toLocaleDateString()}`, 42.8, 52, { align: "center" });

                doc.save(`ARB_ID_${newId}.pdf`);

                popToast(`ARB ID generated and downloaded: ${newId}`, 'ok');
                loadArbs(currentPage);
            } catch(e) { 
                popToast(e.message, 'err'); 
            } finally {
                if (btnElement) { btnElement.disabled = false; btnElement.textContent = 'ID'; }
            }
        }

        async function openPhotoUpload(arbId) {
            if (!canEdit()) { popToast('Insufficient permissions.','err'); return; }
            const formHtml = `
                <form id="photoForm">
                    <div class="form-group"><label>Upload Photo</label><input type="file" id="photoFileInput" accept="image/*"></div>
                    <div class="form-group"><label>Or capture from webcam</label><button type="button" class="btn btn-primary" id="startWebcamBtn">Start Webcam</button>
                        <video id="webcamVideo" autoplay style="width:100%;max-width:320px;border:1px solid #ccc;border-radius:6px;margin-top:6px;display:none;"></video>
                        <canvas id="webcamCanvas" style="display:none;"></canvas>
                        <button type="button" class="btn btn-primary" id="captureWebcamBtn" style="display:none;margin-top:10px;">Capture</button>
                    </div>
                    <div id="photoPreview" style="margin-top:10px;"></div>
                    <div class="modal-actions"><button type="button" class="btn btn-primary" id="cancelPhotoBtn" style="background:#64748b !important; border-color:#475569 !important;">Cancel</button><button type="submit" class="btn btn-primary">Save Photo</button></div>
                </form>
            `;
            showSubModal('Upload ARB Photo', formHtml);
            document.getElementById('cancelPhotoBtn').addEventListener('click', hideSubModal);

            let webcamStream = null;
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('webcamCanvas');
            const preview = document.getElementById('photoPreview');

            document.getElementById('startWebcamBtn').addEventListener('click', async function() {
                try {
                    webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = webcamStream;
                    video.style.display = 'block';
                    document.getElementById('captureWebcamBtn').style.display = 'inline-block';
                } catch(e) {
                    popToast('Unable to access webcam: ' + e.message, 'err');
                }
            });

            document.getElementById('captureWebcamBtn').addEventListener('click', function() {
                if (!webcamStream) return;
                canvas.width = video.videoWidth || 320;
                canvas.height = video.videoHeight || 320;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg');
                preview.innerHTML = `<img src="${dataUrl}" style="max-width:150px;border-radius:8px;">`;
                let hidden = document.getElementById('photoData');
                if (!hidden) {
                    hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.id = 'photoData';
                    hidden.name = 'photo_data';
                    document.getElementById('photoForm').appendChild(hidden);
                }
                hidden.value = dataUrl;
                if (webcamStream) {
                    webcamStream.getTracks().forEach(t => t.stop());
                    webcamStream = null;
                    video.srcObject = null;
                    video.style.display = 'none';
                    document.getElementById('captureWebcamBtn').style.display = 'none';
                }
            });

            document.getElementById('photoForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true; submitBtn.textContent = 'Processing...';

                const fileInput = document.getElementById('photoFileInput');
                let rawImageData = null;

                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    rawImageData = await new Promise((resolve) => {
                        reader.onload = (ev) => resolve(ev.target.result);
                        reader.readAsDataURL(fileInput.files[0]);
                    });
                } else {
                    const hidden = document.getElementById('photoData');
                    if (hidden) rawImageData = hidden.value;
                }

                if (!rawImageData) { popToast('No photo selected or captured.', 'warn'); submitBtn.disabled = false; submitBtn.textContent = 'Save Photo'; return; }

                const compressedImageData = await compressImage(rawImageData, 400, 0.7);

                try {
                    const profRes = await secureDbClient.from('arb_profiles').select('id').eq('arb_id', String(arbId)).single();
                    if (profRes.error) { popToast('Profile not found. Please create profile first.', 'err'); return; }
                    const profile = profRes.data;
                    const { error } = await secureDbClient.from('arb_profiles').update({
                        image_base64: compressedImageData,
                        updated_at: new Date().toISOString(),
                        updated_by: currentUserProfile?.full_name || currentUser?.email || null
                    }).eq('id', profile.id);
                    if (error) throw error;
                    hideSubModal();
                    popToast('Photo uploaded successfully.', 'ok');
                    openArbProfile(arbId);
                    loadArbs(currentPage);
                } catch(err) {
                    popToast(err.message, 'err');
                    submitBtn.disabled = false; submitBtn.textContent = 'Save Photo';
                }
            });
        }

                const fd = new FormData(e.target);
                const municipality = fd.get('municipality');
                const barangay = fd.get('barangay');
                const validationStatus = fd.get('validation_status');
                const validatorType = fd.get('validator_type');
                const validatorName = emptyToNull(fd.get('validator_name')) || currentUserProfile?.full_name || currentUser?.email || 'System';
                const barangayCaptain = emptyToNull(fd.get('barangay_captain'));
                const validationBasis = emptyToNull(fd.get('validation_basis'));
                const supportingDoc = emptyToNull(fd.get('supporting_document_reference'));

                if (!municipality || !barangay) {
                    popToast('Please select both Municipality and Barangay.', 'warn');
                    submitBtn.disabled=false; submitBtn.textContent='Apply Validation';
                    return;
                }

                try {
                    const parts = barangay.match(/^(.*?)(?:\((.*?)\))?$/);
                    const p1 = parts[1] ? parts[1].trim() : '';
                    const p2 = parts[2] ? parts[2].trim() : '';
                    let conds = [`barangay.ilike.%${barangay}%`];

                    if (p2) conds.push(`barangay.ilike.%${p2}%`);

                    const { data: arboList } = await secureDbClient.from('arbo').select('id').eq('municipality', municipality).or(conds.join(','));

                    const { data: landProfiles } = await secureDbClient.from('arb_landholdings').select('arb_profile_id').eq('municipality', municipality).or(conds.join(','));

                        const profs = await fetchInChunks('arb_profiles', 'arb_id', 'id', profileIds);
                        landArbIds = profs.map(p => String(p.arb_id)).filter(Boolean);
                    }
                    const allArbIds = [...new Set([...arbIds, ...landArbIds])];

                    if (allArbIds.length === 0) {
                        popToast('No ARBs found in that municipality/barangay.', 'warn');
                        submitBtn.disabled=false; submitBtn.textContent='Apply Validation';
                        return;
                    }

                    const today = new Date().toISOString().substring(0,10);
                    const userName = currentUserProfile?.full_name || currentUser?.email || 'System';
                    const userId = currentUser?.id || null;

                    for (const arbId of allArbIds) {
                        await secureDbClient.from('arb').update({ validation_status: validationStatus }).eq('id', arbId);
                        await secureDbClient.from('arb_validations').insert({
                            arb_id: arbId,
                            validator_type: validatorType,
                            validator_name: validatorName,
                            validator_barangay: barangay,
                            validator_town: municipality,
                            position: validatorType === 'Barangay' ? (barangayCaptain || 'Barangay Captain') : null,
                            date_validated: today,
                            validation_basis: validationBasis,
                            supporting_document_reference: supportingDoc,
                            recorded_by: userName,
                            recorded_by_user_id: userId,
                            updated_at: new Date().toISOString()
                        });
                    }
                    hideSubModal();
                    popToast(`Batch validation applied to ${allArbIds.length} ARB(s).`, 'ok');
                    loadArbs(currentPage);
                } catch (err) {
                    popToast(err.message, 'err');
                    submitBtn.disabled=false; submitBtn.textContent='Apply Validation';
                }
            });
        }

        }

        async function generateBarangayReport(municipality, targetBrgy, valStatus) {
            popToast(`Gathering data for ${municipality}, please wait...`, 'info');
            try {
                const lhData = await fetchAllRecords(() => secureDbClient.from('arb_landholdings').select('*').ilike('municipality', municipality));
                if (!lhData || lhData.length === 0) { 
                    popToast('No landholdings found for this municipality.', 'warn'); 
                    return; 
                }

                const profIds = [...new Set(lhData.map(l => l.arb_profile_id).filter(Boolean))];
                const profData = await fetchInChunks('arb_profiles', 'id, arb_id', 'id', profIds);

                const arbIds = [...new Set(profData.map(p => p.arb_id).filter(Boolean))];
                const arbData = await fetchInChunks('arb', 'id, first_name, middle_name, last_name, validation_status', 'id', arbIds);

                const validArbMap = {};
                arbData.forEach(a => { 
                    let keep = true;
                    if (valStatus === 'Validated' && a.validation_status !== 'Validated') keep = false;
                    if (valStatus === 'Unvalidated' && a.validation_status === 'Validated') keep = false;
                    if (keep) validArbMap[a.id] = a; 
                });

                const profMap = {};
                profData.forEach(p => { profMap[p.id] = p; });

                const grouped = {};
                let matchCount = 0;

                const targetBrgyUpper = targetBrgy ? targetBrgy.toUpperCase() : '';
                let p1 = '', p2 = '';
                if (targetBrgy) {
                    const parts = targetBrgy.match(/^(.*?)(?:\((.*?)\))?$/);
                    p1 = parts[1] ? parts[1].trim().toUpperCase() : '';
                    p2 = parts[2] ? parts[2].trim().toUpperCase() : '';
                }

                lhData.forEach(lh => {
                    const brgy = lh.barangay || 'Unknown Barangay';

                    if (targetBrgy && targetBrgy !== '') {
                        const brgyUpper = brgy.toUpperCase();
                        let isMatch = false;
                        if (brgyUpper === targetBrgyUpper) isMatch = true;
                        if (!isMatch && p1 && brgyUpper.includes(p1)) isMatch = true;
                        if (!isMatch && p2 && brgyUpper.includes(p2)) isMatch = true;

                        if (!isMatch) return;
                    }

                    const p = profMap[lh.arb_profile_id];
                    const a = p ? validArbMap[p.arb_id] : null;
                    if (!a) return; 

                    const groupKey = (targetBrgy && targetBrgy !== '') ? targetBrgy : brgy;
                    if(!grouped[groupKey]) grouped[groupKey] = [];
                    matchCount++;

                    const arbName = fullName(a);

                    grouped[groupKey].push({
                        name: arbName,
                        survey: lh.survey_no || '',
                        lot: lh.lot_no || '',
                        area: lh.landholding_area || '',
                        title: lh.title_no || lh.ep_cloa_serial_no || lh.ccloa_title_raw || ''
                    });
                });

                if (matchCount === 0) {
                    popToast('No ARBs found matching the selected filters.', 'warn');
                    return;
                }

                const { jsPDF } = window.jspdf;
                // Updated to exactly 8.5 x 13 inches (landscape is 330.2 x 215.9 mm)
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [215.9, 330.2] });
                const brgyKeys = Object.keys(grouped).sort();

                for (let i = 0; i < brgyKeys.length; i++) {
                    const brgy = brgyKeys[i];
                    if (i > 0) doc.addPage();

                    // Generate Unique Sequence Number for this report print
                    const year = new Date().getFullYear();
                    let reportRef = `ARB-GC-${year}-${municipality.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()}-${brgy.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()}-00000`;
                    if (secureDbClient) {
                        try {
                            const { data, error } = await secureDbClient.rpc('get_next_report_sequence', {
                                p_municipality: municipality,
                                p_barangay: brgy,
                                p_year: year
                            });
                            if (error) {
                                console.error("Sequence Generation Error:", error);
                                popToast("Warning: Sequence not incremented. Check DB function.", "warn");
                            } else if (data) {
                                reportRef = data;
                            }
                        } catch(e) { console.warn(e); }
                    }

                    const head = [
                        [
                            {content: 'PANGARAN KANG PARA-UMA (ARB)\n\n\n\n', rowSpan: 2, styles: {valign: 'top', halign: 'center'}},
                            {content: 'IMPORMASYON MANUNGOD SA DAGA', colSpan: 4, styles: {halign: 'center'}},
                            {content: 'PANGARAN KANG AKTUAL NA NAG-UUMA\nKAN DAGA SA NGUNYAN', rowSpan: 2, styles: {valign: 'middle', halign: 'center'}},
                            {content: 'Kun iba na ang nag-uuma,\nano ang dahilan?', colSpan: 4, styles: {halign: 'center'}},
                            {content: 'Kun gadan na,\nmay Death Certificate', colSpan: 2, styles: {halign: 'center'}},
                            {content: 'Cellphone Number kung igwa', rowSpan: 2, styles: {valign: 'middle', halign: 'center'}}
                        ],
                        [
                            {content: 'SURVEY NO.', styles: {halign: 'center'}}, 
                            {content: 'LOT NO.', styles: {halign: 'center'}}, 
                            {content: 'AREA', styles: {halign: 'center'}}, 
                            {content: 'TITLE NUMBER', styles: {halign: 'center'}},
                            {content: 'GURANG NA', styles: {halign: 'center', fontSize: 6}}, 
                            {content: 'NAGHALI NA', styles: {halign: 'center', fontSize: 6}}, 
                            {content: 'BINENTA NA', styles: {halign: 'center', fontSize: 6}}, 
                            {content: 'NAGADAN NA', styles: {halign: 'center', fontSize: 6}},
                            {content: 'MAYO', styles: {halign: 'center', fontSize: 6}}, 
                            {content: 'IGWA', styles: {halign: 'center', fontSize: 6}}
                        ]
                    ];

                    const body = grouped[brgy].map(row => [
                        row.name, row.survey, row.lot, row.area, row.title,
                        '', '', '', '', '', '', '', ''
                    ]);

                    let localPageNum = 1;

                    doc.autoTable({
                        startY: 25,
                        margin: { top: 25, bottom: 45, left: 10, right: 10 }, 
                        head: head,
                        body: body,
                        theme: 'grid',
                        styles: { fontSize: 8, cellPadding: 1.5, lineColor: [0, 0, 0], lineWidth: 0.1, valign: 'middle', minCellHeight: 6, overflow: 'linebreak' },
                        headStyles: { fillColor: [255, 255, 255], textColor: [0, 0, 0], fontStyle: 'bold' },
                        columnStyles: {
                            0: { cellWidth: 55 },
                            1: { cellWidth: 25 },
                            2: { cellWidth: 15 },
                            3: { cellWidth: 15 },
                            4: { cellWidth: 35 },
                            5: { cellWidth: 45 }
                        },
                        didDrawCell: function(data) {
                            if (data.section === 'head' && data.row.index === 0 && data.column.index === 0) {
                                const brgyText = brgy.toUpperCase();
                                doc.setFont("helvetica", "bold");
                                doc.setFontSize(10);
                                const textWidth = doc.getTextWidth(brgyText);

                                const x = data.cell.x + (data.cell.width / 2) - (textWidth / 2);
                                const y = data.cell.y + data.cell.height - 6; 

                                doc.setFillColor(255, 255, 0); 
                                doc.rect(x - 2, y - 4, textWidth + 4, 6, 'F');
                                doc.setTextColor(0, 0, 0);
                                doc.text(brgyText, x, y);
                            }
                        },
                        didDrawPage: function(data) {
                            const pageHeight = doc.internal.pageSize.getHeight();
                            const pageWidth = doc.internal.pageSize.getWidth();
                            
                            // ---- Header & Page numbers strictly rendering per page ----
                            doc.setFontSize(14);
                            doc.setFont("helvetica", "bold");
                            doc.setTextColor(0, 0, 0);
                            doc.text(`ARB Global Validation Form - ${municipality}`, 10, 15);

                            doc.setFontSize(10);
                            doc.setTextColor(217, 119, 6);
                            doc.text(`Ref: ${reportRef}`, pageWidth - 10, 15, { align: "right" });
                            
                            doc.setTextColor(0, 0, 0);
                            doc.setFontSize(9);
                            doc.setFont("helvetica", "normal");
                            doc.text(`Page ${localPageNum}`, pageWidth - 10, 20, { align: "right" });
                            localPageNum++;
                            // ------------------------------------------------------------

                            const y = pageHeight - 35; // Position for the signature boxes

                            // Total usable width (subtracting 20mm margin)
                            const usableWidth = pageWidth - 20; 
                            const boxWidth = usableWidth / 5;
                            const startX = 10;
                            const h1 = 20; // top box height
                            const h2 = 6;  // bottom box height

                            const titles = ["Barangay Kagawad", "Barangay Kapitan", "PBDD PERSONNEL", "CARPO-PBDD/MARPO", "PARPO II"];

                            for (let j = 0; j < 5; j++) {
                                let x = startX + (j * boxWidth);
                                
                                // Top Box 
                                doc.setDrawColor(0);
                                doc.rect(x, y, boxWidth, h1);
                                doc.text("Date:", x + 2, y + h1 - 2);

                                // Bottom Box (Title Row)
                                doc.rect(x, y + h1, boxWidth, h2);
                                doc.text(titles[j], x + (boxWidth / 2), y + h1 + 4, { align: "center" });
                            }
                        }
                    });
                }

                doc.save(`Validation_Form_${municipality}.pdf`);
                hideSubModal();
                popToast('Report downloaded successfully.', 'ok');
            } catch (err) {
                popToast(err.message, 'err');
            }
        }


        // -------- Listeners & Initialization --------
        document.getElementById('refreshListBtn')?.addEventListener('click', () => loadArbs(currentPage));
        document.getElementById('applyFiltersBtn')?.addEventListener('click', () => { currentPage = 0; loadArbs(currentPage); });
        document.getElementById('batchValidateBtn')?.addEventListener('click', openBatchValidation);
        document.getElementById('generateReportBtn')?.addEventListener('click', openGenerateReport);
        document.getElementById('clearFiltersBtn')?.addEventListener('click', function() {
            document.querySelectorAll('#filterRow select').forEach(s => s.value = '');
            document.getElementById('globalSearchInput').value = '';
            currentPage = 0;
            loadArbs(currentPage);
        });
        document.getElementById('prevPageBtn')?.addEventListener('click', () => { if (currentPage > 0) { currentPage--; loadArbs(currentPage); } });
        document.getElementById('nextPageBtn')?.addEventListener('click', () => { currentPage++; loadArbs(currentPage); });
        document.getElementById('globalSearchBtn')?.addEventListener('click', () => { currentPage = 0; loadArbs(currentPage); });
        document.getElementById('globalSearchInput')?.addEventListener('keydown', function(e) { if (e.key==='Enter') { currentPage = 0; loadArbs(currentPage); } });

        // Page Jump Logic
        document.getElementById('pageJumpBtn')?.addEventListener('click', () => {
            const input = document.getElementById('pageJumpInput');
            if (!input) return;
            let target = parseInt(input.value, 10);
            let max = Math.ceil(totalRecords/pageSize) || 1;
            if (target >= 1 && target <= max) {
                currentPage = target - 1;
                loadArbs(currentPage);
            } else {
                popToast(`Please enter a page between 1 and ${max}`, 'warn');
                input.value = currentPage + 1; 
            }
        });
        document.getElementById('pageJumpInput')?.addEventListener('keydown', function(e) { 
            if (e.key === 'Enter') document.getElementById('pageJumpBtn').click(); 
        });

        document.getElementById('toggleFiltersBtn')?.addEventListener('click', function() {
            const filters = document.getElementById('advancedFilters');
            filters.classList.toggle('open');
            this.textContent = filters.classList.contains('open') ? '🔽 Hide Filters' : '⚙️ Advanced Filters';
        });

        (async function init() {
            try {
                if (!secureDbClient) {
                    await buildNavbar(null);
                    document.getElementById('arbTableBody').innerHTML = `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;color:#991b1b;">Database connection required.</td></tr>`;
                    return;
                }

                const { data: authData } = await secureDbClient.auth.getUser();
                if (!authData?.user) {
                    await buildNavbar(null);
                    document.getElementById('arbTableBody').innerHTML = `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;">Please <a href="login.html">login</a> to continue.</td></tr>`;
                    return;
                }
                currentUser = authData.user;
                const { data: profile, error: profErr } = await secureDbClient.from('profiles').select('*').eq('id', currentUser.id).single();
                if (profErr && profErr.code !== 'PGRST116') throw profErr;
                currentUserProfile = profile;
                await buildNavbar(profile);

                await populateFilterOptions();
                await loadArboList();
                await loadArbs(0);
                popToast('ARB Management ready.', 'ok');
            } catch(e) {
                console.error(e);
                document.getElementById('arbTableBody').innerHTML = `<tr><td colspan="14" class="empty-card" style="text-align:center;padding:30px;color:#991b1b;">❌ ${safe(e.message)}</td></tr>`;
            }
        })();

    })();
</script>
</body>
</html>
