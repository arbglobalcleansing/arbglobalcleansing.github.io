<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARB Global Cleansing - ARB Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="config.js">
    </script>
    <script src="common.js">
    </script>
    <style>
        /* -------- Modern DAR Color Scheme (Green & Gold) -------- */
        :root {
            --primary-green: #065F46;
            --hover-green: #047857;
            --dar-gold: #D97706;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --bg-light: #f8fafc;
            --border-light: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            background: #f1f5f9;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-light);
        }
        .profile-header h2 {
            margin: 0;
            color: var(--primary-green);
            font-weight: 600;
        }

        .management-toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            color: var(--text-dark);
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 3px rgba(6, 95, 70, 0.1);
        }
        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding: 8px 0;
        }
        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .checkbox-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 8px 0;
        }
        .checkbox-column label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            background: var(--primary-green) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary:hover {
            background: var(--hover-green) !important;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: #94a3b8 !important;
            cursor: not-allowed;
            opacity: 0.8;
            transform: none;
        }

        .action-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            min-width: 140px;
        }
        .update-validation-btn {
            grid-column: span 2;
        }
        .btn-sm {
            padding: 4px 6px !important;
            font-size: 0.65rem;
            text-align: center;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            white-space: nowrap;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-success {
            background: #dcfce7;
            color: #166534;
        }
        .badge-warning {
            background: #fef08a;
            color: #713f12;
        }
        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }
        .badge-neutral {
            background: #f1f5f9;
            color: #475569;
        }

        .arb-table-wrap {
            overflow-x: auto;
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            background: white;
            border: 1px solid var(--border-light);
        }
        .arb-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .arb-table th {
            background: var(--bg-light);
            color: var(--primary-green);
            padding: 12px 8px;
            text-align: left;
            border-bottom: 2px solid var(--border-light);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .arb-table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        .arb-table tr:hover {
            background: #f8fafc;
        }

        .empty-card {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 40px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
            background: var(--bg-light);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
        }
        .filter-row .form-group {
            min-width: 140px;
            flex: 1;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
        }
        .search-container .search-input-group {
            flex: 3;
            min-width: 300px;
            display: flex;
        }

        .omni-search-input {
            flex: 1;
            width: 100%;
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            background: #f8fafc;
            color: var(--text-dark);
            font-family: inherit;
            transition: all 0.25s ease-in-out;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }
        .omni-search-input:focus {
            border-color: var(--primary-green);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(6, 95, 70, 0.15);
        }

        .search-container .search-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toggle-filters-btn {
            background: none;
            border: none;
            color: var(--primary-green);
            font-weight: 700;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .toggle-filters-btn:hover {
            background: #ecfdf5;
        }

        .advanced-filters {
            margin-top: 12px;
            padding: 16px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .advanced-filters.open {
            display: block;
        }
        .advanced-filters .filter-row {
            background: transparent;
            padding: 0;
            margin-bottom: 0;
            border: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            place-items: center;
            transition: all 0.3s ease;
        }
        .modal.active {
            display: grid;
        }

        .modal-content {
            background: #fff;
            width: 95%;
            max-width: 1200px;
            height: 88vh !important;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .sub-modal-content {
            height: auto !important;
            max-height: 90vh !important;
            max-width: 650px !important;
        }

        .modal-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: var(--primary-green);
            color: #fff;
            border-bottom: 3px solid var(--dar-gold);
            flex-shrink: 0;
        }
        .window-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: inline-block;
            padding: 0;
            margin: 0;
            transition: transform 0.2s;
        }
        .window-btn:hover {
            transform: scale(1.1);
        }
        .btn-close-win {
            background: #ff5f56;
        }
        .btn-min-win {
            background: #ffbd2e;
        }
        .btn-max-win {
            background: #27c93f;
        }

        .modal-body-scroll {
            padding: 0;
            overflow-y: auto;
            flex: 1;
            background: var(--bg-light);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .profile-modal {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            flex: 1;
        }
        .profile-modal .modal-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: #fff;
            height: 100%;
        }

        .profile-sidebar {
            width: 280px;
            min-width: 250px;
            background: #f8fafc;
            padding: 30px 20px;
            border-right: 1px solid var(--border-light);
            overflow-y: auto;
            flex-shrink: 0;
            height: 100%;
            box-sizing: border-box;
        }
        .profile-sidebar .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--primary-green), #047857);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto 16px;
            border: 4px solid #d1fae5;
            object-fit: cover;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .profile-sidebar .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-sidebar .sidebar-name {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary-green);
            line-height: 1.2;
        }
        .profile-sidebar .sidebar-id {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-family: monospace;
        }
        .profile-sidebar .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .profile-sidebar .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }
        .profile-sidebar .sidebar-actions .btn {
            width: 100%;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .profile-tabs {
            flex: 1;
            padding: 24px 30px;
            background: white;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            min-width: 0;
        }
        .profile-tabs .tab-nav {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-light);
            margin-bottom: 24px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .profile-tabs .tab-nav button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .profile-tabs .tab-nav button:hover {
            color: var(--primary-green);
        }
        .profile-tabs .tab-nav button.active {
            color: var(--primary-green);
            border-bottom-color: var(--primary-green);
        }

        .profile-tabs .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-right: 15px;
            min-height: 0;
        }
        .profile-tabs .tab-content.active {
            display: block;
        }

        #modal .modal-content {
            width: min(1200px, 95vw);
            height: min(820px, 88vh) !important;
        }
        .profile-tabs .tab-content {
            height: 100%;
        }
        .table-view-modal {
            width: min(1600px, 98vw) !important;
            max-width: 1600px !important;
        }
        .table-view-wrap {
            overflow: auto;
            height: 100%;
            border: 1px solid var(--border-light);
        }
        .data-grid {
            border-collapse: separate;
            border-spacing: 0;
            min-width: 2400px;
            width: 100%;
            font-size: .78rem;
        }
        .data-grid th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #e2f3ea;
            color: var(--primary-green);
        }
        .data-grid th,
        .data-grid td {
            border-right: 1px solid #d1d5db;
            border-bottom: 1px solid #d1d5db;
            padding: 7px 9px;
            white-space: nowrap;
            text-align: left;
        }
        .data-grid tbody tr:nth-child(even) {
            background: #f8fafc;
        }
        .data-grid input,
        .data-grid select {
            min-width: 110px;
            padding: 5px 7px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: .76rem;
        }
        .table-view-toolbar {
            display: flex;
            gap: 10px;
            align-items: end;
            flex-wrap: wrap;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .table-view-toolbar label {
            font-size: .72rem;
            color: #475569;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* -------- OCR REVIEW ROW WITH ACTION SELECTION -------- */
        .ocr-review-row {
            display: grid;
            grid-template-columns: 140px 1fr 140px 1fr 1fr;
            gap: 8px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .ocr-review-row .ocr-arb-info {
            font-weight: 600;
            font-size: 0.85rem;
            line-height: 1.3;
        }
        .ocr-review-row .ocr-arb-info small {
            font-weight: 400;
            color: #64748b;
            font-size: 0.7rem;
            display: block;
        }
        .ocr-review-row .ocr-action-select {
            min-width: 120px;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            background: white;
        }
        .ocr-review-row .ocr-action-select:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 3px rgba(6, 95, 70, 0.1);
        }
        .ocr-review-row .ocr-action-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .ocr-review-row .ocr-action-fields input {
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.75rem;
            min-width: 100px;
            flex: 1;
        }
        .ocr-review-row .ocr-action-fields input:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 0 3px rgba(6, 95, 70, 0.1);
        }
        .ocr-review-row .ocr-arbo-select {
            padding: 5px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.75rem;
            min-width: 130px;
            background: white;
        }
        .ocr-review-row .ocr-post-btn {
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 4px;
            border: none;
            background: var(--primary-green);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .ocr-review-row .ocr-post-btn:hover {
            background: var(--hover-green);
        }
        .ocr-review-row .ocr-post-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .ocr-review-row .ocr-status-badge {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .ocr-review-row .ocr-status-badge.pending {
            background: #fef08a;
            color: #713f12;
        }
        .ocr-review-row .ocr-status-badge.posted {
            background: #dcfce7;
            color: #166534;
        }

        .duplicate-review-scroll {
            max-height: 62vh;
            overflow: auto;
            border: 1px solid var(--border-light);
            border-radius: 8px;
        }
        .duplicate-review-scroll table {
            min-width: 1320px;
            margin: 0;
        }
        .duplicate-review-scroll th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #f1f5f9;
        }
        @media print {
            body * {
                visibility: hidden !important;
            }
            #printArea,
            #printArea * {
                visibility: visible !important;
            }
            #printArea {
                position: absolute;
                inset: 0;
            }
            .no-print {
                display: none !important;
            }
        }
        .link-button {
            border: 0;
            background: none;
            padding: 0;
            color: #0369a1;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }

        .profile-tabs .tab-content h4 {
            margin-top: 0;
            color: var(--primary-green);
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 10px;
            font-size: 1.15rem;
            font-weight: 600;
        }
        .profile-tabs .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 40px;
            margin-bottom: 30px;
        }
        .profile-tabs .detail-item {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #f1f5f9;
            padding: 8px 0;
        }
        .profile-tabs .detail-item .label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 4px;
        }
        .profile-tabs .detail-item .value {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 400;
            word-break: break-word;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-light);
            border-radius: 8px;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .table-wrap th {
            background: var(--bg-light);
            color: var(--primary-green);
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border-light);
            font-weight: 700;
        }
        .table-wrap td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: top;
        }

        @media (max-width: 800px) {
            .profile-modal .modal-body {
                flex-direction: column;
            }
            .profile-sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                padding: 20px;
            }
            .profile-tabs .detail-grid {
                grid-template-columns: 1fr;
            }
            .ocr-review-row {
                grid-template-columns: 1fr;
                gap: 6px;
                padding: 12px;
            }
            .ocr-review-row .ocr-action-fields {
                flex-direction: column;
                align-items: stretch;
            }
            .ocr-review-row .ocr-action-fields input {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ ARB Global Cleansing <small>ARB Management</small></h1>

        <nav class="nav" id="mainNav"></nav>

        <div class="search-container">
            <div class="search-input-group">
                <input id="globalSearchInput" class="omni-search-input" placeholder="Search name, ID, Mother CLOA, title, landowner, COCROM, or location..." autocomplete="off" aria-label="Search">
            </div>
            <div class="search-actions">
                <button type="button" class="btn btn-primary" id="globalSearchBtn" style="padding:14px 20px;font-size:1.05rem;">Search</button>
                <button type="button" class="toggle-filters-btn" id="toggleFiltersBtn">Advanced Filters</button>
                <button type="button" class="btn btn-primary" id="refreshListBtn">Refresh</button>

            function safe(value) { return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }

            function displayValue(value) { return (value === null || value === undefined || String(value).trim() ===
                '') ? '—' : safe(value); }

            function formatDateValue(value) {
                if (!value) return '—';
                const d = new Date(value);
                return isNaN(d.getTime()) ? safe(value) : d.toLocaleDateString('en-PH', { year: 'numeric',
                    month: 'short', day: 'numeric' });
            }

            function badge(value, kind = 'warning') {
                const cls = kind === 'success' ? 'badge-success' : kind === 'danger' ? 'badge-danger' : kind === 'info' ?
                    'badge-info' : kind === 'neutral' ? 'badge-neutral' : 'badge-warning';
                return `<span class="badge ${cls}">${displayValue(value)}</span>`;
            }

            function boolBadge(value) { return value ? badge('YES', 'success') : badge('NO', 'neutral'); }

            function emptyToNull(value) { const t = String(value ?? '').trim(); return t === '' ? null : t; }

            function fullName(arb) {
                if (!arb) return '—';
                const parts = [arb.last_name ? arb.last_name + ',' : '', arb.first_name || '', arb.middle_name || '']

                return parts.join(' ').trim() || '—';
            }

            function arbInitials(arb) {
                const parts = [arb.first_name, arb.last_name].filter(Boolean);
                if (parts.length === 0) return 'ARB';
                return parts.map(p => p.charAt(0).toUpperCase()).join('');
            }

            const ARB_PHOTO_BUCKET = 'arb-photos';
            const MAX_PHOTO_DIMENSION = 640;
            const TARGET_PHOTO_BYTES = 80 * 1024;
            const MAX_SOURCE_PHOTO_BYTES = 12 * 1024 * 1024;

            function canvasToBlob(canvas, type, quality) {
                return new Promise((resolve, reject) => canvas.toBlob(
                    blob => blob ? resolve(blob) : reject(new Error('Photo compression failed.')),
                    type, quality
                ));
            }

            async function compressImage(source) {
                const objectUrl = source instanceof Blob ? URL.createObjectURL(source) : source;
                try {
                    const img = await new Promise((resolve, reject) => {
                        const el = new Image();
                        el.onload = () => resolve(el);
                        el.onerror = () => reject(new Error('The selected image cannot be opened.'));
                        el.src = objectUrl;
                    });
                    const scale = Math.min(1, MAX_PHOTO_DIMENSION / Math.max(img.naturalWidth, img.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    let type = 'image/webp';
                    let quality = 0.78;
                    let blob = await canvasToBlob(canvas, type, quality);
                    if (blob.type !== type) {
                        type = 'image/jpeg';
                        blob = await canvasToBlob(canvas, type, quality);
                    }
                    while (blob.size > TARGET_PHOTO_BYTES && quality > 0.48) {
                        quality -= 0.07;
                        blob = await canvasToBlob(canvas, type, quality);
                    }
                    return { blob, extension: type === 'image/webp' ? 'webp' : 'jpg' };
                } finally {
                    if (source instanceof Blob) URL.revokeObjectURL(objectUrl);
                }
            }

            async function getProfilePhotoUrl(profile) {
                if (profile?.photo_path) {
                    const { data, error } = await secureDbClient.storage
                        .from(ARB_PHOTO_BUCKET).createSignedUrl(profile.photo_path, 3600);
                    if (!error && data?.signedUrl) return data.signedUrl;
                }
                return profile?.image_base64 || '';
            }

            async function imageUrlToJpegDataUrl(url) {
                if (!url) return '';
                const response = await fetch(url);
                if (!response.ok) throw new Error('Unable to load the ARB photo.');
                const img = await createImageBitmap(await response.blob());
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d', { alpha: false });
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                return canvas.toDataURL('image/jpeg', 0.85);
            }

            async function fetchAllRecords(queryBuilderFn) {
                let allRecords = [];
                let p = 0;
                const size = 1000;
                while (true) {
                    const { data, error } = await queryBuilderFn().range(p * size, (p + 1) * size - 1);
                    if (error) { console.error('Fetch error:', error); break; }
                    if (!data || data.length === 0) break;
                    allRecords.push(...data);
                    if (data.length < size) break;
                    p++;
                }
                return allRecords;
            }

            async function fetchInChunks(table, selectStr, column, idArray) {
                let results = [];
                const chunkSize = 150;
                for (let i = 0; i < idArray.length; i += chunkSize) {
                    const chunk = idArray.slice(i, i + chunkSize);
                    const { data } = await secureDbClient.from(table).select(selectStr).in(column, chunk);
                    if (data) results.push(...data);
                }
                return results;
            }

            async function saveValidationRecord(valPayload) {
                let matchQuery = secureDbClient.from('arb_validations')
                    .select('id')
                    .eq('arb_id', valPayload.arb_id)
                    .eq('validator_type', valPayload.validator_type);

                if (valPayload.arb_landholding_id) {
                    matchQuery = matchQuery.eq('arb_landholding_id', valPayload.arb_landholding_id);
                } else {
                    matchQuery = matchQuery.is('arb_landholding_id', null);
                }

                const { data: existingVals, error: matchErr } = await matchQuery;
                if (matchErr) throw matchErr;

                if (existingVals && existingVals.length > 0) {
                    return await secureDbClient.from('arb_validations').update(valPayload).eq('id', existingVals[0].id);
                } else {
                    return await secureDbClient.from('arb_validations').insert(valPayload);
                }
            }

            async function populateFilterOptions() {

            async function openArbProfile(arbId) {
                showModal('ARB Profile', '<p class="empty-msg" style="padding:40px;">Loading ARB profile...</p>');

                try {
                    const arbRes = await secureDbClient.from('arb').select(`
                            *, arbo:arbo_id ( id, name, municipality, barangay )
                        `).eq('id', arbId).single();
                    if (arbRes.error) throw arbRes.error;
                    const arb = arbRes.data;

                    let profile = {};
                    let profileId = null;
                    const profRes = await secureDbClient.from('arb_profiles').select('*').eq('arb_id', String(arbId))
                        .single();
                    if (profRes.error && profRes.error.code !== 'PGRST116') throw profRes.error;
                    if (profRes.data) {
                        profile = profRes.data;
                        profileId = profile.id;
                    } else {
                        profile = { id: null };
                    }

                    let heirs = [],
                        landholdings = [],
                        tags = [],
                        validations = [];
                    if (profileId) {
                        const [hRes, lRes, tRes, vRes] = await Promise.all([
                            secureDbClient.from('arb_heirs').select('*').eq('arb_profile_id', profileId).order(
                                'created_at', { ascending: true }),
                            secureDbClient.from('arb_landholdings').select('*').eq('arb_profile_id', profileId)
                            .order('is_primary', { ascending: false }),
                            secureDbClient.from('arb_tags').select('*').eq('arb_profile_id', profileId).order(
                                'created_at', { ascending: false }),
                            secureDbClient.from('arb_validations').select(
                                    'id, validator_type, validator_name, position, date_validated, validation_basis, supporting_document_reference, arb_landholding_id'
                                    ).eq('arb_id', arbId).order('date_validated', { ascending: false })
                        ]);
                        heirs = hRes.data || [];
                        landholdings = lRes.data || [];
                        tags = tRes.data || [];
                        validations = vRes.data || [];
                    }

                    const arbo = arb.arbo || {};

                    let dispMunicipality = arbo.municipality;
                    let dispBarangay = arbo.barangay;
                    let dispTitle = '—';

                    if (landholdings && landholdings.length > 0) {
                        const validLandholding = landholdings.find(l => l.municipality);
                        if (validLandholding) {
                            dispMunicipality = validLandholding.municipality;
                            dispBarangay = validLandholding.barangay || dispBarangay;
                        }
                        const lh = landholdings[0];
                        dispTitle = lh.title_no || lh.ep_cloa_serial_no || lh.ccloa_title_raw || '—';
                    }

                    const motherTitles = [...new Set(landholdings.map(h => h.original_mother_title_no || h
                        .ccloa_title_raw).filter(Boolean))];
                    let motherGroup = [];
                    if (motherTitles.length) {
                        const relatedHoldings = await fetchAllRecords(() => secureDbClient.from('arb_landholdings')
                            .select(
                                'arb_profile_id, original_mother_title_no, ccloa_title_raw, title_no, landowner, municipality, barangay, cocrom_certificate_no'
                                )
                            .in('original_mother_title_no', motherTitles));
                        const relatedProfileIds = [...new Set(relatedHoldings.map(h => h.arb_profile_id).filter(
                        Boolean))];
                        const relatedProfiles = relatedProfileIds.length ? await fetchInChunks('arb_profiles',
                            'id, arb_id, e_title_no, cocrom_no', 'id', relatedProfileIds) : [];
                        const relatedArbIds = relatedProfiles.map(p => p.arb_id).filter(Boolean);
                        const relatedArbs = relatedArbIds.length ? await fetchInChunks('arb',
                            'id, first_name, middle_name, last_name', 'id', relatedArbIds) : [];
                        const pMap = Object.fromEntries(relatedProfiles.map(p => [String(p.id), p]));
                        const aMap = Object.fromEntries(relatedArbs.map(a => [String(a.id), a]));
                        motherGroup = relatedHoldings.map(h => ({ ...h, profile: pMap[String(h.arb_profile_id)] ||
                                {}, arb: aMap[String(pMap[String(h.arb_profile_id)]?.arb_id)] || {} }));
                    }

                    const profilePhotoUrl = await getProfilePhotoUrl(profile);

                    const body = `
                            <div class="profile-modal">
                                <div class="modal-body">
                                    <div class="profile-sidebar">
                                        <div class="avatar">
                                            ${profilePhotoUrl ? `<img src="${safe(profilePhotoUrl)}" alt="Photo">` : safe(arbInitials(arb))}
                                        </div>
                                        <div class="sidebar-name">${safe(fullName(arb))}</div>
                                        <div class="sidebar-id">${displayValue(arb.generated_arb_id || profile.generated_arb_ic || arb.id)}</div>
                                        <div class="badge-group">
                                            ${badge(arb.life_status || profile.life_status || 'Unknown', (arb.life_status || profile.life_status)==='Active'?'success':(arb.life_status || profile.life_status)==='Dead'?'danger':'neutral')}
                                            ${badge(arb.validation_status || 'Pending', arb.validation_status==='Validated'?'success':arb.validation_status==='Rejected'?'danger':'warning')}
                                            ${badge(profile.split_status || 'N/A', profile.split_status==='SPLIT'?'warning':'neutral')}
                                        </div>
                                        <div class="sidebar-actions">
                                            ${profileId ? (isFullAdmin() ? `<button class="btn btn-primary" id="profileEditBtn">Edit Profile</button>` : '') : `<p class="empty-card" style="font-size:0.8rem;">Profile record missing.</p>`}
                                            ${profileId && (arb.life_status || profile.life_status)==='Dead' && canTagDeceased() ? `<button class="btn btn-primary" id="profileAddHeirBtn">Add Heir</button>` : ''}
                                            ${profileId && canManageLegal() ? `<button class="btn btn-primary" id="profileAddTagBtn">Tag / Case</button>` : ''}
                                            ${profileId && canTagDeceased() ? `<button class="btn btn-primary" id="profileDeceasedBtn">Tag Deceased</button>` : ''}
                                            ${profileId && canValidateOrAssign() ? `<button class="btn btn-primary" id="profileAddValidationBtn">Validate</button>` : ''}
                                            ${!profileId && isFullAdmin() ? `<button class="btn btn-primary" id="profileCreateProfileBtn">Create Profile</button>` : ''}
                                        </div>
                                    </div>
                                    <div class="profile-tabs">
                                        <div class="tab-nav">
                                            <button class="active" data-tab="overview">Profile & Landholdings</button>
                                            <button data-tab="heirs">Heirs (${heirs.length})</button>
                                            <button data-tab="tags">Tags (${tags.length})</button>
                                            <button data-tab="validations">Validations (${validations.length})</button>
                                            <button data-tab="mother">Mother CLOA Group (${motherGroup.length})</button>
                                        </div>
                                        <div class="tab-content active" id="tab-overview">
                                            ${renderOverview(arb, profile, arbo, dispMunicipality, dispBarangay, dispTitle)}
                                            <h4 style="margin-top:25px;border-bottom:2px solid #e2e8f0;padding-bottom:8px;">Landholding Details</h4>
                                            ${renderLandholdings(landholdings)}
                                        </div>
                                        <div class="tab-content" id="tab-heirs">
                                            ${renderHeirs(heirs)}
                                        </div>
                                        <div class="tab-content" id="tab-tags">
                                            ${renderTags(tags)}
                                        </div>
                                        <div class="tab-content" id="tab-validations">
                                            ${renderValidations(validations, landholdings)}
                                        </div>
                                        <div class="tab-content" id="tab-mother">
                                            ${renderMotherGroup(motherGroup)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;

                    showModal(`ARB Profile - ${fullName(arb)}`, body);

                    document.querySelectorAll('.tab-nav button').forEach(btn => {
                        btn.addEventListener('click', function() {
                            document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove(
                            'active'));
                            this.classList.add('active');
                            const tabId = this.dataset.tab;
                            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove(
                            'active'));
                            document.getElementById('tab-' + tabId).classList.add('active');
                        });
                    });

                    if (profileId) {
                        document.getElementById('profileEditBtn')?.addEventListener('click', () => { openEditArb(
                            arbId); });
                        document.getElementById('profileAddHeirBtn')?.addEventListener('click', () => { openHeirForm(
                            arbId); });
                        document.getElementById('profileAddTagBtn')?.addEventListener('click', () => { openTagArb(
                            arbId); });
                        document.getElementById('profileDeceasedBtn')?.addEventListener('click', () => { openTagArb(
                            arbId, 'DEAD'); });
                        document.getElementById('profileAddValidationBtn')?.addEventListener('click', () => {
                            openValidationForm(arbId, arb.validation_status); });
                    } else {
                        document.getElementById('profileCreateProfileBtn')?.addEventListener('click', async function() {
                            this.disabled = true;
                            this.textContent = "Processing...";
                            try {
                                const { data, error } = await secureDbClient.from('arb_profiles').insert({
                                    arb_id: String(arbId),
                                    created_at: new Date().toISOString(),
                                    updated_at: new Date().toISOString()
                                }).select('id').single();
                                if (error) { popToast('RLS policy error: ' + error.message,
                                'err'); return; }
                                hideModal();
                                popToast('Profile created successfully. Re-open to edit.', 'ok');
                                openArbProfile(arbId);
                            } catch (e) { popToast(e.message, 'err'); }
                        });
                    }

                } catch (err) {
                    const mBody = document.getElementById('modalBody');
                    if (mBody) mBody.innerHTML =
                        `<p class="empty-msg" style="color:#991b1b;">Error: ${safe(err.message)}</p>`;
                    popToast(err.message, 'err');
                }
            }

            function qrCodeDataUrl(value) {
                if (!window.QRCode) return '';
                const holder = document.createElement('div');
                holder.style.position = 'fixed';
                holder.style.left = '-9999px';
                document.body.appendChild(holder);
                try {
                    new QRCode(holder, { text: value, width: 180, height: 180, colorDark: '#064e3b',
                        colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
                    const canvas = holder.querySelector('canvas');
                    return canvas ? canvas.toDataURL('image/png') : '';
                } finally { holder.remove(); }
            }

            async function updateCocromForMother(profileId, certificateNo) {
                if (!profileId) return;
                const ownHoldings = await fetchAllRecords(() => secureDbClient.from('arb_landholdings')
                    .select('original_mother_title_no, ccloa_title_raw').eq('arb_profile_id', profileId));
                const mothers = [...new Set(ownHoldings.map(h => h.original_mother_title_no || h.ccloa_title_raw)
                    .filter(Boolean))];
                if (!mothers.length) {
                    const { error } = await secureDbClient.from('arb_landholdings').update({ cocrom_certificate_no: certificateNo })
                        .eq('arb_profile_id', profileId);
                    if (error) throw error;
                    return;
                }
                const [byMother, byRawTitle] = await Promise.all([
                    secureDbClient.from('arb_landholdings').update({ cocrom_certificate_no: certificateNo,
                            updated_at: new Date().toISOString() })
                    .in('original_mother_title_no', mothers).select('arb_profile_id'),
                    secureDbClient.from('arb_landholdings').update({ cocrom_certificate_no: certificateNo,
                            updated_at: new Date().toISOString() })
                    .in('ccloa_title_raw', mothers).select('arb_profile_id')
                ]);
                if (byMother.error) throw byMother.error;
                if (byRawTitle.error) throw byRawTitle.error;
                const affectedProfileIds = [...new Set([...(byMother.data || []), ...(byRawTitle.data || [])].map(
                    r => r.arb_profile_id).filter(Boolean))];
                for (let i = 0; i < affectedProfileIds.length; i += 200) {
                    const { error } = await secureDbClient.from('arb_profiles').update({ cocrom_no: certificateNo,
                            updated_at: new Date().toISOString() })
                        .in('id', affectedProfileIds.slice(i, i + 200));
                    if (error) throw error;
                }
            }

                            'FOR HEARING / COMMENT', 'WITH ORDER - GRANTED', 'WITH ORDER - DENIED',

                        ]
                    };

                    const formHtml = `
                            <form id="tagArbForm">

                                    <div class="form-group full"><label>Target Date</label><input type="date" name="action_date" value="${new Date().toISOString().substring(0,10)}" required><small>The actual tagging date and active user are recorded automatically.</small></div>
                                    <div class="form-group"><label for="tagType">Tag Type</label><select id="tagType" name="tag_type" required>${tagTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}</select></div>
                                    <div class="form-group" id="tagLandholdingGroup" style="display:none;"><label for="tagLandholding">Particular Landholding</label><select id="tagLandholding" name="arb_landholding_id"><option value="">Select the affected landholding</option>${legalHoldingOptions}</select><small>Required only for Land Conversion or Cancellation of Title.</small></div>

                                    <div class="form-group" id="aliCategoryGrp" style="display:none;">
                                        <label>ALI Category</label>

                                            <option value="REGULAR">REGULAR ALI</option>

                                    <div class="form-group" id="aliTypeGrp" style="display:none;">
                                        <label>ALI Type</label>
                                        <select id="aliType" name="ali_type">
                                            ${splitAliOptions}
                                        </select>
                                    </div>

                                    <div class="form-group full" id="reasonGrp" style="display:none;"><label>Reason for Rollback</label><input type="text" name="rollback_reason" placeholder="Required if moving target date backward..."></div>
                                    <div class="form-group full"><label for="tagStatus">Status</label><select id="tagStatus" name="status"></select></div>
                                    <div class="form-group full"><label for="tagCaseRef">Case Reference No.</label><input id="tagCaseRef" name="case_reference_no"></div>
                                    <div class="form-group full"><label for="tagCaseDetails">Case Details / Reason</label><textarea id="tagCaseDetails" name="case_details"></textarea></div>
                                    <div class="form-group full" id="deathDocSection" style="display:none;padding:12px;border:1px solid #f59e0b;border-radius:8px;background:#fffbeb;">
                                        <label>Required Death Supporting Document</label>
                                        <select name="death_document_type" id="deathDocumentType"><option value="DEATH CERTIFICATE">Death Certificate</option><option value="BARANGAY CERTIFICATION">Barangay Certification (if no Death Certificate)</option><option value="PHOTO DOCUMENTATION">Photo Documentation</option></select>
                                        <input type="file" name="death_document_file" id="deathDocumentFile" accept="image/*,application/pdf" style="margin-top:8px;">
                                        <small>Maximum file size: 12 MB. A unique document number will be generated automatically.</small>
