<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
</head>
<body>
<div class="container">
    <h1>ARBO Management</h1>
    <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="arbo.html" class="active">ARBO</a>
        <a href="arb.html">ARB</a>
        <a href="validators.html">Validators</a>
        <a href="reports.html">Reports</a>
        <span class="user-badge" id="userDisplay"></span>
        <a href="#" class="logout-link" onclick="logout()">Logout</a>
    </nav>

    <div class="section">
        <div class="toolbar">
            <input type="text" id="searchArbo" placeholder="🔍 Search ARBO..." oninput="loadArbos()" />
            <button class="btn btn-primary" id="addArboBtn" onclick="openArboModal()">➕ Add ARBO</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>ARBO Name</th><th>Barangay</th><th>Municipality</th><th>Contact</th><th>Actions</th></tr></thead>
                <tbody id="arboTableBody"><tr><td colspan="6" style="text-align: center;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="arboModal" class="modal">
    <div class="modal-content">
        <h2 id="arboModalTitle">Add ARBO</h2>
        <form id="arboForm" onsubmit="saveArbo(event)">
            <input type="hidden" id="arboId" />
            <div class="form-grid">
                <div><label>ARBO Name *</label><input id="arboName" required /></div>
                <div><label>Barangay</label><input id="arboBarangay" /></div>
                <div><label>Municipality</label><input id="arboMunicipality" /></div>
                <div><label>Contact Number</label><input id="arboContact" /></div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" onclick="closeModal('arboModal')">Cancel</button>
                <button type="submit" class="btn btn-success">💾 Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Isolate scope to prevent variable collisions
    (async function() {
        
        // 1. Failsafe Error Catcher
        window.onerror = function(msg, url, line) {
            console.error(`[CRITICAL CRASH] Line ${line}: ${msg}`);
            const tbody = document.getElementById('arboTableBody');
            if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center;">❌ Script Crash: ${msg}</td></tr>`;
            return false;
        };

        try {
            // ====================================================================
            // LOUD AUTHENTICATION CHECK (Bypassing common.js to find the bug)
            // ====================================================================
            console.log("Checking authentication status...");
            
            // Step A: Check if logged in
            const { data: authData, error: authErr } = await supabase.auth.getUser();
            if (authErr || !authData || !authData.user) {
                alert("Auth Error: You are not fully logged in. Redirecting to dashboard.");
                window.location.href = 'dashboard.html';
                return;
            }

            // Step B: Check if profile exists and can be read
            const { data: profile, error: profErr } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', authData.user.id)
                .single();

            if (profErr) {
                alert("Database Error: Cannot read your profile.\nSupabase says: " + profErr.message);
                window.location.href = 'dashboard.html';
                return;
            }

            if (!profile) {
                alert("Profile Missing: Your account exists, but your 'profiles' row is missing in the database.");
                window.location.href = 'dashboard.html';
                return;
            }

            // Step C: Check if role is correct
            if (profile.role !== 'admin' && profile.role !== 'staff') {
                alert("Access Denied: Your role is currently set to '" + profile.role + "'. You must be an 'admin' or 'staff' to view this page.");
                window.location.href = 'dashboard.html';
                return;
            }

            // If we make it here, you are officially authorized!
            window.currentProfile = profile;
            document.getElementById('userDisplay').textContent = `👤 ${profile.full_name || authData.user.email} (${profile.role})`;
            
            // ====================================================================

            // 4. Attach application functions to the 'window' object 
            window.loadArbos = async function() {
                try {
                    const search = document.getElementById('searchArbo').value.trim();
                    let query = supabase.from('arbo').select('*');
                    
                    if (search) query = query.ilike('name', `%${search}%`);
                    
                    const { data, error } = await query.order('id', { ascending: false });
                    if (error) throw new Error(error.message);
                    
                    const tbody = document.getElementById('arboTableBody');
                    
                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b;">📭 No ARBO records found.</td></tr>`;
                        return;
                    }

                    // Render table safely
                    tbody.innerHTML = data.map(a => `
                        <tr>
                            <td>${(a.id || '-').toString().substring(0,8)}</td>
                            <td>${typeof escapeHtml === 'function' ? escapeHtml(a.name) : a.name}</td>
                            <td>${typeof escapeHtml === 'function' ? escapeHtml(a.barangay) : a.barangay}</td>
                            <td>${typeof escapeHtml === 'function' ? escapeHtml(a.municipality) : a.municipality}</td>
                            <td>${typeof escapeHtml === 'function' ? escapeHtml(a.contact_number) : a.contact_number}</td>
                            <td class="actions">
                                <button class="btn btn-warning btn-sm" onclick="editArbo(${a.id})" title="Edit">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteArbo(${a.id})" title="Delete">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                } catch (err) {
                    console.error("Load Error:", err);
                    document.getElementById('arboTableBody').innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center;">❌ Error loading data: ${err.message}</td></tr>`;
                }
            };

            window.openArboModal = function() {
                document.getElementById('arboId').value = '';
                document.getElementById('arboForm').reset();
                document.getElementById('arboModalTitle').textContent = 'Add ARBO';
                if (typeof showModal === 'function') showModal('arboModal');
            };

            window.editArbo = async function(id) {
                try {
                    const { data, error } = await supabase.from('arbo').select('*').eq('id', id).single();
                    if (error) throw new Error(error.message);
                    
                    document.getElementById('arboId').value = data.id;
                    document.getElementById('arboName').value = data.name || '';
                    document.getElementById('arboBarangay').value = data.barangay || '';
                    document.getElementById('arboMunicipality').value = data.municipality || '';
                    document.getElementById('arboContact').value = data.contact_number || '';
                    document.getElementById('arboModalTitle').textContent = 'Edit ARBO';
                    
                    if (typeof showModal === 'function') showModal('arboModal');
                } catch (err) {
                    alert(`Error loading ARBO details: ${err.message}`);
                }
            };

            window.saveArbo = async function(e) {
                e.preventDefault(); 
                try {
                    const id = document.getElementById('arboId').value;
                    const payload = {
                        name: document.getElementById('arboName').value.trim(),
                        barangay: document.getElementById('arboBarangay').value.trim(),
                        municipality: document.getElementById('arboMunicipality').value.trim(),
                        contact_number: document.getElementById('arboContact').value.trim(),
                    };
                    
                    let result;
                    if (id) {
                        result = await supabase.from('arbo').update(payload).eq('id', id);
                    } else {
                        result = await supabase.from('arbo').insert([payload]);
                    }
                    
                    if (result.error) throw new Error(result.error.message);
                    
                    if (typeof closeModal === 'function') closeModal('arboModal');
                    window.loadArbos(); 
                } catch (err) {
                    alert(`Error saving ARBO: ${err.message}`);
                }
            };

            window.deleteArbo = async function(id) {
                if (!confirm('Are you sure you want to delete this ARBO?\nAny ARBs linked to it will have their ARBO set to NULL.')) return;
                
                try {
                    const { error } = await supabase.from('arbo').delete().eq('id', id);
                    if (error) throw new Error(error.message);
                    
                    window.loadArbos(); 
                } catch (err) {
                    alert(`Error deleting ARBO: ${err.message}`);
                }
            };

            // 5. Initialize the table on load
            window.loadArbos();

        } catch (fatalErr) {
            console.error("Fatal Page Error:", fatalErr);
            document.getElementById('arboTableBody').innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center;">❌ Critical Page Error: ${fatalErr.message}</td></tr>`;
        }
    })();
</script>
</body>
</html>
