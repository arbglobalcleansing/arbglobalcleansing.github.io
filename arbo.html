<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Cooperative Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        :root { --arbo-navy:#0a3d62; --arbo-blue:#1769a0; --arbo-green:#15803d; --arbo-red:#b91c1c; --arbo-amber:#b45309; --arbo-line:#dbe3ea; --arbo-soft:#f8fafc; }
        .arbo-master-toolbar { display:grid; grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(140px,.7fr)) auto; gap:10px; align-items:end; margin-bottom:15px; }
        .arbo-master-toolbar label { display:block; margin-bottom:5px; color:#475569; font-size:.76rem; font-weight:700; text-transform:uppercase; }
        .arbo-input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:7px; background:white; color:#0f172a; font:inherit; box-sizing:border-box; }
        .arbo-input:focus { outline:none; border-color:var(--arbo-blue); box-shadow:0 0 0 3px rgba(23,105,160,.1); }
        .arbo-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin:18px 0; }
        .arbo-kpi { padding:14px; border:1px solid var(--arbo-line); border-radius:10px; background:white; box-shadow:0 3px 10px rgba(15,23,42,.04); }
        .arbo-kpi span { display:block; color:#64748b; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.035em; }
        .arbo-kpi strong { display:block; margin-top:5px; color:var(--arbo-navy); font-size:1.35rem; }
        .workspace { margin-top:24px; overflow:hidden; border:1px solid var(--arbo-line); border-radius:12px; background:white; box-shadow:0 10px 28px rgba(15,23,42,.08); }
        .workspace-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:20px; border-bottom:1px solid var(--arbo-line); background:linear-gradient(135deg,#fff,#f2f8fc); }
        .workspace-header h2 { margin:0 0 5px; color:var(--arbo-navy); }
        .workspace-header p { margin:0; color:#64748b; }
        .workspace-actions { display:flex; flex-wrap:wrap; gap:8px; }
        .workspace-tabs { display:flex; gap:4px; overflow:auto; padding:8px 10px 0; border-bottom:1px solid var(--arbo-line); background:#f8fafc; }
        .workspace-tab { flex:0 0 auto; padding:10px 12px; border:0; border-bottom:3px solid transparent; background:transparent; color:#475569; font-weight:700; cursor:pointer; }
        .workspace-tab.active { border-bottom-color:var(--arbo-blue); color:var(--arbo-navy); background:white; }
        .workspace-body { min-height:280px; padding:18px; }
        .module-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:13px; }
        .module-heading h3 { margin:0; color:var(--arbo-navy); }
        .module-note { margin:3px 0 0; color:#64748b; font-size:.82rem; }
        .module-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .data-table-wrap { width:100%; overflow:auto; border:1px solid var(--arbo-line); border-radius:8px; }
        .data-table { width:100%; min-width:900px; border-collapse:collapse; }
        .data-table th,.data-table td { padding:10px; border-bottom:1px solid #e8edf2; text-align:left; vertical-align:top; }
        .data-table th { background:#f8fafc; color:#475569; font-size:.76rem; text-transform:uppercase; letter-spacing:.025em; }
        .data-table tr:last-child td { border-bottom:0; }
        .data-table tbody tr:hover { background:#fbfdff; }
        .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:.7rem; font-weight:800; white-space:nowrap; }
        .badge-green { color:#166534; background:#dcfce7; }
        .badge-red { color:#991b1b; background:#fee2e2; }
        .badge-amber { color:#92400e; background:#fef3c7; }
        .badge-blue { color:#1e40af; background:#dbeafe; }
        .badge-gray { color:#475569; background:#e2e8f0; }
        .due-row { background:#fff7ed !important; }
        .overdue-row { background:#fff1f2 !important; }
        .empty-panel { padding:30px; color:#64748b; text-align:center; }
        .profile-summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .profile-summary-card { padding:15px; border:1px solid var(--arbo-line); border-radius:9px; background:#f8fafc; }
        .profile-summary-card h4 { margin:0 0 10px; color:var(--arbo-navy); }
        .summary-field { display:grid; grid-template-columns:130px 1fr; gap:8px; padding:6px 0; border-bottom:1px dashed #dbe3ea; }
        .summary-field:last-child { border-bottom:0; }
        .summary-field span { color:#64748b; font-size:.8rem; }
        .summary-field strong { overflow-wrap:anywhere; font-size:.85rem; }
        .form-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .form-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .field-group { min-width:0; }
        .field-group.full { grid-column:1 / -1; }
        .field-group label { display:block; margin-bottom:5px; color:#334155; font-size:.82rem; font-weight:700; }
        .field-help { display:block; margin-top:4px; color:#64748b; font-size:.75rem; }
        .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
        .picker-results { max-height:250px; overflow:auto; margin-top:10px; border:1px solid var(--arbo-line); border-radius:7px; }
        .picker-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #e8edf2; }
        .picker-row:last-child { border-bottom:0; }
        .picker-row small { display:block; margin-top:3px; color:#64748b; }
        .selected-person { margin-top:10px; padding:10px; border:1px solid #86efac; border-radius:7px; background:#f0fdf4; color:#166534; }
        .picker-row.is-selected { background:#f0fdf4; }
        .picker-check { display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; }
        .picker-check input { width:18px; height:18px; flex:0 0 auto; }
        .selected-bulk { margin-top:14px; border:1px solid #86efac; border-radius:8px; overflow:auto; }
        .selected-bulk h4 { margin:0; padding:10px 12px; color:#166534; background:#f0fdf4; }
        .selected-bulk table { width:100%; min-width:1050px; border-collapse:collapse; }
        .selected-bulk th,.selected-bulk td { padding:8px; border-top:1px solid #dcfce7; text-align:left; vertical-align:top; }
        .selected-bulk th { color:#166534; background:#f7fee7; font-size:.72rem; text-transform:uppercase; }
        .compact-input { min-width:115px; padding:7px 8px; }
        .member-toolbar { display:grid; grid-template-columns:minmax(260px,1fr) auto auto; gap:8px; align-items:center; margin-bottom:12px; }
        .accounting-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
        .accounting-summary > div { padding:12px; border:1px solid var(--arbo-line); border-radius:8px; background:#f8fafc; }
        .accounting-summary span { display:block; color:#64748b; font-size:.72rem; font-weight:700; text-transform:uppercase; }
        .accounting-summary strong { display:block; margin-top:4px; color:var(--arbo-navy); font-size:1.15rem; }
        .voucher-paper { max-width:900px; margin:auto; color:#111827; }
        .voucher-paper h2,.voucher-paper h3 { margin:4px 0; text-align:center; }
        .voucher-grid { display:grid; grid-template-columns:repeat(2,1fr); margin-top:18px; border:1px solid #334155; }
        .voucher-grid > div { min-height:42px; padding:8px; border-right:1px solid #334155; border-bottom:1px solid #334155; }
        .voucher-grid > div:nth-child(2n) { border-right:0; }
        .voucher-grid label { display:block; color:#475569; font-size:.7rem; font-weight:700; text-transform:uppercase; }
        .voucher-signatures { display:grid; grid-template-columns:repeat(3,1fr); gap:28px; margin-top:55px; text-align:center; }
        .voucher-signatures div { padding-top:7px; border-top:1px solid #111827; }
        .access-note { margin:0 0 15px; padding:10px 12px; border-left:4px solid var(--arbo-blue); border-radius:6px; background:#eff6ff; color:#1e3a5f; }
        .warning-note { border-left-color:var(--arbo-amber); background:#fffbeb; color:#78350f; }
        .error-note { border-left-color:var(--arbo-red); background:#fff1f2; color:#881337; }
        .money { white-space:nowrap; font-variant-numeric:tabular-nums; }
        .page-controls { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; }
        .modal-content.coop-modal { width:min(900px,94vw); max-height:92vh; overflow:auto; }
        #setupWarning { display:none; }
        @media print { body > * { display:none !important; } #printArea { display:block !important; position:absolute; inset:0; padding:12px; background:white; } }
        @media (max-width:1050px) { .arbo-master-toolbar { grid-template-columns:repeat(2,1fr); } .arbo-kpis { grid-template-columns:repeat(3,1fr); } .profile-summary-grid { grid-template-columns:1fr; } }
        @media (max-width:700px) { .arbo-master-toolbar,.form-grid-2,.form-grid-3,.member-toolbar { grid-template-columns:1fr; } .arbo-kpis { grid-template-columns:repeat(2,1fr); } .workspace-header { flex-direction:column; } .field-group.full { grid-column:auto; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️ ARB Global Cleansing <small>ARBO Management</small></h1>
    <nav class="nav" id="mainNav"></nav>

    <div id="setupWarning" class="access-note error-note"></div>

    <section class="section">
        <div class="module-heading">
            <div>
                <h2 style="margin:0;color:#0a3d62;">Cooperative Management System</h2>
                <p class="module-note">Only ARBOs permitted by your account are displayed.</p>
            </div>
            <div class="module-actions">
                <button class="btn btn-primary" id="addArboBtn" type="button">➕ Add ARBO</button>
            </div>
        </div>

        <div class="arbo-master-toolbar">
            <div><label for="searchArbo">ARBO name</label><input class="arbo-input" id="searchArbo" placeholder="Search cooperative name"></div>
            <div><label for="searchMunicipality">Municipality</label><input class="arbo-input" id="searchMunicipality" placeholder="All municipalities"></div>
            <div><label for="searchBarangay">Barangay</label><input class="arbo-input" id="searchBarangay" placeholder="All barangays"></div>
            <div><label for="searchStatus">Status</label><select class="arbo-input" id="searchStatus"><option value="">All</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div>
            <button class="btn btn-primary" id="applyArboSearch" type="button">Search</button>
        </div>

        <div class="data-table-wrap">
            <table class="data-table">
                <thead><tr><th>ID</th><th>ARBO</th><th>Municipality</th><th>Barangay</th><th>Contact</th><th>CDA Renewal</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="arboTableBody"><tr><td colspan="8" class="empty-panel">Loading accessible ARBOs…</td></tr></tbody>
            </table>
        </div>
        <div class="page-controls"><button class="btn btn-primary" id="previousArboPage" type="button">Previous</button><span id="arboPageInfo">Page 1</span><button class="btn btn-primary" id="nextArboPage" type="button">Next</button></div>
    </section>

    <section class="workspace" id="cooperativeWorkspace" style="display:none;">
        <header class="workspace-header">
            <div><h2 id="workspaceTitle">ARBO</h2><p id="workspaceSubtitle"></p></div>
            <div class="workspace-actions"><button class="btn btn-warning" id="editCurrentArbo" type="button">✏️ Edit ARBO</button><button class="btn btn-info" id="openReportCenter" type="button">📊 Reports & Forms</button><button class="btn btn-primary" id="printCurrentArbo" type="button">🖨️ Print Module</button><button class="btn btn-danger" id="closeWorkspace" type="button">Close</button></div>
        </header>
        <div id="cdaRenewalAlert" class="access-note warning-note" style="display:none;margin:14px 18px 0;"></div>
        <div class="arbo-kpis" id="workspaceKpis"></div>
        <nav class="workspace-tabs" id="workspaceTabs"></nav>
        <div class="workspace-body" id="workspaceBody"><div class="empty-panel">Select an ARBO.</div></div>
    </section>
</div>

<div id="entityModal" class="modal">
    <div class="modal-content coop-modal">
        <button class="modal-close" id="closeEntityModal" type="button">&times;</button>
        <h2 id="entityModalTitle">Add record</h2>
        <form id="entityForm">
            <input type="hidden" id="entityType"><input type="hidden" id="entityId">
            <div id="entityFormBody"></div>
            <div class="form-actions"><button class="btn btn-danger" id="cancelEntity" type="button">Cancel</button><button class="btn btn-success" id="saveEntity" type="submit">💾 Save</button></div>
        </form>
    </div>
</div>

<div id="printArea" style="display:none;"><h2 id="printHeading"></h2><p id="printSubheading"></p><div id="printBody"></div></div>

<script>
(async function () {
    'use strict';
    const PAGE_SIZE = 50;
    const state = {
        db:null, user:null, profile:null, arboPage:0, arboCount:0,
        currentArbo:null, activeTab:'overview', selectedMemberCandidate:null, selectedValidator:null,
        selectedBulkMembers:new Map(), selectedLinkedMember:null, memberSearch:'', memberPage:0, memberPageSize:100,
        arbSearchTimer:null,
        data:{ members:[], officers:[], machinery:[], services:[], income:[], expenses:[], capital:[], activities:[], validators:[], accounts:[], vouchers:[], journals:[], journalLines:[] }
    };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const blank = (v) => v === null || v === undefined || String(v).trim() === '';
    const val = (v) => blank(v) ? '—' : esc(v);
    const nullIfBlank = (v) => blank(v) ? null : String(v).trim();
    const money = (v) => '₱' + (Number(v) || 0).toLocaleString('en-PH', {minimumFractionDigits:2,maximumFractionDigits:2});
    const dateOnly = (v) => v ? String(v).slice(0,10) : '';
    const formatDate = (v) => { if (!v) return '—'; const d=new Date(String(v).length===10?v+'T00:00:00':v); return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}); };
    const badge = (text, kind='gray') => `<span class="badge badge-${kind}">${val(text)}</span>`;
    const role = () => String(state.profile?.role || '').toLowerCase();
    const isManager = () => ['admin','staff'].includes(role());
    const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const cdaRenewalStatus = (a) => { if(!a?.cda_registration_expiry)return {text:'NOT SET',kind:'gray',days:null};const expiry=dateOnly(a.cda_registration_expiry),days=Math.ceil((new Date(expiry+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000),lead=Number(a.cda_renewal_lead_days)||60;return days<0?{text:'EXPIRED',kind:'red',days}:days<=lead?{text:'DUE SOON',kind:'amber',days}:{text:'CURRENT',kind:'green',days}; };
    const byId = (rows,id) => rows.find(r => String(r.id) === String(id));
    const formValue = (name) => new FormData($('entityForm')).get(name);
    const currentId = () => state.currentArbo?.id;
    const input = (name,label,value='',type='text',attrs='') => `<div class="field-group"><label for="f_${name}">${esc(label)}</label><input class="arbo-input" id="f_${name}" name="${esc(name)}" type="${esc(type)}" value="${esc(value ?? '')}" ${attrs}></div>`;
    const textarea = (name,label,value='') => `<div class="field-group full"><label for="f_${name}">${esc(label)}</label><textarea class="arbo-input" id="f_${name}" name="${esc(name)}" rows="3">${esc(value ?? '')}</textarea></div>`;
    const select = (name,label,options,value='',attrs='') => `<div class="field-group"><label for="f_${name}">${esc(label)}</label><select class="arbo-input" id="f_${name}" name="${esc(name)}" ${attrs}>${options.map(o=>{const pair=Array.isArray(o)?o:[o,o];return `<option value="${esc(pair[0])}"${String(pair[0])===String(value)?' selected':''}>${esc(pair[1])}</option>`;}).join('')}</select></div>`;

    function resolveClient() {
        const existing=window.secureDbClient||window.supabaseClient||window.dbClient;
        if (existing?.from && existing?.auth) return existing;
        const c=window.SUPABASE_CONFIG||window.supabaseConfig||window.APP_CONFIG||{};
        const url=c.url||c.supabaseUrl||window.SUPABASE_URL||'https://xnwttnpfzcjbszwxsgox.supabase.co';
        const key=c.publishableKey||c.anonKey||c.supabaseAnonKey||window.SUPABASE_ANON_KEY||'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
        return window.supabase?.createClient ? window.supabase.createClient(url,key) : null;
    }

    async function buildNavbar(userProfile, authData) {
        const navEl=$('mainNav'); if(!navEl) return;
        const {data:navItems}=await state.db.from('system_navigation').select('*').order('id',{ascending:true});
        const curPath=window.location.pathname;
        const links=navItems?.length?navItems:[
            {label:'Dashboard',url:'/dashboard.html',icon:'📊'},{label:'ARBO Management',url:'/arbo.html',icon:'🏢'},
            {label:'ARB Management',url:'/arb.html',icon:'👤'},{label:'Validators',url:'/validators.html',icon:'✅'},{label:'Reports',url:'/reports.html',icon:'📈'}
        ];
        const unique=[]; const seen=new Set(); for(const item of links){if(!seen.has(item.label)){seen.add(item.label);unique.push(item);}}
        let html=unique.map(l=>{const target=(l.url||'').replace('/','');const active=curPath.includes(target)&&target?'active':'';return `<a href="${esc(l.url)}" class="${active}">${esc(l.icon||'')} ${esc(l.label)}</a>`;}).join('');
        const display=userProfile?.full_name?.trim()||authData.user.email;
        html+=`<span class="user-badge" style="margin-left:auto;color:#0a3d62;font-weight:600;">👤 ${esc(display)} (${esc(userProfile?.role)})</span><span id="navLogoutBtn" style="color:#b91c1c;font-weight:600;margin-left:10px;cursor:pointer;">🚪 Logout</span>`;
        navEl.innerHTML=html; $('navLogoutBtn')?.addEventListener('click',async()=>{await state.db.auth.signOut();location.href='login.html';});
    }

    function showSetupWarning(message) { const el=$('setupWarning'); el.innerHTML=`<strong>Database setup required:</strong> ${esc(message)} Run <code>ARBO_Cooperative_Management_Schema.sql</code> once in Supabase SQL Editor.`; el.style.display='block'; }
    function openModal(title,type,id='') { $('entityModalTitle').textContent=title; $('entityType').value=type; $('entityId').value=id||''; $('entityModal').classList.add('active'); }
    function closeModal() { $('entityModal').classList.remove('active'); $('entityForm').reset(); $('entityFormBody').innerHTML=''; $('saveEntity').textContent='💾 Save'; state.selectedMemberCandidate=null; state.selectedValidator=null; state.selectedLinkedMember=null; state.selectedBulkMembers=new Map(); clearTimeout(state.arbSearchTimer); }
    function recordAudit(payload,isNew) { payload.updated_at=new Date().toISOString(); payload.updated_by=state.user.id; if(isNew) payload.created_by=state.user.id; return payload; }

    async function loadArbos() {
        const tbody=$('arboTableBody'); tbody.innerHTML='<tr><td colspan="8" class="empty-panel">Loading accessible ARBOs…</td></tr>';
        const from=state.arboPage*PAGE_SIZE, to=from+PAGE_SIZE-1;
        try {
            let q=state.db.from('arbo').select('*',{count:'exact'}).order('name',{ascending:true}).range(from,to);
            const name=$('searchArbo').value.trim(), muni=$('searchMunicipality').value.trim(), brgy=$('searchBarangay').value.trim(), status=$('searchStatus').value;
            if(name) q=q.ilike('name','%'+name.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(muni) q=q.ilike('municipality','%'+muni.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(brgy) q=q.ilike('barangay','%'+brgy.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(status) q=q.eq('status',status);
            const r=await q; if(r.error) throw r.error; state.arboCount=r.count||0;
            if(!r.data?.length){tbody.innerHTML='<tr><td colspan="8" class="empty-panel">No accessible ARBO matched the filters.</td></tr>';}
            else tbody.innerHTML=r.data.map(a=>{const renewal=cdaRenewalStatus(a);return `<tr class="${renewal.text==='EXPIRED'?'overdue-row':renewal.text==='DUE SOON'?'due-row':''}"><td>${val(a.id)}</td><td><strong style="color:#0a3d62;">${val(a.name)}</strong><br><small>${val(a.cda_registration_no||a.registration_no)}</small></td><td>${val(a.municipality)}</td><td>${val(a.barangay)}</td><td>${val(a.contact_number)}</td><td>${badge(renewal.text,renewal.kind)}<br><small>${formatDate(a.cda_registration_expiry)}${renewal.days===null?'':` · ${renewal.days} day(s)`}</small></td><td>${badge(a.status||'ACTIVE',(a.status||'ACTIVE')==='ACTIVE'?'green':'gray')}</td><td><button class="btn btn-info btn-sm" type="button" data-open-arbo="${esc(a.id)}">Open</button></td></tr>`;}).join('');
            $('arboPageInfo').textContent=`Page ${state.arboPage+1} of ${Math.max(1,Math.ceil(state.arboCount/PAGE_SIZE))} · ${state.arboCount} ARBO(s)`;
            $('previousArboPage').disabled=state.arboPage===0; $('nextArboPage').disabled=to+1>=state.arboCount;
        } catch(e) { tbody.innerHTML=`<tr><td colspan="8" class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</td></tr>`; }
    }

    async function safeArboQuery(table,orderColumn) {
        const rows=[]; const chunkSize=1000; let from=0;
        while(true){
            let q=state.db.from(table).select('*').eq('arbo_id',currentId()).range(from,from+chunkSize-1);
            if(orderColumn)q=q.order(orderColumn,{ascending:false});
            const r=await q;if(r.error)throw r.error;rows.push(...(r.data||[]));
            if(!r.data||r.data.length<chunkSize)break;from+=chunkSize;
        }
        return rows;
    }

    async function openArbo(id) {
        $('cooperativeWorkspace').style.display='block'; $('workspaceBody').innerHTML='<div class="empty-panel">Loading cooperative records…</div>';
        try {
            const ar=await state.db.from('arbo').select('*').eq('id',id).single(); if(ar.error) throw ar.error; state.currentArbo=ar.data;
            const loaders=[
                ['members','arbo_members','date_from'],['officers','arbo_officer_terms','date_assumed'],['machinery','arbo_machinery','created_at'],
                ['services','arbo_machinery_services','scheduled_date'],['income','arbo_income','date'],['expenses','arbo_expenses','expense_date'],
                ['capital','arbo_capital_transactions','transaction_date'],['activities','arbo_activities','training_date'],['validators','arbo_validators','assigned_from'],
                ['accounts','arbo_accounts','account_code'],['vouchers','arbo_vouchers','voucher_date'],['journals','arbo_journal_entries','entry_date'],['journalLines','arbo_journal_lines','created_at']
            ];
            const results=await Promise.all(loaders.map(async([key,table,order])=>{try{return [key,await safeArboQuery(table,order),null];}catch(e){return [key,[],e];}}));
            const missing=[]; for(const [key,rows,error] of results){state.data[key]=rows;if(error)missing.push(`${key}: ${error.message}`);}

    function signedCapital(tx) { return String(tx.transaction_type).toUpperCase()==='REFUND' ? -(Number(tx.amount)||0) : Number(tx.amount)||0; }
    function isDue(date) { if(!date) return false; const days=(new Date(dateOnly(date)+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000; return days<=30; }
    function isOverdue(date) { return Boolean(date) && dateOnly(date)<today(); }
    function canEditCurrent() { return isManager() || state.data.validators.some(v=>v.validator_user_id===state.user.id && v.is_active && dateOnly(v.assigned_from)<=today() && (!v.assigned_until||dateOnly(v.assigned_until)>=today())); }
    function memberName(id) { return byId(state.data.members,id)?.arb_name || 'Unknown member'; }
    function machineryName(id) { return byId(state.data.machinery,id)?.equipment_name || '—'; }
    function activeMembers() { return state.data.members.filter(m=>(m.membership_status||'ACTIVE')==='ACTIVE' && !m.date_to); }

    const tabs=[['overview','Overview'],['members','Members'],['officers','Officers'],['machinery','Machinery'],['services','Maintenance & Repairs'],['income','Income & Rentals'],['expenses','Expenses'],['capital','Paid-up Capital'],['accounts','Accounts'],['vouchers','Vouchers'],['journal','Journal'],['activities','Activities'],['validators','Validators']];
    function renderWorkspace() {
        const a=state.currentArbo; $('workspaceTitle').textContent=a.name; $('workspaceSubtitle').textContent=[a.barangay,a.municipality,a.cda_registration_no||a.registration_no].filter(Boolean).join(' · ');
        $('editCurrentArbo').style.display=canEditCurrent()?'inline-flex':'none';
        const renewal=cdaRenewalStatus(a),renewalAlert=$('cdaRenewalAlert');renewalAlert.style.display=['EXPIRED','DUE SOON','NOT SET'].includes(renewal.text)?'block':'none';renewalAlert.innerHTML=renewal.text==='EXPIRED'?`<strong>CDA REGISTRATION EXPIRED:</strong> Expiry was ${formatDate(a.cda_registration_expiry)}. Assigned validators should initiate renewal follow-up.`:renewal.text==='DUE SOON'?`<strong>CDA RENEWAL REMINDER:</strong> Registration expires on ${formatDate(a.cda_registration_expiry)} (${renewal.days} day(s) remaining).`:`<strong>CDA MONITORING:</strong> Encode the CDA registration expiry date to activate renewal reminders.`;
        const activeOfficers=state.data.officers.filter(o=>(o.term_status||'ACTIVE')==='ACTIVE'&&!o.actual_end_date).length;
        const due=state.data.machinery.filter(m=>isDue(m.next_maintenance_date)).length;
        const gross=state.data.income.reduce((s,r)=>s+(Number(r.gross_income??r.amount)||0),0);
        const directExpenses=state.data.income.reduce((s,r)=>s+(Number(r.expenses)||0),0);
        const recordedExpenses=state.data.expenses.reduce((s,r)=>s+(Number(r.amount)||0),0);
        const totalExpenses=directExpenses+recordedExpenses;
        const net=gross-totalExpenses;
        const paid=state.data.capital.reduce((s,r)=>s+signedCapital(r),0);
        $('workspaceKpis').innerHTML=[['Active Members',activeMembers().length],['Active Officers',activeOfficers],['Machinery',state.data.machinery.length],['Maintenance Due',due],['CDA Renewal',renewal.text],['Gross Income',money(gross)],['Total Expenses',money(totalExpenses)],['Net Income',money(net)],['Paid-up Capital',money(paid)]].map(x=>`<div class="arbo-kpi"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('');
        $('workspaceTabs').innerHTML=tabs.map(([id,label])=>`<button class="workspace-tab${state.activeTab===id?' active':''}" data-tab="${id}" type="button">${esc(label)}</button>`).join('');
        renderActiveTab();
    }

    function heading(title,note,type,button='Add Record') { return `<div class="module-heading"><div><h3>${esc(title)}</h3><p class="module-note">${esc(note)}</p></div>${canEditCurrent()&&type?`<button class="btn btn-primary" type="button" data-add="${type}">➕ ${esc(button)}</button>`:''}</div>`; }
    function editButton(type,id) { return canEditCurrent()?`<button class="btn btn-warning btn-sm" type="button" data-edit="${type}" data-id="${esc(id)}">Edit</button>`:''; }
    function table(headers,rows,colspan) { return rows.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty-panel">No records yet.</div>`; }

    async function searchMemberDatabase() {
        const term=$('f_search_term').value.trim(),box=$('memberSearchResults');
        box.style.display='block';box.innerHTML='<div class="empty-panel">Searching ARB database…</div>';
        try { const r=await state.db.rpc('search_arbo_member_candidates',{p_arbo_id:currentId(),p_search_text:term,p_limit:100});if(r.error)throw r.error;state.lastMemberCandidates=r.data||[];box.innerHTML=r.data?.length?r.data.map(c=>{const selected=state.selectedBulkMembers.has(String(c.arb_profile_id));return `<label class="picker-row picker-check${selected?' is-selected':''}"><input type="checkbox" data-check-arb="${esc(c.arb_profile_id)}" ${selected?'checked':''} ${c.already_active?'disabled':''}><div><strong>${val(c.display_name)}</strong> ${badge('ARB','green')} ${c.already_active?badge('ALREADY A MEMBER','amber'):''}<small>ARB ID: ${val(c.arb_id)} · Sequence: ${val(c.sequence_no)} · ${val(c.municipalities)} · ${val(c.barangays)}</small><small>CLOA/Title: ${val(c.cloa_numbers)} · Claim: ${val(c.claim_numbers)} · Survey/Lot: ${val(c.survey_numbers)} / ${val(c.lot_numbers)}</small></div></label>`;}).join(''):'<div class="empty-panel">No ARB matched all search words. Try fewer words or a partial title, location, claim, survey, lot, sequence, or name.</div>'; }
        catch(e){box.innerHTML=`<div class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</div>`;}
    }
    function setBulkCandidate(profileId,checked) { const c=(state.lastMemberCandidates||[]).find(x=>String(x.arb_profile_id)===String(profileId));if(!c)return;if(checked)state.selectedBulkMembers.set(String(profileId),c);else state.selectedBulkMembers.delete(String(profileId));renderSelectedBulkMembers(); }

    function trialBalanceHtml(from,to) { const journals=state.data.journals.filter(j=>j.status==='POSTED'&&inReportRange(j.entry_date,from,to)),ids=new Set(journals.map(j=>String(j.id))),rows=state.data.accounts.map(a=>{const lines=state.data.journalLines.filter(l=>String(l.account_id)===String(a.id)&&ids.has(String(l.journal_entry_id))),debit=lines.reduce((s,l)=>s+(Number(l.debit)||0),0),credit=lines.reduce((s,l)=>s+(Number(l.credit)||0),0),balance=a.normal_balance==='CREDIT'?credit-debit:debit-credit;return [a.account_code,a.account_name,a.account_type,money(debit),money(credit),money(balance)];});const totalDebit=state.data.journalLines.filter(l=>ids.has(String(l.journal_entry_id))).reduce((s,l)=>s+(Number(l.debit)||0),0),totalCredit=state.data.journalLines.filter(l=>ids.has(String(l.journal_entry_id))).reduce((s,l)=>s+(Number(l.credit)||0),0);return reportTable(['Code','Account','Type','Debit','Credit','Normal Balance'],rows)+`<p style="text-align:right;"><strong>Total Debits: ${money(totalDebit)} &nbsp; Total Credits: ${money(totalCredit)}</strong></p>`; }
    function buildReportHtml(type,from,to) { const a=state.currentArbo,capital=state.data.capital.filter(c=>inReportRange(c.transaction_date,from,to)),vouchers=state.data.vouchers.filter(v=>inReportRange(v.voucher_date,from,to)),journals=state.data.journals.filter(j=>inReportRange(j.entry_date,from,to));const profile=`<div class="profile-summary-grid"><div class="profile-summary-card"><h4>Organization</h4><div class="summary-field"><span>Name</span><strong>${val(a.name)}</strong></div><div class="summary-field"><span>CDA Number</span><strong>${val(a.cda_registration_no)}</strong></div><div class="summary-field"><span>Registration</span><strong>${formatDate(a.date_registered)}</strong></div><div class="summary-field"><span>Last Renewal</span><strong>${formatDate(a.cda_last_renewal_date)}</strong></div><div class="summary-field"><span>Expiry</span><strong>${formatDate(a.cda_registration_expiry)} ${val(cdaRenewalStatus(a).text)}</strong></div></div><div class="profile-summary-card"><h4>Location and Contact</h4><div class="summary-field"><span>Address</span><strong>${val(a.address)}</strong></div><div class="summary-field"><span>Barangay</span><strong>${val(a.barangay)}</strong></div><div class="summary-field"><span>Municipality</span><strong>${val(a.municipality)}</strong></div><div class="summary-field"><span>Contact</span><strong>${val(a.contact_number)}</strong></div><div class="summary-field"><span>Email</span><strong>${val(a.email)}</strong></div></div></div>`;const members=reportTable(['Member','Type','Membership No.','Member Since','Contact','Municipality / Barangay','Status'],state.data.members.map(m=>[m.arb_name,m.is_arb?'ARB':'NON-ARB',m.membership_no,formatDate(m.date_from),[m.contact_number,m.email].filter(Boolean).join(' / '),[m.municipality,m.barangay].filter(Boolean).join(', '),m.membership_status]));const officers=reportTable(['Officer','Type','Position','Assumed','Expected End','Actual End','Contact','Status'],state.data.officers.map(o=>{const m=byId(state.data.members,o.membership_id)||{};return [m.arb_name,m.is_arb?'ARB':'NON-ARB',o.position,formatDate(o.date_assumed),formatDate(o.term_end_date),formatDate(o.actual_end_date),o.contact_number||m.contact_number,o.term_status];}));const machinery=reportTable(['Machinery','Code','Award Date','Condition','Operating Status','Next Maintenance','Repair'],state.data.machinery.map(m=>[m.equipment_name,m.machinery_code,formatDate(m.date_release),m.condition_status||m.status,m.operating_status||m.status,formatDate(m.next_maintenance_date),m.repair_status]));const capitalHtml=reportTable(['Date','Member','Type','Amount','OR','Reference'],capital.map(c=>[formatDate(c.transaction_date),memberName(c.membership_id),c.transaction_type,money(c.amount),c.official_receipt_no,c.reference_no]));const voucherHtml=reportTable(['Date','Voucher','Type','Payee','Particulars','Amount','Status'],vouchers.map(v=>[formatDate(v.voucher_date),v.voucher_no,v.voucher_type,v.payee,v.particulars,money(v.amount),v.status]));const journalHtml=reportTable(['Date','Reference','Description','Source','Debits','Credits','Status'],journals.map(j=>{const lines=state.data.journalLines.filter(l=>String(l.journal_entry_id)===String(j.id));return [formatDate(j.entry_date),j.reference_no,j.description,j.source_type,money(lines.reduce((s,l)=>s+(Number(l.debit)||0),0)),money(lines.reduce((s,l)=>s+(Number(l.credit)||0),0)),j.status];}));const selected={PROFILE:profile,MEMBERS:members,OFFICERS:officers,MACHINERY:machinery,FINANCIAL:financialReportHtml(from,to),CAPITAL:capitalHtml,VOUCHERS:voucherHtml,JOURNAL:journalHtml,TRIAL_BALANCE:trialBalanceHtml(from,to),CDA:reportTable(['ARBO','CDA Number','Last Renewal','Expiry','Days Remaining','Status'],[[a.name,a.cda_registration_no,formatDate(a.cda_last_renewal_date),formatDate(a.cda_registration_expiry),cdaRenewalStatus(a).days,cdaRenewalStatus(a).text]])};if(type!=='FULL')return selected[type]||profile;return reportSection('ARBO Profile and CDA Compliance',profile)+reportSection('Membership Registry',members)+reportSection('Officers and Terms',officers)+reportSection('Machinery and Maintenance',machinery)+reportSection('Income and Expense Statement',financialReportHtml(from,to))+reportSection('Paid-up Capital',capitalHtml)+reportSection('Voucher Register',voucherHtml)+reportSection('Trial Balance',trialBalanceHtml(from,to)); }
    function printDocument(title,html,subtitle='') { $('printHeading').textContent=title;$('printSubheading').textContent=subtitle||[state.currentArbo?.name,'Generated '+new Date().toLocaleString('en-PH')].filter(Boolean).join(' · ');$('printBody').innerHTML=html;closeModal();setTimeout(()=>window.print(),50); }
    function generateSelectedReport() { const type=formValue('report_type'),from=formValue('report_date_from'),to=formValue('report_date_to');printDocument($('f_report_type').selectedOptions[0].textContent,buildReportHtml(type,from,to),[state.currentArbo.name,from&&`From ${formatDate(from)}`,to&&`To ${formatDate(to)}`].filter(Boolean).join(' · ')); }
    function voucherPaper(v,type) { const a=state.currentArbo;return `<div class="voucher-paper"><h2>${val(a.name)}</h2><p style="text-align:center;margin:2px;">${val([a.address,a.barangay,a.municipality].filter(Boolean).join(', '))}</p><h3>${val(type||v.voucher_type)}</h3><div class="voucher-grid"><div><label>Voucher Number</label><strong>${val(v.voucher_no)}</strong></div><div><label>Date</label><strong>${formatDate(v.voucher_date)}</strong></div><div><label>Payee / Recipient</label><strong>${val(v.payee)}</strong></div><div><label>Due Date</label><strong>${formatDate(v.due_date)}</strong></div><div style="grid-column:1/-1;border-right:0;"><label>Particulars</label><strong>${val(v.particulars)}</strong></div><div><label>Debit Account</label><strong>${val(accountName(v.debit_account_id))}</strong></div><div><label>Credit Account</label><strong>${val(accountName(v.credit_account_id))}</strong></div><div><label>Payment Method / Check</label><strong>${val([v.payment_method,v.check_no,v.bank_reference].filter(Boolean).join(' / '))}</strong></div><div><label>Amount</label><strong>${blank(v.amount)?'________________':money(v.amount)}</strong></div><div style="grid-column:1/-1;border-right:0;"><label>Supporting Documents</label><strong>${val(v.supporting_documents)}</strong></div></div><div class="voucher-signatures"><div>Prepared by<br><strong>${val(v.prepared_by)}</strong></div><div>Approved by<br><strong>${val(v.approved_by)}</strong></div><div>Received by<br><strong>${val(v.received_by)}</strong></div></div></div>`; }
    function printVoucher(id) { const v=byId(state.data.vouchers,id);if(v)printDocument(`${v.voucher_type} — ${v.voucher_no}`,voucherPaper(v),state.currentArbo.name); }
    function printBlankAccountingForm(type) { if(type==='EXPENSE RECORDING FORM'||type==='COLLECTION RECEIPT FORM'){const label=type==='EXPENSE RECORDING FORM'?'Expense':'Collection / Income';const html=`<div class="voucher-paper"><h2>${val(state.currentArbo.name)}</h2><h3>${val(type)}</h3><div class="voucher-grid"><div><label>Date</label>________________________</div><div><label>Reference Number</label>________________________</div><div><label>${label==='Expense'?'Payee':'Received From'}</label>________________________</div><div><label>Amount</label>₱ _______________________</div><div style="grid-column:1/-1;border-right:0;min-height:90px;"><label>Description / Particulars</label></div><div><label>Account</label>________________________</div><div><label>Payment Method</label>________________________</div><div><label>Official Receipt / Voucher</label>________________________</div><div><label>Status</label>________________________</div></div><div class="voucher-signatures"><div>Prepared by</div><div>Approved by</div><div>Received by</div></div></div>`;printDocument(type,html,state.currentArbo.name);return;}printDocument(type,voucherPaper({voucher_type:type},type),state.currentArbo.name); }
    function printCurrent() { const a=state.currentArbo;$('printHeading').textContent='ARBO Cooperative Management Report — '+a.name;$('printSubheading').textContent=[a.barangay,a.municipality,'Generated '+new Date().toLocaleString('en-PH')].filter(Boolean).join(' · ');$('printBody').innerHTML=$('workspaceKpis').outerHTML+$('workspaceBody').innerHTML;window.print(); }

    document.addEventListener('click',e=>{
        const open=e.target.closest('[data-open-arbo]'); if(open)openArbo(open.dataset.openArbo);
        const tab=e.target.closest('[data-tab]'); if(tab){state.activeTab=tab.dataset.tab;renderWorkspace();}
        const add=e.target.closest('[data-add]'); if(add)openForm(add.dataset.add);
        const edit=e.target.closest('[data-edit]'); if(edit)openForm(edit.dataset.edit,edit.dataset.id);
        const service=e.target.closest('[data-add-service]'); if(service)openForm('service','',{machinery_id:service.dataset.addService});
        const removeBulk=e.target.closest('[data-remove-bulk]'); if(removeBulk){state.selectedBulkMembers.delete(String(removeBulk.dataset.removeBulk));renderSelectedBulkMembers();}
        const linked=e.target.closest('[data-select-linked-member]'); if(linked)selectLinkedMember(linked.dataset.selectLinkedMember);
        const validator=e.target.closest('[data-select-validator]'); if(validator)selectValidator(validator.dataset.selectValidator);
        const memberFilter=e.target.closest('[data-member-filter]');if(memberFilter){state.memberSearch=$('memberListSearch')?.value||'';state.memberPage=0;renderActiveTab();}
        const memberPage=e.target.closest('[data-member-page]');if(memberPage){state.memberPage=Math.max(0,state.memberPage+(memberPage.dataset.memberPage==='next'?1:-1));renderActiveTab();}
        const voucher=e.target.closest('[data-print-voucher]');if(voucher)printVoucher(voucher.dataset.printVoucher);
        const blankForm=e.target.closest('[data-print-blank-form]');if(blankForm)printBlankAccountingForm(formValue('blank_form_type'));
    });
    document.addEventListener('change',e=>{if(e.target.matches('[data-check-arb]'))setBulkCandidate(e.target.dataset.checkArb,e.target.checked);if(e.target.matches('[data-bulk-field]'))rememberBulkField(e.target);});
    document.addEventListener('input',e=>{if(e.target.matches('[data-bulk-field]'))rememberBulkField(e.target);});
    document.addEventListener('keydown',e=>{if(e.target.id==='memberListSearch'&&e.key==='Enter'){e.preventDefault();state.memberSearch=e.target.value;state.memberPage=0;renderActiveTab();}});
    $('applyArboSearch').addEventListener('click',()=>{state.arboPage=0;loadArbos();});
    ['searchArbo','searchMunicipality','searchBarangay'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){state.arboPage=0;loadArbos();}}));
    $('previousArboPage').addEventListener('click',()=>{state.arboPage=Math.max(0,state.arboPage-1);loadArbos();});
    $('nextArboPage').addEventListener('click',()=>{state.arboPage++;loadArbos();});
    $('addArboBtn').addEventListener('click',()=>openForm('arbo'));
    $('editCurrentArbo').addEventListener('click',()=>openForm('arbo',currentId(),state.currentArbo));
    $('openReportCenter').addEventListener('click',openReportCenter);
    $('printCurrentArbo').addEventListener('click',printCurrent);
    $('closeWorkspace').addEventListener('click',()=>{$('cooperativeWorkspace').style.display='none';state.currentArbo=null;});
    $('closeEntityModal').addEventListener('click',closeModal); $('cancelEntity').addEventListener('click',closeModal); $('entityForm').addEventListener('submit',saveEntity);
    $('entityModal').addEventListener('click',e=>{if(e.target===$('entityModal'))closeModal();});

    try {
        state.db=resolveClient(); if(!state.db)throw new Error('Supabase client configuration was not found.');
        const auth=await state.db.auth.getUser(); if(auth.error||!auth.data?.user){location.href='login.html';return;} state.user=auth.data.user;
        const p=await state.db.from('profiles').select('*').eq('id',state.user.id).single(); if(p.error)throw p.error; state.profile=p.data;
        await buildNavbar(state.profile,auth.data); $('addArboBtn').style.display=isManager()?'inline-flex':'none'; await loadArbos();
    } catch(e) { $('arboTableBody').innerHTML=`<tr><td colspan="8" class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</td></tr>`; }
})();
</script>
