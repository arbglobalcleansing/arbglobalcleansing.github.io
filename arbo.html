<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Cooperative Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        :root{--navy:#0a3d62;--green:#066b4f;--blue:#1769a0;--amber:#b45309;--red:#b91c1c;--line:#dbe3ea;--soft:#f8fafc;--text:#1e293b;--muted:#64748b}
        *{box-sizing:border-box}
        #setupWarning{display:none}
        .monitor-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:18px 0}
        .monitor-kpi{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 3px 10px rgba(15,23,42,.04)}
        .monitor-kpi span{display:block;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.035em}
        .monitor-kpi strong{display:block;margin-top:5px;color:var(--navy);font-size:1.35rem}
        .filter-grid{display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(6,minmax(130px,.7fr)) auto;gap:10px;align-items:end;margin-bottom:15px}
        .field label,.filter-grid label{display:block;margin-bottom:5px;color:#475569;font-size:.76rem;font-weight:700;text-transform:uppercase}
        .control{width:100%;min-height:42px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#0f172a;font:inherit}
        textarea.control{min-height:86px;resize:vertical}
        .control:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,160,.1)}
        .table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
        .monitor-table{width:100%;min-width:1050px;border-collapse:collapse}
        .monitor-table th,.monitor-table td{padding:10px;border-bottom:1px solid #e8edf2;text-align:left;vertical-align:top}
        .monitor-table th{background:#f8fafc;color:#475569;font-size:.76rem;text-transform:uppercase;letter-spacing:.025em;white-space:nowrap}
        .monitor-table tbody tr:last-child td{border-bottom:0}
        .monitor-table tbody tr:hover{background:#fbfdff}
        .arbo-name{color:#003f70;font-weight:normal;text-transform:uppercase;line-height:1.35}
        .money{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right!important}
        .status{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:.68rem;font-weight:800;white-space:nowrap}
        .status-green{background:#dcfce7;color:#166534}.status-blue{background:#dbeafe;color:#1e40af}.status-amber{background:#fef3c7;color:#92400e}.status-red{background:#fee2e2;color:#991b1b}.status-gray{background:#e2e8f0;color:#475569}
        .small-note{display:block;margin-top:3px;color:var(--muted);font-size:.75rem}
        .empty{padding:28px!important;color:var(--muted);text-align:center!important}
        .page-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-weight:700}
        .workspace{display:none;margin-top:24px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.08)}
        .workspace-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fff,#f2f8fc)}
        .workspace-header h2{margin:0 0 5px;color:var(--navy)}
        .workspace-header p{margin:0;color:var(--muted)}
        .module-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px}
        .module-heading h2,.module-heading h3{margin:0;color:var(--navy)}
        .module-actions,.actions{display:flex;flex-wrap:wrap;gap:8px}
        .tabs{display:flex;gap:4px;overflow:auto;padding:8px 10px 0;border-bottom:1px solid var(--line);background:#f8fafc}
        .tab{flex:0 0 auto;padding:10px 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:#475569;font-weight:700;cursor:pointer}
        .tab.active{border-bottom-color:var(--blue);background:#fff;color:var(--navy)}
        .workspace-body{min-height:280px;padding:18px}
        .section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:13px}
        .section-heading h3{margin:0;color:var(--navy)}
        .section-heading p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
        .card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .info-card{padding:15px;border:1px solid var(--line);border-radius:9px;background:#f8fafc}
        .info-card h4{margin:0 0 10px;color:var(--navy)}
        .info-row{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed #dbe3ea}
        .info-row:last-child{border-bottom:0}.info-row span{color:var(--muted);font-size:.78rem}.info-row strong{overflow-wrap:anywhere;font-size:.84rem}
        .pillar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
        .pillar-card{padding:14px;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:9px;background:#fff}
        .pillar-card:nth-child(2){border-top-color:#0891b2}.pillar-card:nth-child(3){border-top-color:#7c3aed}.pillar-card:nth-child(4){border-top-color:#b45309}
        .pillar-card h4{min-height:38px;margin:0 0 8px;color:var(--navy);font-size:.86rem}
        .pillar-card strong{font-size:1.4rem;color:var(--text)}
        .progress-track{width:120px;height:8px;overflow:hidden;border-radius:999px;background:#e2e8f0}
        .progress-track span{display:block;height:100%;background:var(--green)}
        .two-column{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .panel{padding:14px;border:1px solid var(--line);border-radius:9px;background:#fff}
        .panel h4{margin:0 0 10px;color:var(--navy)}
        .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .field.full{grid-column:1/-1}.field.span2{grid-column:span 2}
        .help{display:block;margin-top:4px;color:var(--muted);font-size:.72rem}
        .monitor-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.58)}
        .monitor-modal.active{display:flex}
        .monitor-window{width:min(900px,94vw);height:min(760px,calc(100vh - 32px));display:flex;flex-direction:column;overflow:hidden;border-radius:10px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.35)}
        .monitor-modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff;color:var(--navy)}
        .monitor-modal-header h2{margin:0;font-size:1.2rem}
        .close-button{width:34px;height:30px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:#334155;font-size:1.35rem;cursor:pointer}
        .close-button:hover{border-color:#b91c1c;background:#b91c1c;color:#fff}
        #monitorForm{display:flex;min-height:0;flex:1;flex-direction:column}
        .monitor-modal-body{flex:1;overflow:auto;padding:18px 20px;background:#f8fafc}
        .modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--line);background:#fff}
        .access-note{margin:0 0 15px;padding:10px 12px;border-left:4px solid var(--blue);border-radius:6px;background:#eff6ff;color:#1e3a5f}
        .warning-note{border-left-color:var(--amber);background:#fffbeb;color:#78350f}
        .danger-note,.error-note{border-left-color:var(--red);background:#fff1f2;color:#881337}
        .profile-link{margin-left:auto;color:var(--navy);font-weight:700;cursor:pointer}
        .logout-link{color:#b91c1c;font-weight:700;cursor:pointer}
        .nav-symbol{display:inline-grid;width:24px;height:24px;margin-right:5px;place-items:center;border-radius:6px;background:#eef4f8;color:var(--navy);font-size:.7rem;font-weight:900}
        .report-section{margin-top:18px}
        .report-section h2{margin:0 0 8px;color:#0a3d62;font-size:1rem;break-after:avoid}
        #reportPrintArea>h1{margin:0;color:#0a3d62;font-size:1.35rem;text-align:center}
        #reportPrintArea>p{margin:5px 0 14px;color:#475569;text-align:center}
        .report-window{width:min(1500px,98vw);height:calc(100vh - 24px)}
        .report-preview{min-width:900px;padding:18px;background:#fff}
        .report-preview>h1{margin:0;color:#0a3d62;font-size:1.3rem;text-align:center}.report-preview>p{margin:5px 0 14px;color:#475569;text-align:center}
        .report-controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.report-controls .field{min-width:180px}.report-controls .field label{margin-bottom:3px}
        .picker-results{max-height:400px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:7px;background:#fff;}
        .picker-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e8edf2;transition:background 0.2s;cursor:pointer;border-left:4px solid transparent;}
        .picker-row:hover:not([data-disabled="true"]){background:#f8fafc;}
        .picker-row:last-child{border-bottom:0;}
        .picker-row small{display:block;margin-top:3px;color:var(--muted);}
        .selected-person{margin-top:10px;padding:10px;border:1px solid #86efac;border-radius:7px;background:#f0fdf4;color:#166534;}
        .picker-row.is-selected{background:#f0fdf4 !important;border-left-color:#166534;}
        .picker-check{display:flex;align-items:center;gap:10px;min-width:0;pointer-events:none;}
        .picker-check input{width:18px;height:18px;flex:0 0 auto;pointer-events:none;}
        .selected-bulk{margin-top:14px;border:1px solid #86efac;border-radius:8px;overflow:auto;}
        .selected-bulk h4{margin:0;padding:10px 12px;color:#166534;background:#f0fdf4;}
        .selected-bulk table{width:100%;min-width:750px;border-collapse:collapse;}
        .selected-bulk th,.selected-bulk table td{padding:8px;border-top:1px solid #dcfce7;text-align:left;vertical-align:middle;}
        .selected-bulk th{color:#166534;background:#f7fee7;font-size:.72rem;text-transform:uppercase;}
        .compact-input{min-width:115px;padding:7px 8px;border:1px solid #cbd5e1;border-radius:4px;font:inherit;width:100%;box-sizing:border-box;}
        .picker-inner-grid { display:grid; grid-template-columns: 1.5fr 1.25fr 1.25fr; gap:10px; pointer-events:none; flex:1; align-items:center; }
        @media(max-width:1200px){.filter-grid{grid-template-columns:repeat(3,1fr)}.monitor-kpis{grid-template-columns:repeat(3,1fr)}.pillar-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:760px){.workspace-header{flex-direction:column}.filter-grid,.monitor-kpis,.card-grid,.two-column,.form-grid,.pillar-grid{grid-template-columns:1fr}.field.span2,.field.full{grid-column:auto}.monitor-window{width:calc(100vw - 16px);height:calc(100vh - 16px)}.picker-inner-grid { grid-template-columns: 1fr; gap: 4px; }}
        @media print{
            @page{size:A4 landscape;margin:8mm}
            body{background:#fff!important}.container>h1,.nav,#setupWarning,.workspace-header .actions,.tabs,button{display:none!important}
            .container{max-width:none!important;margin:0!important;padding:0!important}.workspace{margin:0;border:0;box-shadow:none}.workspace-header{padding:0 0 10px;background:#fff}.workspace-body{padding:10px 0}.monitor-table{min-width:0;font-size:8pt}.monitor-table th,.monitor-table td{padding:4px}.card-grid,.pillar-grid{grid-template-columns:repeat(4,1fr)}
            body.print-master .section{display:block!important}body.print-master .workspace{display:none!important}body.print-master .filter-grid,.page-controls{display:none!important}
            body.print-workspace .section{display:none!important}body.print-workspace .workspace{display:block!important}
            body.print-report .container,body.print-report .monitor-modal{display:none!important}body.print-report #reportPrintArea{display:block!important}
            body.print-report #reportPrintArea .monitor-table{width:100%;min-width:0;font-size:7.5pt}
            body.print-report #reportPrintArea .monitor-table th,body.print-report #reportPrintArea .monitor-table td{padding:4px}
            body.print-report #reportPrintArea thead{display:table-header-group}body.print-report #reportPrintArea tr{break-inside:avoid}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>&#127963;&#65039; ARB Global Cleansing <small>ARBO Management</small></h1>
    <nav class="nav" id="mainNav"></nav>

    <div id="setupWarning" class="access-note error-note"></div>

    <section class="section" id="arboListSection">
        <div class="module-heading">
            <div><h2>ARBO Management</h2></div>
            <div class="module-actions"><button class="btn btn-info" id="summaryReport" type="button" style="display:none">ARBO Summary Report</button></div>
        </div>
        <div class="monitor-kpis" id="masterKpis"></div>

        <div class="filter-grid">
            <div><label for="searchText">Fast search</label><input class="control" id="searchText" placeholder="ARBO, ID, place, ARC or project"></div>
            <div><label for="municipalityFilter">Municipality</label><select class="control" id="municipalityFilter"><option value="">All</option></select></div>
            <div><label for="barangayFilter">Barangay</label><select class="control" id="barangayFilter"><option value="">All</option></select></div>
            <div><label for="unitFilter">PBDD Unit</label><select class="control" id="unitFilter"><option value="">All</option><option>SIB</option><option>CRFPS</option><option>EDES</option></select></div>
            <div><label for="pillarFilter">Pillar</label><select class="control" id="pillarFilter"><option value="">All</option><option>EDES</option><option>CRFPS</option><option>SIB</option><option>SUPERVISION AND MANAGEMENT</option></select></div>
            <div><label for="projectStatusFilter">Project status</label><select class="control" id="projectStatusFilter"><option value="">All</option><option>PROPOSED</option><option>PROFILED</option><option>FOR VALIDATION</option><option>APPROVED</option><option>ONGOING</option><option>ON HOLD</option><option>COMPLETED</option><option>CANCELLED</option></select></div>
            <div><label for="monitoringFilter">Monitoring</label><select class="control" id="monitoringFilter"><option value="">All</option><option value="OVERDUE">Overdue</option><option value="DUE_30">Due in 30 Days</option><option value="NO_PROJECT">No Project</option><option value="NO_TRAINING">No Training Record</option><option value="NO_INCOME">No Current-Month Income</option></select></div>
            <button class="btn btn-primary" id="clearFilters" type="button">Clear</button>
        </div>

        <div class="table-wrap">
            <table class="monitor-table">
                <thead><tr><th>ARBO ID</th><th>ARBO Name</th><th>Municipality</th><th>Barangay</th><th>ARC Status</th><th>Active Projects</th><th>Latest Monthly Income</th><th>Action</th></tr></thead>
                <tbody id="arboRows"><tr><td colspan="8" class="empty">Loading accessible ARBOs...</td></tr></tbody>
            </table>
        </div>
        <div class="page-controls"><button class="btn btn-primary" id="previousPage" type="button">Previous</button><span id="pageInfo">Page 1</span><button class="btn btn-primary" id="nextPage" type="button">Next</button></div>
    </section>

    <section class="workspace" id="workspace">
        <header class="workspace-header">
            <div><h2 id="workspaceTitle">ARBO</h2><p id="workspaceSubtitle"></p></div>
            <div class="actions"><button class="btn btn-warning" id="editArboProfile" type="button">Edit ARBO</button><button class="btn btn-info" id="openArboReport" type="button">ARBO Report</button><button class="btn btn-danger" id="closeWorkspace" type="button">⬅ Close & Return to List</button></div>
        </header>
        <div class="monitor-kpis" id="workspaceKpis" style="padding:16px 18px 0;margin-bottom:0"></div>
        <nav class="tabs" id="workspaceTabs"></nav>
        <div class="workspace-body" id="workspaceBody"></div>
    </section>
</div>

<div class="monitor-modal" id="monitorModal" role="dialog" aria-modal="true" aria-labelledby="monitorModalTitle">
    <div class="monitor-window">
        <header class="monitor-modal-header"><h2 id="monitorModalTitle">Record</h2><button class="close-button" id="closeModal" type="button" aria-label="Close">&times;</button></header>
        <form id="monitorForm">
            <input type="hidden" id="recordType"><input type="hidden" id="recordId">
            <div class="monitor-modal-body" id="monitorModalBody"></div>
            <footer class="modal-actions"><button class="btn btn-secondary" id="cancelModal" type="button">Cancel</button><button class="btn btn-success" id="saveModal" type="submit">Save</button></footer>
        </form>
    </div>
</div>

<div class="monitor-modal" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="reportPreviewTitle">
    <div class="monitor-window report-window">
        <header class="monitor-modal-header"><h2 id="reportPreviewTitle">Report Table View</h2><button class="close-button" id="closeReportPreview" type="button" aria-label="Close">&times;</button></header>
        <div class="monitor-modal-body"><div class="table-wrap"><div class="report-preview" id="reportPreview"></div></div></div>
        <footer class="modal-actions report-controls">
            <div class="field"><label for="reportPaperSize">Paper Size</label><select class="control" id="reportPaperSize"><option value="A4">A4 (210 × 297 mm)</option><option value="FOLIO">8.5 × 13 inches</option></select></div>
            <div class="field"><label for="reportOrientation">Orientation</label><select class="control" id="reportOrientation"><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></div>
            <button class="btn btn-secondary" id="cancelReportPreview" type="button">Close</button><button class="btn btn-success" id="printReportPreview" type="button">Print Report</button>
        </footer>
    </div>
</div>

<section id="reportPrintArea" style="display:none">
    <h1 id="reportTitle"></h1>
    <p id="reportSubtitle"></p>
    <div id="reportBody"></div>
</section>
<style id="dynamicPrintStyle"></style>

<script>
(async function(){
    'use strict';
    const PAGE_SIZE=40;
    const PBDD_UNITS=['SIB','CRFPS','EDES'];
    const PROJECT_STATUSES=['PROPOSED','PROFILED','FOR VALIDATION','APPROVED','ONGOING','ON HOLD','COMPLETED','CANCELLED'];
    const PILLAR_COMPONENTS={
        EDES:['VLFED','MICROFINANCE AND CREDIT ACCESS','PAHP','AGRARYO MERKADO','PBD LAWYERING','OTHER EDES SUPPORT'],
        CRFPS:['FARM MECHANIZATION AND INPUT PROVISION','AGRICULTURAL INSURANCE PROGRAM (ARB-AIP)','CLIMATE-RESILIENT FARM SUPPORT','OTHER CRFPS SUPPORT'],
        SIB:['CAPACITY DEVELOPMENT','ARBO CARAVAN','ORGANIZATIONAL DEVELOPMENT','OTHER SIB SUPPORT'],
        'SUPERVISION AND MANAGEMENT':['MONITORING AND EVALUATION','SEMESTER REVIEW AND PLANNING','INCLUSIVE DEVELOPMENT','OTHER SUPERVISION SUPPORT']
    };
    const PROJECT_TABS=[['overview','Overview'],['profile','ARBO Profile'],['members','Members'],['projects','PBDD Projects'],['monitoring','Monitoring Updates'],['training','Trainings'],['machinery','Machinery'],['products','Products and Sales'],['merkado','Agraryo Merkado'],['loans','Loan Monitoring'],['income','Monthly Income']];
    const LIMITED_TABS=[['profile','ARBO Profile']];
    const TRAINING_TYPES=['ORGANIZATIONAL MANAGEMENT','FINANCIAL MANAGEMENT','BOOKKEEPING','PARLIAMENTARY RULES AND PROCEDURES','TECHNICAL AND PRODUCTION','ENTERPRISE DEVELOPMENT','CLIMATE RESILIENCE','COMPLIANCE','LEADERSHIP AND GOVERNANCE','OTHER'];
    const TRAINING_STATUSES=['PLANNED','SCHEDULED','ONGOING','COMPLETED','CANCELLED'];
    const ARBO_REPORT_TITLES={COMPREHENSIVE:'DAR ARBO PROFILE AND ARBDSP INTERVENTION REPORT',MEMBERSHIP:'DAR ARBO MEMBERSHIP REGISTRY REPORT',PROJECTS:'DAR ARBDSP PROJECT ACCOMPLISHMENT AND MONITORING REPORT',TRAINING:'DAR CAPABILITY DEVELOPMENT AND TRAINING REPORT',MACHINERY:'DAR FARM MACHINERY AND EQUIPMENT UTILIZATION REPORT',PRODUCTS:'DAR ENTERPRISE PRODUCT DEVELOPMENT AND SALES REPORT',INCOME:'DAR MONTHLY ARBO INCOME MONITORING REPORT'};
    const state={db:null,user:null,profile:null,arbos:[],projects:[],updates:[],training:[],income:[],assignments:[],personnel:[],machinery:[],utilization:[],products:[],sales:[],merkado:[],members:[],loans:[],current:null,tab:'profile',page:0,filtered:[],selectedBulkMembers:new Map(),arbSearchTimer:null,lastMemberCandidates:[]};
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const blank=v=>v===null||v===undefined||String(v).trim()==='';
    const show=v=>blank(v)?'—':esc(v);
    const upper=v=>blank(v)?'—':String(v).toLocaleUpperCase('en-PH');
    const textOrNull=v=>blank(v)?null:String(v).trim();
    const dateOnly=v=>v?String(v).slice(0,10):'';
    const today=()=>new Date().toISOString().slice(0,10);
    const currentMonth=()=>today().slice(0,7)+'-01';
    const formatDate=v=>{if(!v)return '—';const d=new Date(dateOnly(v)+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'})};
    const formatMonth=v=>{if(!v)return '—';const d=new Date(dateOnly(v)+'T00:00:00');return d.toLocaleDateString('en-PH',{year:'numeric',month:'long'})};
    const money=v=>'₱'+(Number(v)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
    const statusKind=value=>{const v=String(value||'').toUpperCase();if(['COMPLETED','VERIFIED','CURRENT','ACTIVE','ON TRACK','FULLY PAID'].includes(v))return'green';if(['ONGOING','APPROVED','SUBMITTED','PROFILED'].includes(v))return'blue';if(['ON HOLD','FOR VALIDATION','PROPOSED','DRAFT','DELAYED'].includes(v))return'amber';if(['CANCELLED','RETURNED','OVERDUE','DEFAULTED'].includes(v))return'red';return'gray'};
    const badge=value=>`<span class="status status-${statusKind(value)}">${show(value)}</span>`;
    const role=()=>String(state.profile?.role||'').toUpperCase();
    const isFullEditor=()=>['ADMIN','STAFF','LTSP','LTSP PERSONNEL','CARPO-PBDD','PBDD-CARPO'].includes(role());
    const isPbDDProjectUser=()=>['ADMIN','PBDD PERSONNEL','PBDD UNIT HEAD','PBDD ADMIN','PBDD-ADMIN','CARPO-PBDD','PBDD-CARPO'].includes(role());
    const canPrintAllArbos=()=>['ADMIN','PBDD ADMIN','PBDD-ADMIN','CARPO-PBDD','PBDD-CARPO'].includes(role());
    const isVerifier=()=>['ADMIN','PBDD UNIT HEAD','PBDD ADMIN','PBDD-ADMIN','CARPO-PBDD','PBDD-CARPO'].includes(role());
    const currentId=()=>state.current?.id;
    const projectsFor=id=>state.projects.filter(p=>String(p.arbo_id)===String(id));

    function applyFilters(){
        const tokens=$('searchText').value.trim().toUpperCase().split(/\s+/).filter(Boolean),municipality=$('municipalityFilter').value,barangay=$('barangayFilter').value,unit=$('unitFilter').value,pillar=$('pillarFilter').value,projectStatus=$('projectStatusFilter').value,monitoring=$('monitoringFilter').value;
        state.filtered=state.arbos.filter(a=>{
            const projects=projectsFor(a.id),trainings=trainingFor(a.id),latest=latestIncome(a.id),haystack=[a.id,a.dar_arbo_id,a.dar_previous_arbo_id,a.name,a.municipality,a.barangay,a.arc_classification,a.arc_id,a.arc_name,a.cluster_name,...projects.flatMap(p=>[p.project_name,p.component,p.pillar,p.reference_no]),...trainings.flatMap(t=>[t.training_title,t.training_type,t.provider_agency])].join(' ').toUpperCase();
            if(tokens.some(t=>!haystack.includes(t)))return false;

            if(barangay&&a.barangay!==barangay)return false;
            if(unit&&!projects.some(p=>p.pbdd_unit===unit)&&!trainingFor(a.id).some(t=>t.pbdd_unit===unit)&&!incomeFor(a.id).some(i=>i.pbdd_unit===unit)&&!machineryFor(a.id).some(m=>m.pbdd_unit===unit)&&!productsFor(a.id).some(p=>p.pbdd_unit===unit))return false;

    async function searchMemberDatabase() {
        const term = $('f_search_term').value.trim();
        const box = $('memberSearchResults');
        box.style.display = 'block';
        
        if (!term) {
            box.innerHTML = '<div class="empty-panel">Type search terms to find ARBs.</div>';
            return;
        }
        
        box.innerHTML = '<div class="empty-panel">Searching ARB database…</div>';
        
        try {
            const safeTerm = term.replace(/[,"]/g, ' ').replace(/\s+/g, ' ').trim();
            const pattern = `%${safeTerm}%`;
            const tokens = safeTerm.split(' ').filter(t => t.length > 0);

            let arbOr = `generated_arb_id.ilike.${pattern},first_name.ilike.${pattern},last_name.ilike.${pattern},middle_name.ilike.${pattern}`;
            if (!isNaN(safeTerm) && safeTerm.trim() !== '') arbOr += `,id.eq.${safeTerm}`;
            if (tokens.length > 1) {
                const conditions = tokens.map(token => `first_name.ilike.%${token}%,last_name.ilike.%${token}%`).join(',');
                arbOr += `,` + conditions;
            }

            const limit = 100;
            
            const [arbRes, profRes, lhRes, epcRes] = await Promise.all([
                state.db.from('arb').select('id').or(arbOr).limit(limit),
                state.db.from('arb_profiles').select('arb_id').or(`sequence_no.ilike.${pattern},fb_name.ilike.${pattern}`).limit(limit),
                state.db.from('arb_landholdings').select('arb_profile_id')
                    .or(`claim_no.ilike.${pattern},survey_no.ilike.${pattern},asp_no.ilike.${pattern},lot_no.ilike.${pattern},lhid.ilike.${pattern},ccloa_title_raw.ilike.${pattern},title_no.ilike.${pattern},title_type.ilike.${pattern},cocrom_certificate_no.ilike.${pattern},cocrom_reference_raw.ilike.${pattern},ep_cloa_serial_no.ilike.${pattern},original_mother_title_no.ilike.${pattern},municipality.ilike.${pattern},barangay.ilike.${pattern},landowner.ilike.${pattern}`).limit(limit),
                state.db.from('epcloais_import_profile_matches').select('arb_profile_id')
                    .or(`cocrom_certificate_no.ilike.${pattern},ep_cloa_serial_no.ilike.${pattern},title_no.ilike.${pattern},claim_no.ilike.${pattern},lhid_raw.ilike.${pattern}`).limit(limit)
            ]);

            if(arbRes.error) throw arbRes.error;
            if(profRes.error) throw profRes.error;
            if(lhRes.error) throw lhRes.error;
            if(epcRes.error) throw epcRes.error;

            let globalSearchIds = new Set();
            (arbRes.data || []).forEach(r => globalSearchIds.add(String(r.id)));
            (profRes.data || []).forEach(r => globalSearchIds.add(String(r.arb_id)));

            const lhProfileIds = [...new Set([
                ...(lhRes.data || []).map(r => r.arb_profile_id),
                ...(epcRes.data || []).map(r => r.arb_profile_id)
            ].filter(Boolean))];

            if (lhProfileIds.length > 0) {
                const {data: resolvedProfs, error: rpErr} = await state.db.from('arb_profiles').select('arb_id').in('id', lhProfileIds);
                if(rpErr) throw rpErr;
                (resolvedProfs || []).forEach(p => { if (p.arb_id) globalSearchIds.add(String(p.arb_id)); });
            }

            const arbIds = [...globalSearchIds].slice(0, limit);
            
            if (!arbIds.length) {
                box.innerHTML = '<div class="empty-panel">No ARB matched.</div>';
                state.lastMemberCandidates = [];
                return;
            }

            const [finalArbs, finalProfs] = await Promise.all([
                state.db.from('arb').select('id, first_name, last_name, middle_name, generated_arb_id').in('id', arbIds),
                state.db.from('arb_profiles').select('id, arb_id').in('arb_id', arbIds)
            ]);

            if(finalArbs.error) throw finalArbs.error;
            if(finalProfs.error) throw finalProfs.error;

            const profileIds = (finalProfs.data || []).map(p => p.id);
            let finalLhs = { data: [] };
            if (profileIds.length > 0) {
                finalLhs = await state.db.from('arb_landholdings').select('arb_profile_id, municipality, barangay, title_no, ep_cloa_serial_no, ccloa_title_raw').in('arb_profile_id', profileIds);
                if(finalLhs.error) throw finalLhs.error;
            }

            const arbMap = Object.fromEntries((finalArbs.data || []).map(a => [String(a.id), a]));
            const lhMap = {};
            (finalLhs.data || []).forEach(lh => {
                if(!lhMap[lh.arb_profile_id]) lhMap[lh.arb_profile_id] = { muns: new Set(), brgys: new Set(), titles: new Set(), ccloas: new Set() };
                if(lh.municipality) lhMap[lh.arb_profile_id].muns.add(lh.municipality);
                if(lh.barangay) lhMap[lh.arb_profile_id].brgys.add(lh.barangay);
                if(lh.title_no) lhMap[lh.arb_profile_id].titles.add(lh.title_no);
                else if(lh.ep_cloa_serial_no) lhMap[lh.arb_profile_id].titles.add(lh.ep_cloa_serial_no);
                if(lh.ccloa_title_raw) lhMap[lh.arb_profile_id].ccloas.add(lh.ccloa_title_raw);
            });

            const candidates = (finalProfs.data || []).map(p => {
                const a = arbMap[String(p.arb_id)] || {};
                const parts = [a.last_name ? a.last_name+',' : '', a.first_name || '', a.middle_name || ''].filter(Boolean);
                const name = parts.join(' ').trim() || 'UNKNOWN';
                const l = lhMap[p.id] || { muns: new Set(), brgys: new Set(), titles: new Set(), ccloas: new Set() };
                
                return {
                    arb_profile_id: p.id,
                    arb_id_uuid: a.id || null,
                    arb_id: a.generated_arb_id || a.id,
                    display_name: name,
                    municipalities: [...l.muns].join(', ') || 'N/A',
                    barangays: [...l.brgys].join(', ') || 'N/A',
                    titles: [...l.titles].join(', ') || '—',
                    ccloas: [...l.ccloas].join(', ') || '—'
                };
            }).sort((a,b) => a.display_name.localeCompare(b.display_name));

            state.lastMemberCandidates = candidates;
            renderMemberSearchResults();
            
        } catch(e) {
            box.innerHTML = `<div class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</div>`;
        }
    }

            }
            if(type==='product_sale'){
                const payload={product_id:data.get('product_id'),arbo_id:currentId(),sale_date:data.get('sale_date'),buyer_name:textOrNull(data.get('buyer_name')),buyer_type:textOrNull(data.get('buyer_type')),sales_channel:textOrNull(data.get('sales_channel')),market_location:textOrNull(data.get('market_location')),quantity_sold:Number(data.get('quantity_sold'))||0,unit_price:Number(data.get('unit_price'))||0,gross_sales:Number(data.get('gross_sales'))||0,amount_collected:Number(data.get('amount_collected'))||0,payment_status:data.get('payment_status'),receipt_reference:textOrNull(data.get('receipt_reference')),document_reference:textOrNull(data.get('document_reference')),remarks:textOrNull(data.get('remarks'))};
                const result=id?await state.db.from('arbo_product_sales').update(payload).eq('id',id):await state.db.from('arbo_product_sales').insert(payload);if(result.error)throw result.error;
            }
            if(type==='merkado_sale'){
                const payload={arbo_id:currentId(),sale_date:data.get('sale_date'),activity_name:textOrNull(data.get('activity_name')),product_description:textOrNull(data.get('product_description')),gross_sales:Number(data.get('gross_sales'))||0,remarks:textOrNull(data.get('remarks'))};
                const result=id?await state.db.from('arbo_merkado_sales').update(payload).eq('id',id):await state.db.from('arbo_merkado_sales').insert(payload);if(result.error)throw result.error;
            }
            if(type==='simple_loan'){
                const payload={arbo_id:currentId(),date_released:data.get('date_released'),product_name:textOrNull(data.get('product_name')),amount_released:Number(data.get('amount_released'))||0,term_months:Number(data.get('term_months'))||0,expected_income:Number(data.get('expected_income'))||0,amount_collected:Number(data.get('amount_collected'))||0,collection_status:data.get('collection_status'),remarks:textOrNull(data.get('remarks'))};
                const result=id?await state.db.from('arbo_lending_monitoring').update(payload).eq('id',id):await state.db.from('arbo_lending_monitoring').insert(payload);if(result.error)throw result.error;
            }
            closeModal();await reloadMonitoringData();renderMaster();renderWorkspace();
        }catch(error){alert('Unable to save: '+error.message)}finally{$('saveModal').disabled=false}
    }

    async function reloadMonitoringData(){
        const [projects,updates,training,income,machinery,utilization,products,sales,merkado,members,loans]=await Promise.all([fetchAll('arbo_pbdd_projects','created_at',false),fetchAll('arbo_project_monitoring_updates','monitoring_date',false),fetchAll('arbo_training_activities','start_date',false),fetchAll('arbo_monthly_income','report_month',false),fetchAll('arbo_machinery_assets','created_at',false),fetchAll('arbo_machinery_utilization','activity_date',false),fetchAll('arbo_enterprise_products','created_at',false),fetchAll('arbo_product_sales','sale_date',false),fetchAll('arbo_merkado_sales','sale_date',false),fetchAll('arbo_members','date_from',false),fetchAll('arbo_lending_monitoring','date_released',false)]);
        state.projects=projects;state.updates=updates;state.training=training;state.income=income;state.machinery=machinery;state.utilization=utilization;state.products=products;state.sales=sales;state.merkado=merkado;state.members=members;state.loans=loans;
    }

    document.addEventListener('click', e => {
        const removeBulk = e.target.closest('[data-remove-bulk]');
        if(removeBulk) { 
            state.selectedBulkMembers.delete(String(removeBulk.dataset.removeBulk)); 
            renderSelectedBulkMembers(); 
            if (typeof renderMemberSearchResults === 'function') renderMemberSearchResults();
            return;
        }

        const actionBtn = e.target.closest('[data-action-arb]');
        const toggleRow = e.target.closest('[data-toggle-arb]');
        
        if (actionBtn) {
            e.stopPropagation();
            if (!actionBtn.hasAttribute('disabled')) {
                const id = actionBtn.dataset.actionArb;
                const isSelected = state.selectedBulkMembers.has(String(id));
                setBulkCandidate(id, !isSelected);
            }
        } else if (toggleRow) {
            if (!toggleRow.hasAttribute('data-disabled')) {
                const id = toggleRow.dataset.toggleArb;
                const isSelected = state.selectedBulkMembers.has(String(id));
                setBulkCandidate(id, !isSelected);
            }
        }
    });

    document.addEventListener('input',e=>{
        if(e.target.matches('[data-bulk-field]'))rememberBulkField(e.target);
    });

    $('searchText').addEventListener('input',applyFilters);['unitFilter','pillarFilter','projectStatusFilter','monitoringFilter','barangayFilter'].forEach(id=>$(id).addEventListener('change',applyFilters));
    $('municipalityFilter').addEventListener('change',()=>{populateBarangays();applyFilters()});
    $('clearFilters').addEventListener('click',()=>{$('searchText').value='';$('municipalityFilter').value='';populateBarangays();$('barangayFilter').value='';$('unitFilter').value='';$('pillarFilter').value='';$('projectStatusFilter').value='';$('monitoringFilter').value='';applyFilters()});
    $('previousPage').addEventListener('click',()=>{state.page=Math.max(0,state.page-1);renderMaster()});$('nextPage').addEventListener('click',()=>{state.page++;renderMaster()});
    $('editArboProfile').addEventListener('click',()=>openArboProfile(state.current));$('openArboReport').addEventListener('click',openArboReportCenter);$('summaryReport').addEventListener('click',openSummaryReportCenter);
    $('closeWorkspace').addEventListener('click',()=>{$('workspace').style.display='none';$('arboListSection').style.display='block';state.current=null;});$('closeModal').addEventListener('click',closeModal);$('cancelModal').addEventListener('click',closeModal);$('monitorModal').addEventListener('click',event=>{if(event.target===$('monitorModal'))closeModal()});$('monitorForm').addEventListener('submit',saveRecord);
    $('closeReportPreview').addEventListener('click',closeReportTable);$('cancelReportPreview').addEventListener('click',closeReportTable);$('printReportPreview').addEventListener('click',printCurrentReport);$('reportModal').addEventListener('click',event=>{if(event.target===$('reportModal'))closeReportTable()});

    try{
        state.db=resolveClient();if(!state.db)throw new Error('Supabase client configuration was not found.');
        const auth=await state.db.auth.getUser();if(auth.error||!auth.data?.user){location.href='login.html';return}state.user=auth.data.user;
        const profile=await state.db.from('profiles').select('*').eq('id',state.user.id).single();if(profile.error)throw profile.error;state.profile=profile.data;
        if(String(state.profile.status||'ACTIVE').toUpperCase()==='INACTIVE')throw new Error('Your account is inactive.');
        if(['PBDD PERSONNEL','PBDD UNIT HEAD'].includes(role())&&!PBDD_UNITS.includes(String(state.profile.pbdd_unit||'').toUpperCase()))throw new Error('ADMIN must assign this account to SIB, CRFPS or EDES before project monitoring can be opened.');
        $('summaryReport').style.display=canPrintAllArbos()?'inline-flex':'none';
        if(!isPbDDProjectUser())['unitFilter','pillarFilter','projectStatusFilter','monitoringFilter'].forEach(id=>{$(id).closest('div').style.display='none'});
        await buildNavbar();await loadData();
    }catch(error){showSetup(error.message);$('arboRows').innerHTML=`<tr><td colspan="8" class="empty" style="color:#b91c1c">${esc(error.message)}</td></tr>`}
})();
</script>
</body>
</html>
