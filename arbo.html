<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Cooperative Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        :root { --arbo-navy:#0a3d62; --arbo-blue:#1769a0; --arbo-green:#15803d; --arbo-red:#b91c1c; --arbo-amber:#b45309; --arbo-line:#dbe3ea; --arbo-soft:#f8fafc; }
        .arbo-master-toolbar { display:grid; grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(140px,.7fr)) auto; gap:10px; align-items:end; margin-bottom:15px; }
        .arbo-master-toolbar label { display:block; margin-bottom:5px; color:#475569; font-size:.76rem; font-weight:700; text-transform:uppercase; }
        .arbo-input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:7px; background:white; color:#0f172a; font:inherit; box-sizing:border-box; }
        .arbo-input:focus { outline:none; border-color:var(--arbo-blue); box-shadow:0 0 0 3px rgba(23,105,160,.1); }
        .arbo-kpis { display:grid; grid-template-columns:repeat(6,minmax(125px,1fr)); gap:12px; margin:18px 0; }
        .arbo-kpi { padding:14px; border:1px solid var(--arbo-line); border-radius:10px; background:white; box-shadow:0 3px 10px rgba(15,23,42,.04); }
        .arbo-kpi span { display:block; color:#64748b; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.035em; }
        .arbo-kpi strong { display:block; margin-top:5px; color:var(--arbo-navy); font-size:1.35rem; }
        .workspace { margin-top:24px; overflow:hidden; border:1px solid var(--arbo-line); border-radius:12px; background:white; box-shadow:0 10px 28px rgba(15,23,42,.08); }
        .workspace-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:20px; border-bottom:1px solid var(--arbo-line); background:linear-gradient(135deg,#fff,#f2f8fc); }
        .workspace-header h2 { margin:0 0 5px; color:var(--arbo-navy); }
        .workspace-header p { margin:0; color:#64748b; }
        .workspace-actions { display:flex; flex-wrap:wrap; gap:8px; }
        .workspace-tabs { display:flex; gap:4px; overflow:auto; padding:8px 10px 0; border-bottom:1px solid var(--arbo-line); background:#f8fafc; }
        .workspace-tab { flex:0 0 auto; padding:10px 12px; border:0; border-bottom:3px solid transparent; background:transparent; color:#475569; font-weight:700; cursor:pointer; }
        .workspace-tab.active { border-bottom-color:var(--arbo-blue); color:var(--arbo-navy); background:white; }
        .workspace-body { min-height:280px; padding:18px; }
        .module-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:13px; }
        .module-heading h3 { margin:0; color:var(--arbo-navy); }
        .module-note { margin:3px 0 0; color:#64748b; font-size:.82rem; }
        .module-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .data-table-wrap { width:100%; overflow:auto; border:1px solid var(--arbo-line); border-radius:8px; }
        .data-table { width:100%; min-width:900px; border-collapse:collapse; }
        .data-table th,.data-table td { padding:10px; border-bottom:1px solid #e8edf2; text-align:left; vertical-align:top; }
        .data-table th { background:#f8fafc; color:#475569; font-size:.76rem; text-transform:uppercase; letter-spacing:.025em; }
        .data-table tr:last-child td { border-bottom:0; }
        .data-table tbody tr:hover { background:#fbfdff; }
        .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:.7rem; font-weight:800; white-space:nowrap; }
        .badge-green { color:#166534; background:#dcfce7; }
        .badge-red { color:#991b1b; background:#fee2e2; }
        .badge-amber { color:#92400e; background:#fef3c7; }
        .badge-blue { color:#1e40af; background:#dbeafe; }
        .badge-gray { color:#475569; background:#e2e8f0; }
        .due-row { background:#fff7ed !important; }
        .overdue-row { background:#fff1f2 !important; }
        .empty-panel { padding:30px; color:#64748b; text-align:center; }
        .profile-summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .profile-summary-card { padding:15px; border:1px solid var(--arbo-line); border-radius:9px; background:#f8fafc; }
        .profile-summary-card h4 { margin:0 0 10px; color:var(--arbo-navy); }
        .summary-field { display:grid; grid-template-columns:130px 1fr; gap:8px; padding:6px 0; border-bottom:1px dashed #dbe3ea; }
        .summary-field:last-child { border-bottom:0; }
        .summary-field span { color:#64748b; font-size:.8rem; }
        .summary-field strong { overflow-wrap:anywhere; font-size:.85rem; }
        .form-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .form-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .field-group { min-width:0; }
        .field-group.full { grid-column:1 / -1; }
        .field-group label { display:block; margin-bottom:5px; color:#334155; font-size:.82rem; font-weight:700; }
        .field-help { display:block; margin-top:4px; color:#64748b; font-size:.75rem; }
        .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
        .picker-results { max-height:250px; overflow:auto; margin-top:10px; border:1px solid var(--arbo-line); border-radius:7px; }
        .picker-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #e8edf2; }
        .picker-row:last-child { border-bottom:0; }
        .picker-row small { display:block; margin-top:3px; color:#64748b; }
        .selected-person { margin-top:10px; padding:10px; border:1px solid #86efac; border-radius:7px; background:#f0fdf4; color:#166534; }
        .access-note { margin:0 0 15px; padding:10px 12px; border-left:4px solid var(--arbo-blue); border-radius:6px; background:#eff6ff; color:#1e3a5f; }
        .warning-note { border-left-color:var(--arbo-amber); background:#fffbeb; color:#78350f; }
        .error-note { border-left-color:var(--arbo-red); background:#fff1f2; color:#881337; }
        .money { white-space:nowrap; font-variant-numeric:tabular-nums; }
        .page-controls { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; }
        .modal-content.coop-modal { width:min(900px,94vw); max-height:92vh; overflow:auto; }
        #setupWarning { display:none; }
        @media print { body > * { display:none !important; } #printArea { display:block !important; position:absolute; inset:0; padding:12px; background:white; } }
        @media (max-width:1050px) { .arbo-master-toolbar { grid-template-columns:repeat(2,1fr); } .arbo-kpis { grid-template-columns:repeat(3,1fr); } .profile-summary-grid { grid-template-columns:1fr; } }
        @media (max-width:700px) { .arbo-master-toolbar,.form-grid-2,.form-grid-3 { grid-template-columns:1fr; } .arbo-kpis { grid-template-columns:repeat(2,1fr); } .workspace-header { flex-direction:column; } .field-group.full { grid-column:auto; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️ ARB Global Cleansing <small>ARBO Management</small></h1>
    <nav class="nav" id="mainNav"></nav>

    <div id="setupWarning" class="access-note error-note"></div>

    <section class="section">
        <div class="module-heading">
            <div>
                <h2 style="margin:0;color:#0a3d62;">Cooperative Management System</h2>
                <p class="module-note">Only ARBOs permitted by your account are displayed.</p>
            </div>
            <div class="module-actions">
                <button class="btn btn-primary" id="addArboBtn" type="button">➕ Add ARBO</button>
            </div>
        </div>

        <div class="arbo-master-toolbar">
            <div><label for="searchArbo">ARBO name</label><input class="arbo-input" id="searchArbo" placeholder="Search cooperative name"></div>
            <div><label for="searchMunicipality">Municipality</label><input class="arbo-input" id="searchMunicipality" placeholder="All municipalities"></div>
            <div><label for="searchBarangay">Barangay</label><input class="arbo-input" id="searchBarangay" placeholder="All barangays"></div>
            <div><label for="searchStatus">Status</label><select class="arbo-input" id="searchStatus"><option value="">All</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div>
            <button class="btn btn-primary" id="applyArboSearch" type="button">Search</button>
        </div>

        <div class="data-table-wrap">
            <table class="data-table">
                <thead><tr><th>ID</th><th>ARBO</th><th>Municipality</th><th>Barangay</th><th>Contact</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="arboTableBody"><tr><td colspan="7" class="empty-panel">Loading accessible ARBOs…</td></tr></tbody>
            </table>
        </div>
        <div class="page-controls"><button class="btn btn-primary" id="previousArboPage" type="button">Previous</button><span id="arboPageInfo">Page 1</span><button class="btn btn-primary" id="nextArboPage" type="button">Next</button></div>
    </section>

    <section class="workspace" id="cooperativeWorkspace" style="display:none;">
        <header class="workspace-header">
            <div><h2 id="workspaceTitle">ARBO</h2><p id="workspaceSubtitle"></p></div>
            <div class="workspace-actions"><button class="btn btn-warning" id="editCurrentArbo" type="button">✏️ Edit ARBO</button><button class="btn btn-primary" id="printCurrentArbo" type="button">🖨️ Print</button><button class="btn btn-danger" id="closeWorkspace" type="button">Close</button></div>
        </header>
        <div class="arbo-kpis" id="workspaceKpis"></div>
        <nav class="workspace-tabs" id="workspaceTabs"></nav>
        <div class="workspace-body" id="workspaceBody"><div class="empty-panel">Select an ARBO.</div></div>
    </section>
</div>

<div id="entityModal" class="modal">
    <div class="modal-content coop-modal">
        <button class="modal-close" id="closeEntityModal" type="button">&times;</button>
        <h2 id="entityModalTitle">Add record</h2>
        <form id="entityForm">
            <input type="hidden" id="entityType"><input type="hidden" id="entityId">
            <div id="entityFormBody"></div>
            <div class="form-actions"><button class="btn btn-danger" id="cancelEntity" type="button">Cancel</button><button class="btn btn-success" id="saveEntity" type="submit">💾 Save</button></div>
        </form>
    </div>
</div>

<div id="printArea" style="display:none;"><h2 id="printHeading"></h2><p id="printSubheading"></p><div id="printBody"></div></div>

<script>
(async function () {
    'use strict';
    const PAGE_SIZE = 50;
    const state = {
        db:null, user:null, profile:null, arboPage:0, arboCount:0,
        currentArbo:null, activeTab:'overview', selectedMemberCandidate:null, selectedValidator:null,
        data:{ members:[], officers:[], machinery:[], services:[], income:[], capital:[], activities:[], validators:[] }
    };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const blank = (v) => v === null || v === undefined || String(v).trim() === '';
    const val = (v) => blank(v) ? '—' : esc(v);
    const nullIfBlank = (v) => blank(v) ? null : String(v).trim();
    const money = (v) => '₱' + (Number(v) || 0).toLocaleString('en-PH', {minimumFractionDigits:2,maximumFractionDigits:2});
    const dateOnly = (v) => v ? String(v).slice(0,10) : '';
    const formatDate = (v) => { if (!v) return '—'; const d=new Date(String(v).length===10?v+'T00:00:00':v); return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}); };
    const badge = (text, kind='gray') => `<span class="badge badge-${kind}">${val(text)}</span>`;
    const role = () => String(state.profile?.role || '').toLowerCase();
    const isManager = () => ['admin','staff'].includes(role());
    const today = () => new Date().toISOString().slice(0,10);
    const byId = (rows,id) => rows.find(r => String(r.id) === String(id));
    const formValue = (name) => new FormData($('entityForm')).get(name);
    const currentId = () => state.currentArbo?.id;
    const input = (name,label,value='',type='text',attrs='') => `<div class="field-group"><label for="f_${name}">${esc(label)}</label><input class="arbo-input" id="f_${name}" name="${esc(name)}" type="${esc(type)}" value="${esc(value ?? '')}" ${attrs}></div>`;
    const textarea = (name,label,value='') => `<div class="field-group full"><label for="f_${name}">${esc(label)}</label><textarea class="arbo-input" id="f_${name}" name="${esc(name)}" rows="3">${esc(value ?? '')}</textarea></div>`;
    const select = (name,label,options,value='',attrs='') => `<div class="field-group"><label for="f_${name}">${esc(label)}</label><select class="arbo-input" id="f_${name}" name="${esc(name)}" ${attrs}>${options.map(o=>{const pair=Array.isArray(o)?o:[o,o];return `<option value="${esc(pair[0])}"${String(pair[0])===String(value)?' selected':''}>${esc(pair[1])}</option>`;}).join('')}</select></div>`;

    function resolveClient() {
        const existing=window.secureDbClient||window.supabaseClient||window.dbClient;
        if (existing?.from && existing?.auth) return existing;
        const c=window.SUPABASE_CONFIG||window.supabaseConfig||window.APP_CONFIG||{};
        const url=c.url||c.supabaseUrl||window.SUPABASE_URL||'https://xnwttnpfzcjbszwxsgox.supabase.co';
        const key=c.publishableKey||c.anonKey||c.supabaseAnonKey||window.SUPABASE_ANON_KEY||'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
        return window.supabase?.createClient ? window.supabase.createClient(url,key) : null;
    }

    async function buildNavbar(userProfile, authData) {
        const navEl=$('mainNav'); if(!navEl) return;
        const {data:navItems}=await state.db.from('system_navigation').select('*').order('id',{ascending:true});
        const curPath=window.location.pathname;
        const links=navItems?.length?navItems:[
            {label:'Dashboard',url:'/dashboard.html',icon:'📊'},{label:'ARBO Management',url:'/arbo.html',icon:'🏢'},
            {label:'ARB Management',url:'/arb.html',icon:'👤'},{label:'Validators',url:'/validators.html',icon:'✅'},{label:'Reports',url:'/reports.html',icon:'📈'}
        ];
        const unique=[]; const seen=new Set(); for(const item of links){if(!seen.has(item.label)){seen.add(item.label);unique.push(item);}}
        let html=unique.map(l=>{const target=(l.url||'').replace('/','');const active=curPath.includes(target)&&target?'active':'';return `<a href="${esc(l.url)}" class="${active}">${esc(l.icon||'')} ${esc(l.label)}</a>`;}).join('');
        const display=userProfile?.full_name?.trim()||authData.user.email;
        html+=`<span class="user-badge" style="margin-left:auto;color:#0a3d62;font-weight:600;">👤 ${esc(display)} (${esc(userProfile?.role)})</span><span id="navLogoutBtn" style="color:#b91c1c;font-weight:600;margin-left:10px;cursor:pointer;">🚪 Logout</span>`;
        navEl.innerHTML=html; $('navLogoutBtn')?.addEventListener('click',async()=>{await state.db.auth.signOut();location.href='login.html';});
    }

    function showSetupWarning(message) { const el=$('setupWarning'); el.innerHTML=`<strong>Database setup required:</strong> ${esc(message)} Run <code>ARBO_Cooperative_Management_Schema.sql</code> once in Supabase SQL Editor.`; el.style.display='block'; }
    function openModal(title,type,id='') { $('entityModalTitle').textContent=title; $('entityType').value=type; $('entityId').value=id||''; $('entityModal').classList.add('active'); }
    function closeModal() { $('entityModal').classList.remove('active'); $('entityForm').reset(); $('entityFormBody').innerHTML=''; state.selectedMemberCandidate=null; state.selectedValidator=null; }
    function recordAudit(payload,isNew) { payload.updated_at=new Date().toISOString(); payload.updated_by=state.user.id; if(isNew) payload.created_by=state.user.id; return payload; }

    async function loadArbos() {
        const tbody=$('arboTableBody'); tbody.innerHTML='<tr><td colspan="7" class="empty-panel">Loading accessible ARBOs…</td></tr>';
        const from=state.arboPage*PAGE_SIZE, to=from+PAGE_SIZE-1;
        try {
            let q=state.db.from('arbo').select('*',{count:'exact'}).order('name',{ascending:true}).range(from,to);
            const name=$('searchArbo').value.trim(), muni=$('searchMunicipality').value.trim(), brgy=$('searchBarangay').value.trim(), status=$('searchStatus').value;
            if(name) q=q.ilike('name','%'+name.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(muni) q=q.ilike('municipality','%'+muni.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(brgy) q=q.ilike('barangay','%'+brgy.replaceAll('%','\\%').replaceAll('_','\\_')+'%');
            if(status) q=q.eq('status',status);
            const r=await q; if(r.error) throw r.error; state.arboCount=r.count||0;
            if(!r.data?.length){tbody.innerHTML='<tr><td colspan="7" class="empty-panel">No accessible ARBO matched the filters.</td></tr>';}
            else tbody.innerHTML=r.data.map(a=>`<tr><td>${val(a.id)}</td><td><strong style="color:#0a3d62;">${val(a.name)}</strong><br><small>${val(a.registration_no||a.cda_registration_no)}</small></td><td>${val(a.municipality)}</td><td>${val(a.barangay)}</td><td>${val(a.contact_number)}</td><td>${badge(a.status||'ACTIVE',(a.status||'ACTIVE')==='ACTIVE'?'green':'gray')}</td><td><button class="btn btn-info btn-sm" type="button" data-open-arbo="${esc(a.id)}">Open</button></td></tr>`).join('');
            $('arboPageInfo').textContent=`Page ${state.arboPage+1} of ${Math.max(1,Math.ceil(state.arboCount/PAGE_SIZE))} · ${state.arboCount} ARBO(s)`;
            $('previousArboPage').disabled=state.arboPage===0; $('nextArboPage').disabled=to+1>=state.arboCount;
        } catch(e) { tbody.innerHTML=`<tr><td colspan="7" class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</td></tr>`; }
    }

    async function safeArboQuery(table,orderColumn) {
        let q=state.db.from(table).select('*').eq('arbo_id',currentId()); if(orderColumn) q=q.order(orderColumn,{ascending:false}); const r=await q; if(r.error) throw r.error; return r.data||[];
    }

    async function openArbo(id) {
        $('cooperativeWorkspace').style.display='block'; $('workspaceBody').innerHTML='<div class="empty-panel">Loading cooperative records…</div>';
        try {
            const ar=await state.db.from('arbo').select('*').eq('id',id).single(); if(ar.error) throw ar.error; state.currentArbo=ar.data;
            const loaders=[
                ['members','arbo_members','date_from'],['officers','arbo_officer_terms','date_assumed'],['machinery','arbo_machinery','created_at'],
                ['services','arbo_machinery_services','scheduled_date'],['income','arbo_income','date'],['capital','arbo_capital_transactions','transaction_date'],
                ['activities','arbo_activities','training_date'],['validators','arbo_validators','assigned_from']
            ];
            const results=await Promise.all(loaders.map(async([key,table,order])=>{try{return [key,await safeArboQuery(table,order),null];}catch(e){return [key,[],e];}}));
            const missing=[]; for(const [key,rows,error] of results){state.data[key]=rows;if(error)missing.push(`${key}: ${error.message}`);}
            if(missing.length) showSetupWarning(missing.join(' | '));
            renderWorkspace(); $('cooperativeWorkspace').scrollIntoView({behavior:'smooth',block:'start'});
        } catch(e) { $('workspaceBody').innerHTML=`<div class="access-note error-note">${esc(e.message)}</div>`; }
    }

    function signedCapital(tx) { return String(tx.transaction_type).toUpperCase()==='REFUND' ? -(Number(tx.amount)||0) : Number(tx.amount)||0; }
    function isDue(date) { if(!date) return false; const days=(new Date(dateOnly(date))-new Date(today()))/86400000; return days<=30; }
    function isOverdue(date) { return Boolean(date) && dateOnly(date)<today(); }
    function canEditCurrent() { return isManager() || state.data.validators.some(v=>v.validator_user_id===state.user.id && v.is_active && dateOnly(v.assigned_from)<=today() && (!v.assigned_until||dateOnly(v.assigned_until)>=today())); }
    function memberName(id) { return byId(state.data.members,id)?.arb_name || 'Unknown member'; }
    function machineryName(id) { return byId(state.data.machinery,id)?.equipment_name || '—'; }
    function activeMembers() { return state.data.members.filter(m=>(m.membership_status||'ACTIVE')==='ACTIVE' && !m.date_to); }

    const tabs=[['overview','Overview'],['members','Members'],['officers','Officers'],['machinery','Machinery'],['services','Maintenance & Repairs'],['income','Income & Rentals'],['capital','Paid-up Capital'],['activities','Activities'],['validators','Validators']];
    function renderWorkspace() {
        const a=state.currentArbo; $('workspaceTitle').textContent=a.name; $('workspaceSubtitle').textContent=[a.barangay,a.municipality,a.registration_no||a.cda_registration_no].filter(Boolean).join(' · ');
        $('editCurrentArbo').style.display=canEditCurrent()?'inline-flex':'none';
        const activeOfficers=state.data.officers.filter(o=>(o.term_status||'ACTIVE')==='ACTIVE'&&!o.actual_end_date).length;
        const due=state.data.machinery.filter(m=>isDue(m.next_maintenance_date)).length;
        const gross=state.data.income.reduce((s,r)=>s+(Number(r.gross_income??r.amount)||0),0);
        const net=state.data.income.reduce((s,r)=>s+(Number(r.net_income??r.amount)||0),0);
        const paid=state.data.capital.reduce((s,r)=>s+signedCapital(r),0);
        $('workspaceKpis').innerHTML=[['Active Members',activeMembers().length],['Active Officers',activeOfficers],['Machinery',state.data.machinery.length],['Maintenance Due',due],['Net Income',money(net)],['Paid-up Capital',money(paid)]].map(x=>`<div class="arbo-kpi"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('');
        $('workspaceTabs').innerHTML=tabs.map(([id,label])=>`<button class="workspace-tab${state.activeTab===id?' active':''}" data-tab="${id}" type="button">${esc(label)}</button>`).join('');
        renderActiveTab();
    }

    function heading(title,note,type,button='Add Record') { return `<div class="module-heading"><div><h3>${esc(title)}</h3><p class="module-note">${esc(note)}</p></div>${canEditCurrent()&&type?`<button class="btn btn-primary" type="button" data-add="${type}">➕ ${esc(button)}</button>`:''}</div>`; }
    function editButton(type,id) { return canEditCurrent()?`<button class="btn btn-warning btn-sm" type="button" data-edit="${type}" data-id="${esc(id)}">Edit</button>`:''; }
    function table(headers,rows,colspan) { return rows.length?`<div class="data-table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty-panel">No records yet.</div>`; }

    function renderActiveTab() {

        }

        }
        if(state.activeTab==='officers') body.innerHTML=heading('Leadership and Officer Terms','Every term retains its assumed, expected end, and actual end dates.','officer','Add Officer Term')+table(['Officer','Position','Assumed','Expected End','Actual End','Status','Action'],state.data.officers.map(o=>`<tr><td><strong>${val(memberName(o.membership_id))}</strong></td><td>${val(o.position)}</td><td>${formatDate(o.date_assumed)}</td><td>${formatDate(o.term_end_date)}</td><td>${formatDate(o.actual_end_date)}</td><td>${badge(o.term_status||'ACTIVE',o.actual_end_date?'gray':'green')}</td><td>${editButton('officer',o.id)}</td></tr>`),7);
        if(state.activeTab==='machinery') body.innerHTML=heading('Machinery Inventory','Awarded machinery, current condition, availability, and maintenance reminders.','machinery','Add Machinery')+table(['Machinery','Award / Source','Condition','Operating Status','Maintenance','Repair','Action'],state.data.machinery.map(m=>{const cls=isOverdue(m.next_maintenance_date)?'overdue-row':isDue(m.next_maintenance_date)?'due-row':'';return `<tr class="${cls}"><td><strong>${val(m.equipment_name)}</strong><br>${val(m.machinery_code)} · ${val(m.brand)} ${val(m.model)}<br><small>Serial: ${val(m.serial_no)}</small></td><td>${formatDate(m.date_release)}<br>${val(m.acquisition_source)}</td><td>${badge(m.condition_status||m.status||'SERVICEABLE',(m.condition_status||m.status)==='SERVICEABLE'?'green':'amber')}</td><td>${badge(m.operating_status||m.status||'AVAILABLE',(m.operating_status||m.status)==='AVAILABLE'?'green':'blue')}</td><td>Last: ${formatDate(m.last_maintenance_date)}<br>Next: ${formatDate(m.next_maintenance_date)} ${isOverdue(m.next_maintenance_date)?badge('OVERDUE','red'):isDue(m.next_maintenance_date)?badge('DUE SOON','amber'):''}</td><td>${val(m.repair_status)}</td><td><div style="display:flex;gap:5px;">${editButton('machinery',m.id)}${canEditCurrent()?`<button class="btn btn-info btn-sm" data-add-service="${esc(m.id)}" type="button">Service</button>`:''}</div></td></tr>`;}),7);

    }

    function findRecord(type,id) { const key={member:'members',officer:'officers',machinery:'machinery',service:'services',income:'income',capital:'capital',activity:'activities',validator:'validators'}[type]; return byId(state.data[key]||[],id)||{}; }
    function memberOptions(selected='') { const pool=state.data.members.filter(m=>activeMembers().includes(m)||String(m.id)===String(selected)); return pool.map(m=>[m.id,m.arb_name+(m.is_arb?' (ARB)':' (Non-ARB)')]).map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(selected)?' selected':''}>${esc(o[1])}</option>`).join(''); }
    function machineryOptions(selected='') { return state.data.machinery.map(m=>`<option value="${esc(m.id)}"${String(m.id)===String(selected)?' selected':''}>${esc(m.equipment_name)}</option>`).join(''); }

s','Remarks',r.remarks)}</div>`;

    function toggleMemberType() { const isArb=$('f_member_type').value==='ARB'; $('arbPicker').style.display=isArb?'block':'none'; $('manualNameGroup').style.display=isArb?'none':'block'; state.selectedMemberCandidate=null; $('selectedMember').innerHTML=''; }
    async function searchMemberDatabase() {
        const term=$('f_search_term').value.trim(), field=$('f_search_field').value, box=$('memberSearchResults'); if(!term){box.style.display='block';box.innerHTML='<div class="empty-panel">Enter a search value.</div>';return;}
        box.style.display='block';box.innerHTML='<div class="empty-panel">Searching ARB database…</div>';
        try { let q=state.db.from('arbo_member_search_v').select('*').limit(30);const safeTerm=term.replace(/[(),]/g,' ').replaceAll('%','\\%').replaceAll('_','\\_');if(field==='arb_id')q=q.eq(field,term);else if(field==='any'){const fields=['display_name','municipalities','barangays','cloa_numbers','sequence_no','arb_id','landowners','claim_numbers','survey_numbers','lot_numbers','ep_cloa_serial_numbers','cocrom_numbers','district'];q=q.or(fields.map(name=>`${name}.ilike.%${safeTerm}%`).join(','));}else q=q.ilike(field,'%'+safeTerm+'%'); const r=await q;if(r.error)throw r.error;box.innerHTML=r.data?.length?r.data.map(c=>`<div class="picker-row"><div><strong>${val(c.display_name)}</strong> ${badge('ARB','green')}<small>Sequence: ${val(c.sequence_no)} · Municipality: ${val(c.municipalities)} · Barangay: ${val(c.barangays)} · CLOA/Title: ${val(c.cloa_numbers)}</small></div><button class="btn btn-success btn-sm" type="button" data-select-member="${esc(c.arb_profile_id)}">Select</button></div>`).join(''):'<div class="empty-panel">No ARB matched. Use Non-ARB only if the person is not an ARB.</div>'; state.lastMemberCandidates=r.data||[]; }
        catch(e){box.innerHTML=`<div class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</div>`;}
    }
    function selectMemberCandidate(id) { const c=(state.lastMemberCandidates||[]).find(x=>String(x.arb_profile_id)===String(id)); if(!c)return;state.selectedMemberCandidate=c;$('selectedMember').innerHTML=`<div class="selected-person"><strong>Selected ARB:</strong> ${val(c.display_name)}<br><small>${val(c.municipalities)} · ${val(c.barangays)} · CLOA ${val(c.cloa_numbers)}</small></div>`; }
    async function searchValidatorUsers() { const term=$('f_user_search').value.trim(),box=$('validatorSearchResults');if(!term)return;box.style.display='block';box.innerHTML='<div class="empty-panel">Searching users…</div>';try{const pattern='%'+term.replace(/[(),]/g,' ').trim().replaceAll('%','\\%').replaceAll('_','\\_')+'%';const r=await state.db.from('profiles').select('id,full_name,email,role').or('full_name.ilike.'+pattern+',email.ilike.'+pattern).limit(20);if(r.error)throw r.error;state.lastValidatorCandidates=r.data||[];box.innerHTML=r.data?.length?r.data.map(u=>`<div class="picker-row"><div><strong>${val(u.full_name||u.email)}</strong><small>${val(u.email)} · ${val(u.role)}</small></div><button class="btn btn-success btn-sm" type="button" data-select-validator="${esc(u.id)}">Select</button></div>`).join(''):'<div class="empty-panel">No user found.</div>';}catch(e){box.innerHTML=`<div class="empty-panel">${esc(e.message)}</div>`;}}
    function selectValidator(id){const u=(state.lastValidatorCandidates||[]).find(x=>String(x.id)===String(id));if(!u)return;state.selectedValidator=u;$('selectedValidator').innerHTML=`<div class="selected-person"><strong>Selected user:</strong> ${val(u.full_name||u.email)} · ${val(u.email)}</div>`;}

    async function saveEntity(event) {
        event.preventDefault(); const type=$('entityType').value,id=$('entityId').value,isNew=!id; let table,payload;
        try {
            if(type==='arbo'){table='arbo';payload={name:nullIfBlank(formValue('name')),registration_no:nullIfBlank(formValue('registration_no')),municipality:nullIfBlank(formValue('municipality')),barangay:nullIfBlank(formValue('barangay')),address:nullIfBlank(formValue('address')),contact_number:nullIfBlank(formValue('contact_number')),email:nullIfBlank(formValue('email')),chairperson:nullIfBlank(formValue('chairperson')),date_organized:nullIfBlank(formValue('date_organized')),date_registered:nullIfBlank(formValue('date_registered')),status:formValue('status'),is_active:formValue('status')==='ACTIVE',remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='member'){table='arbo_members';let isArb,name,profileId,details={};if(isNew){isArb=formValue('member_type')==='ARB';if(isArb){if(!state.selectedMemberCandidate)throw new Error('Select an ARB from the database.');name=state.selectedMemberCandidate.display_name;profileId=state.selectedMemberCandidate.arb_profile_id;details={municipality:state.selectedMemberCandidate.municipalities,barangay:state.selectedMemberCandidate.barangays,cloa_reference:state.selectedMemberCandidate.cloa_numbers};}else{name=nullIfBlank($('manualMemberName').value);if(!name)throw new Error('Enter the non-ARB member name.');profileId=null;}}else{const old=findRecord('member',id);isArb=old.is_arb;name=old.arb_name;profileId=old.profile_id;details={municipality:old.municipality,barangay:old.barangay,cloa_reference:old.cloa_reference};}payload={arbo_id:currentId(),profile_id:profileId,arb_name:name,is_arb:isArb,position:'Member',date_from:formValue('date_from'),date_to:nullIfBlank(formValue('date_to')),membership_no:nullIfBlank(formValue('membership_no')),membership_status:formValue('membership_status'),subscribed_capital:Number(formValue('subscribed_capital'))||0,remarks:nullIfBlank(formValue('remarks')),...details};}
            if(type==='officer'){table='arbo_officer_terms';payload={arbo_id:currentId(),membership_id:formValue('membership_id'),position:nullIfBlank(formValue('position')),date_assumed:formValue('date_assumed'),term_end_date:nullIfBlank(formValue('term_end_date')),actual_end_date:nullIfBlank(formValue('actual_end_date')),term_status:formValue('term_status'),election_reference:nullIfBlank(formValue('election_reference')),remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='machinery'){table='arbo_machinery';const operating=formValue('operating_status');const legacyStatus={'AVAILABLE':'Operational','IN USE':'Operational','RENTED OUT':'Rented Out','OUT OF SERVICE':'Broken','DISPOSED':'Disposed'}[operating]||'Operational';payload={arbo_id:currentId(),equipment_name:nullIfBlank(formValue('equipment_name')),machinery_code:nullIfBlank(formValue('machinery_code')),machinery_type:nullIfBlank(formValue('machinery_type')),brand:nullIfBlank(formValue('brand')),model:nullIfBlank(formValue('model')),serial_no:nullIfBlank(formValue('serial_no')),engine_no:nullIfBlank(formValue('engine_no')),date_release:nullIfBlank(formValue('date_release')),acquisition_source:nullIfBlank(formValue('acquisition_source')),acquisition_reference:nullIfBlank(formValue('acquisition_reference')),acquisition_cost:Number(formValue('acquisition_cost'))||null,current_location:nullIfBlank(formValue('current_location')),condition_status:formValue('condition_status'),operating_status:operating,status:legacyStatus,last_maintenance_date:nullIfBlank(formValue('last_maintenance_date')),next_maintenance_date:nullIfBlank(formValue('next_maintenance_date')),maintenance_interval_days:Number(formValue('maintenance_interval_days'))||null,remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='service'){table='arbo_machinery_services';payload={arbo_id:currentId(),machinery_id:formValue('machinery_id'),service_type:formValue('service_type'),service_status:formValue('service_status'),reported_on:nullIfBlank(formValue('reported_on')),scheduled_date:nullIfBlank(formValue('scheduled_date')),service_date:nullIfBlank(formValue('service_date')),completion_date:nullIfBlank(formValue('completion_date')),next_maintenance_date:nullIfBlank(formValue('next_maintenance_date')),service_provider:nullIfBlank(formValue('service_provider')),service_cost:Number(formValue('service_cost'))||0,issue_description:nullIfBlank(formValue('issue_description')),work_performed:nullIfBlank(formValue('work_performed')),parts_replaced:nullIfBlank(formValue('parts_replaced')),remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='income'){table='arbo_income';const gross=Number(formValue('gross_income'))||0,expenses=Number(formValue('expenses'))||0,isRental=formValue('income_type')==='MACHINERY RENTAL';payload={arbo_id:currentId(),income_type:formValue('income_type'),activity_type:nullIfBlank(formValue('activity_type')),source:formValue('income_type'),date:formValue('date'),description:nullIfBlank(formValue('description')),reference_no:nullIfBlank(formValue('reference_no')),customer_name:nullIfBlank(formValue('customer_name')),gross_income:gross,expenses,net_income:gross-expenses,amount:gross-expenses,payment_status:formValue('payment_status'),machinery_id:isRental?nullIfBlank(formValue('machinery_id')):null,rental_start_date:isRental?nullIfBlank(formValue('rental_start_date')):null,rental_end_date:isRental?nullIfBlank(formValue('rental_end_date')):null,rental_hours:isRental?(Number(formValue('rental_hours'))||null):null,remarks:nullIfBlank(formValue('remarks'))};if(isRental&&!payload.machinery_id)throw new Error('Select the machinery rented.');}
            if(type==='capital'){table='arbo_capital_transactions';payload={arbo_id:currentId(),membership_id:formValue('membership_id'),transaction_date:formValue('transaction_date'),transaction_type:formValue('transaction_type'),amount:Number(formValue('amount'))||0,official_receipt_no:nullIfBlank(formValue('official_receipt_no')),reference_no:nullIfBlank(formValue('reference_no')),remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='activity'){table='arbo_activities';payload={arbo_id:currentId(),activity_name:nullIfBlank(formValue('activity_name')),activity_type:formValue('activity_type'),training_date:nullIfBlank(formValue('training_date')),location:nullIfBlank(formValue('location')),facilitator:nullIfBlank(formValue('facilitator')),arb_attendees:nullIfBlank(formValue('arb_attendees')),non_arb_attendees:nullIfBlank(formValue('non_arb_attendees')),total_cost:Number(formValue('total_cost'))||0,remarks:nullIfBlank(formValue('remarks'))};}
            if(type==='validator'){table='arbo_validators';const old=id?findRecord('validator',id):null;if(!id&&!state.selectedValidator)throw new Error('Select an authenticated user.');payload={arbo_id:currentId(),validator_user_id:id?old.validator_user_id:state.selectedValidator.id,validator_name:id?old.validator_name:(state.selectedValidator.full_name||state.selectedValidator.email),assigned_from:formValue('assigned_from'),assigned_until:nullIfBlank(formValue('assigned_until')),is_active:formValue('is_active')==='true',remarks:nullIfBlank(formValue('remarks'))};}
            recordAudit(payload,isNew); const result=isNew?await state.db.from(table).insert(payload):await state.db.from(table).update(payload).eq('id',id); if(result.error)throw result.error;
            if(type==='service'){const update={updated_at:new Date().toISOString(),updated_by:state.user.id};if(payload.service_status==='COMPLETED'){update.last_maintenance_date=payload.completion_date||payload.service_date||today();update.next_maintenance_date=payload.next_maintenance_date;if(payload.service_type==='REPAIR'){update.repair_status='COMPLETED';update.condition_status='SERVICEABLE';update.operating_status='AVAILABLE';}}else if(payload.service_type==='REPAIR'){update.repair_status=payload.service_status;update.condition_status='NEEDS REPAIR';update.operating_status='OUT OF SERVICE';}await state.db.from('arbo_machinery').update(update).eq('id',payload.machinery_id);}
            closeModal(); if(type==='arbo'){await loadArbos();if(state.currentArbo&&String(state.currentArbo.id)===String(id))await openArbo(id);}else await openArbo(currentId());
        } catch(e) { alert('Unable to save: '+e.message); }
    }

    function printCurrent() { const a=state.currentArbo;$('printHeading').textContent='ARBO Cooperative Management Report — '+a.name;$('printSubheading').textContent=[a.barangay,a.municipality,'Generated '+new Date().toLocaleString('en-PH')].filter(Boolean).join(' · ');$('printBody').innerHTML=$('workspaceKpis').outerHTML+$('workspaceBody').innerHTML;window.print(); }

    document.addEventListener('click',e=>{
        const open=e.target.closest('[data-open-arbo]'); if(open)openArbo(open.dataset.openArbo);
        const tab=e.target.closest('[data-tab]'); if(tab){state.activeTab=tab.dataset.tab;renderWorkspace();}
        const add=e.target.closest('[data-add]'); if(add)openForm(add.dataset.add);
        const edit=e.target.closest('[data-edit]'); if(edit)openForm(edit.dataset.edit,edit.dataset.id);
        const service=e.target.closest('[data-add-service]'); if(service)openForm('service','',{machinery_id:service.dataset.addService});
        const member=e.target.closest('[data-select-member]'); if(member)selectMemberCandidate(member.dataset.selectMember);
        const validator=e.target.closest('[data-select-validator]'); if(validator)selectValidator(validator.dataset.selectValidator);
    });
    $('applyArboSearch').addEventListener('click',()=>{state.arboPage=0;loadArbos();});
    ['searchArbo','searchMunicipality','searchBarangay'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){state.arboPage=0;loadArbos();}}));
    $('previousArboPage').addEventListener('click',()=>{state.arboPage=Math.max(0,state.arboPage-1);loadArbos();});
    $('nextArboPage').addEventListener('click',()=>{state.arboPage++;loadArbos();});
    $('addArboBtn').addEventListener('click',()=>openForm('arbo'));
    $('editCurrentArbo').addEventListener('click',()=>openForm('arbo',currentId(),state.currentArbo));
    $('printCurrentArbo').addEventListener('click',printCurrent);
    $('closeWorkspace').addEventListener('click',()=>{$('cooperativeWorkspace').style.display='none';state.currentArbo=null;});
    $('closeEntityModal').addEventListener('click',closeModal); $('cancelEntity').addEventListener('click',closeModal); $('entityForm').addEventListener('submit',saveEntity);
    $('entityModal').addEventListener('click',e=>{if(e.target===$('entityModal'))closeModal();});

    try {
        state.db=resolveClient(); if(!state.db)throw new Error('Supabase client configuration was not found.');
        const auth=await state.db.auth.getUser(); if(auth.error||!auth.data?.user){location.href='login.html';return;} state.user=auth.data.user;
        const p=await state.db.from('profiles').select('*').eq('id',state.user.id).single(); if(p.error)throw p.error; state.profile=p.data;
        await buildNavbar(state.profile,auth.data); $('addArboBtn').style.display=isManager()?'inline-flex':'none'; await loadArbos();
    } catch(e) { $('arboTableBody').innerHTML=`<tr><td colspan="7" class="empty-panel" style="color:#b91c1c;">${esc(e.message)}</td></tr>`; }
})();
</script>
