<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
</head>
<body>
<div class="container">
    <h1>🏛️ ARB Global Cleansing <small>ARBO Management</small></h1>
    
    <nav class="nav" id="mainNav"></nav>

    <div class="section">
        <div class="toolbar">
            <input type="text" id="searchArbo" placeholder="🔍 Search ARBO Name or Municipality..." oninput="loadArbos()" />
            <button class="btn btn-primary" id="addArboBtn" onclick="openArboModal()">➕ Add New ARBO</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>ARBO Name</th>
                        <th>Barangay</th>
                        <th>Municipality</th>
                        <th>Contact</th>
                        <th style="width: 100px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="arboTableBody"><tr><td colspan="6" class="empty-msg">⏳ Loading records...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div id="arboModal" class="modal">
    <div class="modal-content">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 id="arboModalTitle">➕ Add New ARBO</h2>
        <form id="arboForm" onsubmit="saveArbo(event)">
            <input type="hidden" id="arboId" />
            <div class="form-grid full">
                <div><label>ARBO Name *</label><input id="arboName" required placeholder="Enter official ARBO name" /></div>
            </div>
            <div class="form-grid">
                <div><label>Barangay</label><input id="arboBarangay" placeholder="e.g. San Jose" /></div>
                <div><label>Municipality</label><input id="arboMunicipality" placeholder="e.g. Quezon City" /></div>
                <div><label>Contact Number</label><input id="arboContact" placeholder="09XX-XXX-XXXX" /></div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" onclick="closeModal('arboModal')">Cancel</button>
                <button type="submit" class="btn btn-success">💾 Save ARBO</button>
            </div>
        </form>
    </div>
</div>

<script>
    (async function() {
        
        window.onerror = function(msg, url, line) {
            console.error(`[CRITICAL CRASH] Line ${line}: ${msg}`);
            const tbody = document.getElementById('arboTableBody');
            if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center; padding: 20px;">❌ Script Crash: ${msg}</td></tr>`;
            return false;
        };

        function safeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[match]));
        }

        try {
            if (typeof window.supabase === 'undefined') throw new Error("Supabase CDN script failed to load.");

            const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
            const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            // ====================================================================
            // AUTHENTICATION CHECK
            // ====================================================================
            const { data: authData, error: authErr } = await dbClient.auth.getUser();
            if (authErr || !authData || !authData.user) {
                window.location.href = 'dashboard.html';
                return;
            }

            const { data: profile, error: profErr } = await dbClient
                .from('profiles')
                .select('*')
                .eq('id', authData.user.id)
                .single();

            if (profErr || !profile || (profile.role !== 'admin' && profile.role !== 'staff')) {
                window.location.href = 'dashboard.html';
                return;
            }

            window.currentProfile = profile;
            
            // ====================================================================
            // DYNAMIC NAVBAR BUILDER
            // ====================================================================
            async function buildNavbar(userProfile, authData) {
                const navEl = document.getElementById('mainNav');
                if (!navEl) return;
                
                const { data: navItems } = await dbClient.from('system_navigation').select('*').order('id', { ascending: true });
                const curPath = window.location.pathname;
                
                const links = navItems && navItems.length > 0 ? navItems : [
                    { label: 'Dashboard', url: '/dashboard.html', icon: '📊' },
                    { label: 'ARBO Management', url: '/arbo.html', icon: '🏢' },
                    { label: 'ARB Management', url: '/arb.html', icon: '👤' },
                    { label: 'Validators', url: '/validators.html', icon: '✅' },
                    { label: 'Reports', url: '/reports.html', icon: '📈' }
                ];

                // STRICT MENU DEDUPLICATION
                const uniqueLinks = [];
                const seenLabels = new Set();
                for (const item of links) {
                    if (!seenLabels.has(item.label)) {
                        seenLabels.add(item.label);
                        uniqueLinks.push(item);
                    }
                }

                let html = uniqueLinks.map(l => {
                    const linkTarget = (l.url || '').replace('/', '');
                    const isActive = curPath.includes(linkTarget) && linkTarget !== '' ? 'active' : '';
                    return `<a href="${l.url}" class="${isActive}">${l.icon || ''} ${l.label}</a>`;
                }).join('');

                // STRICT NAME DISPLAY
                if (userProfile && authData) {
                    const displayName = userProfile.full_name && userProfile.full_name.trim() !== '' 
                        ? userProfile.full_name 
                        : authData.user.email;
                        
                    html += `<span class="user-badge" style="margin-left: auto; color: #0a3d62; font-weight: 600;">👤 ${displayName} (${userProfile.role})</span>`;
                    html += `<span class="logout-link" id="navLogoutBtn" style="color: #b91c1c; font-weight: 600; margin-left: 10px; cursor: pointer;">🚪 Logout</span>`;
                }
                
                navEl.innerHTML = html;

                document.getElementById('navLogoutBtn')?.addEventListener('click', async () => {
                    await dbClient.auth.signOut();
                    window.location.href = 'login.html';
                });
            }

            await buildNavbar(profile, authData);

            // ====================================================================
            // PAGE LOGIC
            // ====================================================================
            window.loadArbos = async function() {
                try {
                    const search = document.getElementById('searchArbo').value.trim();
                    let query = dbClient.from('arbo').select('*');
                    
                    if (search) query = query.ilike('name', `%${search}%`);
                    
                    const { data, error } = await query.order('id', { ascending: false });
                    if (error) throw new Error(error.message);
                    
                    const tbody = document.getElementById('arboTableBody');
                    
                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">📭 No ARBO records found.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = data.map(a => `
                        <tr>
                            <td style="font-family: monospace; color: #64748b;">${(a.id || '-').toString().substring(0,6)}</td>
                            <td style="font-weight: 600; color: #0a3d62;">${safeHtml(a.name)}</td>
                            <td>${safeHtml(a.barangay) || '-'}</td>
                            <td>${safeHtml(a.municipality) || '-'}</td>
                            <td>${safeHtml(a.contact_number) || '-'}</td>
                            <td class="actions">
                                <button class="btn btn-warning btn-sm" onclick="editArbo(${a.id})" title="Edit">✏️</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteArbo(${a.id})" title="Delete">🗑️</button>
                            </td>
                        </tr>
                    `).join('');
                } catch (err) {
                    document.getElementById('arboTableBody').innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center; padding: 20px;">❌ Error loading data: ${err.message}</td></tr>`;
                }
            };

            window.openArboModal = function() {
                document.getElementById('arboId').value = '';
                document.getElementById('arboForm').reset();
                document.getElementById('arboModalTitle').textContent = '➕ Add New ARBO';
                const m = document.getElementById('arboModal');
                if (m) m.classList.add('active');
            };

            window.closeModal = function(modalId) {
                const m = document.getElementById(modalId);
                if (m) m.classList.remove('active');
            };

            document.getElementById('closeModalBtn')?.addEventListener('click', () => window.closeModal('arboModal'));
            document.getElementById('arboModal')?.addEventListener('click', function(e) {
                if (e.target === this) window.closeModal('arboModal');
            });

            window.editArbo = async function(id) {
                try {
                    const { data, error } = await dbClient.from('arbo').select('*').eq('id', id).single();
                    if (error) throw new Error(error.message);
                    
                    document.getElementById('arboId').value = data.id;
                    document.getElementById('arboName').value = data.name || '';
                    document.getElementById('arboBarangay').value = data.barangay || '';
                    document.getElementById('arboMunicipality').value = data.municipality || '';
                    document.getElementById('arboContact').value = data.contact_number || '';
                    document.getElementById('arboModalTitle').textContent = '✏️ Edit ARBO';
                    
                    const m = document.getElementById('arboModal');
                    if (m) m.classList.add('active');
                } catch (err) {
                    alert(`Error loading ARBO details: ${err.message}`);
                }
            };

            window.saveArbo = async function(e) {
                e.preventDefault(); 
                try {
                    const id = document.getElementById('arboId').value;
                    const payload = {
                        name: document.getElementById('arboName').value.trim(),
                        barangay: document.getElementById('arboBarangay').value.trim(),
                        municipality: document.getElementById('arboMunicipality').value.trim(),
                        contact_number: document.getElementById('arboContact').value.trim(),
                    };
                    
                    let result;
                    if (id) {
                        result = await dbClient.from('arbo').update(payload).eq('id', id);
                    } else {
                        result = await dbClient.from('arbo').insert([payload]);
                    }
                    
                    if (result.error) throw new Error(result.error.message);
                    
                    window.closeModal('arboModal');
                    window.loadArbos(); 
                } catch (err) {
                    alert(`Error saving ARBO: ${err.message}`);
                }
            };

            window.deleteArbo = async function(id) {
                if (!confirm('Are you sure you want to delete this ARBO?\nAny ARBs linked to it will have their ARBO set to NULL.')) return;
                
                try {
                    const { error } = await dbClient.from('arbo').delete().eq('id', id);
                    if (error) throw new Error(error.message);
                    
                    window.loadArbos(); 
                } catch (err) {
                    alert(`Error deleting ARBO: ${err.message}`);
                }
            };

            window.loadArbos();

        } catch (fatalErr) {
            console.error("Fatal Page Error:", fatalErr);
            document.getElementById('arboTableBody').innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center; padding: 20px;">❌ Critical Page Error: ${fatalErr.message}</td></tr>`;
        }
    })();
</script>
</body>
</html>
