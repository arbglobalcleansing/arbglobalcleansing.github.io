<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBO Cooperative Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <style>
        :root { --arbo-navy:#0a3d62; --arbo-blue:#1769a0; --arbo-green:#15803d; --arbo-red:#b91c1c; --arbo-amber:#b45309; --arbo-line:#dbe3ea; --arbo-soft:#f8fafc; }
        .arbo-master-toolbar { display:grid; grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(140px,.7fr)) auto; gap:10px; align-items:end; margin-bottom:15px; }
        .arbo-master-toolbar label { display:block; margin-bottom:5px; color:#475569; font-size:.76rem; font-weight:700; text-transform:uppercase; }
        .arbo-input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:7px; background:white; color:#0f172a; font:inherit; box-sizing:border-box; }
        .arbo-input:focus { outline:none; border-color:var(--arbo-blue); box-shadow:0 0 0 3px rgba(23,105,160,.1); }
        .arbo-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin:18px 0; }
        .arbo-kpi { padding:14px; border:1px solid var(--arbo-line); border-radius:10px; background:white; box-shadow:0 3px 10px rgba(15,23,42,.04); }
        .arbo-kpi span { display:block; color:#64748b; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.035em; }
        .arbo-kpi strong { display:block; margin-top:5px; color:var(--arbo-navy); font-size:1.35rem; }
        .workspace { margin-top:24px; overflow:hidden; border:1px solid var(--arbo-line); border-radius:12px; background:white; box-shadow:0 10px 28px rgba(15,23,42,.08); }
        .workspace-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:20px; border-bottom:1px solid var(--arbo-line); background:linear-gradient(135deg,#fff,#f2f8fc); }
        .workspace-header h2 { margin:0 0 5px; color:var(--arbo-navy); }
        .workspace-header p { margin:0; color:#64748b; }
        .workspace-actions { display:flex; flex-wrap:wrap; gap:8px; }
        .workspace-tabs { display:flex; gap:4px; overflow:auto; padding:8px 10px 0; border-bottom:1px solid var(--arbo-line); background:#f8fafc; }
        .workspace-tab { flex:0 0 auto; padding:10px 12px; border:0; border-bottom:3px solid transparent; background:transparent; color:#475569; font-weight:700; cursor:pointer; }
        .workspace-tab.active { border-bottom-color:var(--arbo-blue); color:var(--arbo-navy); background:white; }
        .module-subtabs { margin:0 0 18px; padding:5px 7px 0; border:1px solid var(--arbo-line); border-radius:9px; background:#f8fafc; }
        .module-subtabs .workspace-tab { padding:8px 10px; font-size:.78rem; }
        .workspace-body { min-height:280px; padding:18px; }
        .module-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:13px; }
        .module-heading h3 { margin:0; color:var(--arbo-navy); }
        .module-note { margin:3px 0 0; color:#64748b; font-size:.82rem; }
        .module-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .data-table-wrap { width:100%; overflow:auto; border:1px solid var(--arbo-line); border-radius:8px; }
        .data-table { width:100%; min-width:900px; border-collapse:collapse; }
        .data-table th,.data-table td { padding:10px; border-bottom:1px solid #e8edf2; text-align:left; vertical-align:top; }
        .data-table th { background:#f8fafc; color:#475569; font-size:.76rem; text-transform:uppercase; letter-spacing:.025em; }
        .data-table tr:last-child td { border-bottom:0; }
        .data-table tbody tr:hover { background:#fbfdff; }
        .arbo-name{color:#003f70;font-weight:normal;text-transform:uppercase;line-height:1.35}
        .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:999px; font-size:.7rem; font-weight:800; white-space:nowrap; }
        .badge-green { color:#166534; background:#dcfce7; }
        .badge-red { color:#991b1b; background:#fee2e2; }
        .badge-amber { color:#92400e; background:#fef3c7; }
        .badge-blue { color:#1e40af; background:#dbeafe; }
        .badge-gray { color:#475569; background:#e2e8f0; }
        .due-row { background:#fff7ed !important; }
        .overdue-row { background:#fff1f2 !important; }
        .empty-panel { padding:30px; color:#64748b; text-align:center; }
        .profile-summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .profile-summary-card { padding:15px; border:1px solid var(--arbo-line); border-radius:9px; background:#f8fafc; }
        .profile-summary-card h4 { margin:0 0 10px; color:var(--arbo-navy); }
        .summary-field { display:grid; grid-template-columns:130px 1fr; gap:8px; padding:6px 0; border-bottom:1px dashed #dbe3ea; }
        .summary-field:last-child { border-bottom:0; }
        .summary-field span { color:#64748b; font-size:.8rem; }
        .summary-field strong { overflow-wrap:anywhere; font-size:.85rem; }
        .form-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .form-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
        .field-group { min-width:0; }
        .field-group.full { grid-column:1 / -1; }
        .field-group label { display:block; margin-bottom:5px; color:#334155; font-size:.82rem; font-weight:700; }
        .field-help { display:block; margin-top:4px; color:#64748b; font-size:.75rem; }
        .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
        .picker-results { max-height:250px; overflow:auto; margin-top:10px; border:1px solid var(--arbo-line); border-radius:7px; }
        .picker-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #e8edf2; }
        .picker-row:last-child { border-bottom:0; }
        .picker-row small { display:block; margin-top:3px; color:#64748b; }
        .selected-person { margin-top:10px; padding:10px; border:1px solid #86efac; border-radius:7px; background:#f0fdf4; color:#166534; }
        .picker-row.is-selected { background:#f0fdf4; }
        .picker-check { display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; }
        .picker-check input { width:18px; height:18px; flex:0 0 auto; }
        .selected-bulk { margin-top:14px; border:1px solid #86efac; border-radius:8px; overflow:auto; }
        .selected-bulk h4 { margin:0; padding:10px 12px; color:#166534; background:#f0fdf4; }
        .selected-bulk table { width:100%; min-width:1050px; border-collapse:collapse; }
        .selected-bulk th,.selected-bulk td { padding:8px; border-top:1px solid #dcfce7; text-align:left; vertical-align:top; }
        .selected-bulk th { color:#166534; background:#f7fee7; font-size:.72rem; text-transform:uppercase; }
        .compact-input { min-width:115px; padding:7px 8px; }
        .member-toolbar { display:grid; grid-template-columns:minmax(260px,1fr) auto auto; gap:8px; align-items:center; margin-bottom:12px; }
        .accounting-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
        .accounting-summary > div { padding:12px; border:1px solid var(--arbo-line); border-radius:8px; background:#f8fafc; }
        .accounting-summary span { display:block; color:#64748b; font-size:.72rem; font-weight:700; text-transform:uppercase; }
        .accounting-summary strong { display:block; margin-top:4px; color:var(--arbo-navy); font-size:1.15rem; }
        .voucher-paper { max-width:900px; margin:auto; color:#111827; }
        .voucher-paper h2,.voucher-paper h3 { margin:4px 0; text-align:center; }
        .voucher-grid { display:grid; grid-template-columns:repeat(2,1fr); margin-top:18px; border:1px solid #334155; }
        .voucher-grid > div { min-height:42px; padding:8px; border-right:1px solid #334155; border-bottom:1px solid #334155; }
        .voucher-grid > div:nth-child(2n) { border-right:0; }
        .voucher-grid label { display:block; color:#475569; font-size:.7rem; font-weight:700; text-transform:uppercase; }
        .voucher-signatures { display:grid; grid-template-columns:repeat(3,1fr); gap:28px; margin-top:55px; text-align:center; }
        .voucher-signatures div { padding-top:7px; border-top:1px solid #111827; }
        .access-note { margin:0 0 15px; padding:10px 12px; border-left:4px solid var(--arbo-blue); border-radius:6px; background:#eff6ff; color:#1e3a5f; }
        .warning-note { border-left-color:var(--arbo-amber); background:#fffbeb; color:#78350f; }
        .error-note { border-left-color:var(--arbo-red); background:#fff1f2; color:#881337; }
        .money { white-space:nowrap; font-variant-numeric:tabular-nums; }
        .page-controls { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; }
        .modal-content.coop-modal { width:min(900px,94vw); max-height:92vh; overflow:auto; transition:width .18s ease,height .18s ease,max-height .18s ease; }
        .modal-window-header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px; margin:-2px 0 16px; padding:6px 0 10px; border-bottom:1px solid var(--arbo-line); background:white; }
        .modal-window-header h2 { min-width:0; margin:0; overflow:hidden; color:var(--arbo-navy); text-overflow:ellipsis; white-space:nowrap; }
        .modal-window-controls { display:flex; flex:0 0 auto; gap:6px; }
        .modal-window-control { width:34px; height:30px; display:inline-grid; place-items:center; padding:0; border:1px solid #cbd5e1; border-radius:6px; background:#f8fafc; color:#334155; font-size:1rem; font-weight:800; line-height:1; cursor:pointer; }
        .modal-window-control:hover { border-color:#94a3b8; background:#e2e8f0; }
        .modal-window-control.close-control:hover { border-color:#b91c1c; background:#b91c1c; color:white; }
        #entityModal.is-maximized { padding:8px; }
        #entityModal .coop-modal.is-maximized { width:calc(100vw - 16px); height:calc(100vh - 16px); max-height:calc(100vh - 16px); border-radius:8px; }
        #entityModal.is-minimized { align-items:flex-end; justify-content:flex-end; padding:12px; }
        #entityModal .coop-modal.is-minimized { width:min(430px,calc(100vw - 24px)); height:auto; max-height:58px; overflow:hidden; }
        #entityModal .coop-modal.is-minimized .modal-window-header { margin:0; padding:4px 0 8px; border-bottom:0; }
        #entityModal .coop-modal.is-minimized #entityForm { display:none; }
        #setupWarning { display:none; }
        #printArea.print-measure { display:block !important; position:fixed; left:-12000px; top:0; width:210mm; padding:0; visibility:hidden; }
        .three-copy-sheet { width:210mm; height:297mm; padding:3mm; box-sizing:border-box; display:grid; grid-template-rows:repeat(3,1fr); background:white; }
        .form-copy { min-height:0; overflow:hidden; padding:2mm 3mm; border-bottom:1px dashed #64748b; box-sizing:border-box; position:relative; }
        .form-copy:last-child { border-bottom:0; }
        .copy-label { display:flex; justify-content:space-between; gap:8px; margin-bottom:1mm; padding-bottom:1mm; border-bottom:1px solid #94a3b8; color:#334155; font-size:6.5pt; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
        .copy-content { width:100%; transform-origin:top left; }
        .print-measure .form-copy .voucher-paper { max-width:none; margin:0; font-size:7pt; line-height:1.05; }
        .print-measure .form-copy .voucher-paper h2 { margin:0; font-size:9pt; line-height:1.05; }
        .print-measure .form-copy .voucher-paper h3 { margin:1px 0; font-size:8pt; line-height:1.05; }
        .print-measure .form-copy .voucher-paper p { margin:2px 0; }
        .print-measure .form-copy .voucher-grid { margin-top:2mm; }
        .print-measure .form-copy .voucher-grid > div { min-height:0; padding:2px 4px; }
        .print-measure .form-copy .voucher-signatures { gap:8mm; margin-top:7mm; font-size:6pt; }
        .print-measure .form-copy .data-table { min-width:0; table-layout:fixed; font-size:5.5pt; }
        .print-measure .form-copy .data-table th,.print-measure .form-copy .data-table td { padding:1px 2px; line-height:1.05; }
        @page { size:A4 portrait; margin:0; }
        @media print {
            html,body { width:210mm; min-height:297mm; margin:0 !important; padding:0 !important; background:white; }
            body > * { display:none !important; }
            #printArea { display:block !important; position:absolute; inset:0; width:210mm; padding:5mm; box-sizing:border-box; background:white; }
            #printArea.three-copy-mode { padding:0; }
            #printArea.three-copy-mode > #printHeading,#printArea.three-copy-mode > #printSubheading { display:none !important; }
            .three-copy-sheet { width:210mm; height:297mm; padding:3mm; box-sizing:border-box; }
            .form-copy .voucher-paper { max-width:none; margin:0; font-size:7pt; line-height:1.05; }
            .form-copy .voucher-paper h2 { margin:0; font-size:9pt; line-height:1.05; }
            .form-copy .voucher-paper h3 { margin:1px 0; font-size:8pt; line-height:1.05; }
            .form-copy .voucher-paper p { margin:2px 0; }
            .form-copy .voucher-grid { margin-top:2mm; }
            .form-copy .voucher-grid > div { min-height:0; padding:2px 4px; }
            .form-copy .voucher-grid label { font-size:5.5pt; }
            .form-copy .voucher-signatures { gap:8mm; margin-top:7mm; font-size:6pt; }
            .form-copy .data-table-wrap { overflow:visible; border-radius:0; }
            .form-copy .data-table { min-width:0; table-layout:fixed; font-size:5.5pt; }
            .form-copy .data-table th,.form-copy .data-table td { padding:1px 2px; line-height:1.05; overflow-wrap:anywhere; }
            .form-copy .data-table th { font-size:5pt; }
            .form-copy .badge { padding:1px 3px; font-size:5pt; }
        }
        @media (max-width:1050px) { .arbo-master-toolbar { grid-template-columns:repeat(2,1fr); } .arbo-kpis { grid-template-columns:repeat(3,1fr); } .profile-summary-grid { grid-template-columns:1fr; } }
        @media (max-width:700px) { .arbo-master-toolbar,.form-grid-2,.form-grid-3,.member-toolbar { grid-template-columns:1fr; } .arbo-kpis { grid-template-columns:repeat(2,1fr); } .workspace-header { flex-direction:column; } .field-group.full { grid-column:auto; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️ ARB Global Cleansing <small>ARBO Management</small></h1>
    <nav class="nav" id="mainNav"></nav>

    <div id="setupWarning" class="access-note error-note"></div>

    <section class="section" id="arboListSection">
        <div class="module-heading">
            <div>
                <h2 style="margin:0;color:#0a3d62;">Cooperative Management System</h2>
                <p class="module-note">Only ARBOs permitted by your account are displayed.</p>
            </div>
            <div class="module-actions">
                <button class="btn btn-primary" id="addArboBtn" type="button">➕ Add ARBO</button>
            </div>
        </div>

        <div class="arbo-kpis" id="masterKpis"></div>

        <div class="arbo-master-toolbar">
            <div><label for="searchArbo">ARBO name</label><input class="arbo-input" id="searchArbo" placeholder="Search cooperative name"></div>
            <div><label for="searchMunicipality">Municipality</label><input class="arbo-input" id="searchMunicipality" placeholder="All municipalities"></div>
            <div><label for="searchBarangay">Barangay</label><input class="arbo-input" id="searchBarangay" placeholder="All barangays"></div>
            <div><label for="searchStatus">Status</label><select class="arbo-input" id="searchStatus"><option value="">All</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div>
            <button class="btn btn-primary" id="applyArboSearch" type="button">Search</button>
        </div>

        <div class="data-table-wrap">
            <table class="data-table">
                <thead><tr><th>ID</th><th>ARBO</th><th>Municipality</th><th>Barangay</th><th>Contact</th><th>CDA Renewal</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="arboTableBody"><tr><td colspan="8" class="empty-panel">Loading accessible ARBOs…</td></tr></tbody>
            </table>
        </div>
        <div class="page-controls"><button class="btn btn-primary" id="previousArboPage" type="button">Previous</button><span id="arboPageInfo">Page 1</span><button class="btn btn-primary" id="nextArboPage" type="button">Next</button></div>
    </section>

    <section class="workspace" id="cooperativeWorkspace" style="display:none;">
        <header class="workspace-header">
            <div><h2 id="workspaceTitle">ARBO</h2><p id="workspaceSubtitle"></p></div>
            <div class="workspace-actions"><button class="btn btn-warning" id="editCurrentArbo" type="button">✏️ Edit ARBO</button><button class="btn btn-info" id="openReportCenter" type="button">📊 Reports & Forms</button><button class="btn btn-primary" id="printCurrentArbo" type="button">🖨️ Print Module</button><button class="btn btn-danger" id="deleteCurrentArbo" type="button" style="display:none;">🗑️ Delete ARBO</button><button class="btn btn-danger" id="closeWorkspace" type="button">Close</button></div>
        </header>
        <div id="cdaRenewalAlert" class="access-note warning-note" style="display:none;margin:14px 18px 0;"></div>
        <div class="arbo-kpis" id="workspaceKpis"></div>
        <nav class="workspace-tabs" id="workspaceTabs"></nav>
        <div class="workspace-body" id="workspaceBody"><div class="empty-panel">Select an ARBO.</div></div>
    </section>
</div>

<div id="entityModal" class="modal">
    <div class="modal-content coop-modal">
        <div class="modal-window-header">
            <h2 id="entityModalTitle">Add record</h2>
            <div class="modal-window-controls" aria-label="Popup window controls">
                <button class="modal-window-control" id="minimizeEntityModal" type="button" title="Minimize" aria-label="Minimize popup">&minus;</button>
                <button class="modal-window-control" id="maximizeEntityModal" type="button" title="Maximize" aria-label="Maximize popup">&#9633;</button>
                <button class="modal-window-control close-control" id="closeEntityModal" type="button" title="Close" aria-label="Close popup">&times;</button>
            </div>
        </div>
        <form id="entityForm">
            <input type="hidden" id="entityType"><input type="hidden" id="entityId">
            <div id="entityFormBody"></div>
            <div class="form-actions"><button class="btn btn-danger" id="cancelEntity" type="button">Cancel</button><button class="btn btn-success" id="saveEntity" type="submit">💾 Save</button></div>
        </form>
    </div>
</div>

<div id="printArea" style="display:none;"><h2 id="printHeading"></h2><p id="printSubheading"></p><div id="printBody"></div></div>

<script>
(async function () {
    'use strict';
    const PAGE_SIZE = 50;
    const state = {
        db:null, user:null, profile:null, arboPage:0, arboCount:0,
        currentArbo:null, activeTab:'overview', accountingView:'overview', loanView:'accounts', selectedMemberCandidate:null, selectedValidator:null,
        pendingArboValidators:new Map(), arboValidatorCandidates:[],
        selectedBulkMembers:new Map(), selectedLinkedMember:null, memberSearch:'', memberPage:0, memberPageSize:100,
        arbSearchTimer:null,
        data:{ members:[], officers:[], machinery:[], services:[], income:[], expenses:[], capital:[], capitalPlans:[], capitalSchedules:[], capitalReminders:[], openingCapital:[], openingBatches:[], openingLines:[], loans:[], loanProducts:[], loanSchedules:[], loanPayments:[], loanReminders:[], capitalOffsets:[], patronage:[], surplusDeclarations:[], surplusDistributions:[], activities:[], validators:[], accounts:[], vouchers:[], journals:[], journalLines:[], inventoryItems:[], inventoryTx:[], fixedAssets:[], depreciation:[], issuedChecks:[] }
    };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const blank = (v) => v === null || v === undefined || String(v).trim() === '';
    const val = (v) => blank(v) ? '—' : esc(v);
    const nullIfBlank = (v) => blank(v) ? null : String(v).trim();
    const money = (v) => '₱' + (Number(v) || 0).toLocaleString('en-PH', {minimumFractionDigits:2,maximumFractionDigits:2});
    const dateOnly = (v) => v ? String(v).slice(0,10) : '';
    const formatDate = (v) => { if (!v) return '—'; const d=new Date(String(v).length===10?v+'T00:00:00':v); return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}); };
    const badge = (text, kind='gray') => `<span class="badge badge-${kind}">${val(text)}</span>`;
    const role = () => String(state.profile?.role || '').toLowerCase();
    const isManager = () => ['admin','staff','ltsp','ltsp personnel'].includes(role());
    const isArboAdmin = () => role()==='arbo admin';
    const isSystemAdmin = () => role()==='admin';
    const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const addMonths = (value,months) => { if(!value)return '';const d=new Date(dateOnly(value)+'T00:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(months||0));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const cdaExpiry = (a) => dateOnly(a?.cda_registration_expiry||a?.cda_expiry_date||a?.cda_expiry||a?.registration_expiry)||addMonths(a?.cda_last_renewal_date||a?.date_registered,Number(a?.cda_validity_months)||12);
    const cdaRenewalStatus = (a) => { const expiry=cdaExpiry(a);if(!expiry)return {text:'NOT SET',kind:'gray',days:null,expiry:''};const days=Math.ceil((new Date(expiry+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000),lead=Number(a.cda_renewal_lead_days)||60;return days<0?{text:'EXPIRED',kind:'red',days,expiry}:days<=lead?{text:'DUE SOON',kind:'amber',days,expiry}:{text:'CURRENT',kind:'green',days,expiry}; };
    const birCteExpiry = (a) => dateOnly(a?.bir_cte_expiry_date)||addMonths(a?.bir_cte_issue_date,60);

    async function safeArboQuery(table,orderColumn) {
        const rows=[]; const chunkSize=1000; let from=0;
        while(true){
            let q=state.db.from(table).select('*').eq('arbo_id',currentId()).range(from,from+chunkSize-1);
            if(orderColumn)q=q.order(orderColumn,{ascending:false});
            const r=await q;if(r.error)throw r.error;rows.push(...(r.data||[]));
            if(!r.data||r.data.length<chunkSize)break;from+=chunkSize;
        }
        return rows;
    }

    function findRecord(type,id) { const key={member:'members',officer:'officers',machinery:'machinery',service:'services',income:'income',expense:'expenses',capital:'capital',loan_status:'loans',loan_product:'loanProducts',patronage:'patronage',activity:'activities',validator:'validators',account:'accounts',voucher:'vouchers',inventory_item:'inventoryItems',inventory_tx:'inventoryTx',fixed_asset:'fixedAssets',issued_check:'issuedChecks'}[type]; return byId(state.data[key]||[],id)||{}; }

    function accountOptions(selected='') { return state.data.accounts.filter(a=>a.is_active||String(a.id)===String(selected)).map(a=>`<option value="${esc(a.id)}"${String(a.id)===String(selected)?' selected':''}>${esc(a.account_code+' — '+a.account_name)}</option>`).join(''); }

    function inventoryItemOptions(selected='') {return state.data.inventoryItems.filter(i=>i.is_active||String(i.id)===String(selected)).map(i=>`<option value="${esc(i.id)}"${String(i.id)===String(selected)?' selected':''}>${esc(i.item_code+' — '+i.item_name)}</option>`).join('');}
    function fixedAssetOptions(selected='') {return state.data.fixedAssets.filter(a=>a.status!=='DISPOSED'||String(a.id)===String(selected)).map(a=>`<option value="${esc(a.id)}"${String(a.id)===String(selected)?' selected':''}>${esc(a.asset_code+' — '+a.asset_name)}</option>`).join('');}
