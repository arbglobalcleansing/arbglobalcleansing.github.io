<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – ARB Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body { background:#f0f4f8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .login-container {
            max-width:400px; width:100%; background:white; padding:40px; border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1); border-top:5px solid #e8a317;
        }
        h1 { color:#0a3d62; text-align:center; margin-bottom:5px; }
        .subtitle { text-align:center; color:#64748b; margin-bottom:25px; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-weight:600; margin-bottom:5px; color:#1e293b; }
        input {
            width:100%; padding:10px 14px; border:1px solid #cbd5e1; border-radius:6px;
            font-size:1rem; transition:0.2s;
        }
        input:focus { outline:none; border-color:#0a3d62; box-shadow:0 0 0 3px rgba(10,61,98,0.15); }
        .btn {
            width:100%; padding:12px; border:none; border-radius:6px; font-size:1rem;
            font-weight:600; cursor:pointer; transition:0.2s; background:#0a3d62; color:white;
        }
        .btn:hover { background:#062b47; }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }
        .msg {
            padding:12px; border-radius:6px; margin-bottom:15px; display:none;
            font-weight:500; font-size:0.95rem;
        }
        .msg-error { color:#991b1b; background:#fee2e2; border-left:4px solid #b91c1c; }
        .msg-success { color:#155724; background:#d4edda; border-left:4px solid #28a745; }
        .msg-info { color:#0c5460; background:#d1ecf1; border-left:4px solid #17a2b8; }
        .debug {
            margin-top:20px; padding:12px; background:#1e1e1e; color:#d4d4d4;
            border-radius:6px; font-family:monospace; font-size:12px; max-height:150px;
            overflow-y:auto; white-space:pre-wrap;
        }
        .debug-toggle {
            margin-top:10px; background:transparent; border:none; color:#0a3d62;
            cursor:pointer; font-size:0.85rem; text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>🏛️ ARB Monitoring</h1>
    <p class="subtitle">Department of Agrarian Reform</p>

    <div id="status" class="msg msg-info">Please enter your credentials.</div>

    <form id="loginForm">
        <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" required placeholder="your.email@example.com">
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" id="loginBtn" class="btn">🔐 Sign In</button>
    </form>

    <button class="debug-toggle" onclick="toggleDebug()">📋 Show debug log</button>
    <div id="debugBox" class="debug" style="display:none;"></div>
</div>

<script>
    // ============================================================
    // SUPABASE CONFIG (hardcoded)
    // ============================================================
    const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabaseClient = supabaseClient;

    // ============================================================
    // DOM refs
    // ============================================================
    const status = document.getElementById('status');
    const debugBox = document.getElementById('debugBox');
    const loginBtn = document.getElementById('loginBtn');

    // ============================================================
    // Logging
    // ============================================================
    let debugVisible = false;

    function log(msg, type = 'info') {
        const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
        debugBox.textContent += line + '\n';
        debugBox.scrollTop = debugBox.scrollHeight;
        console.log(msg);

        // Update status box
        status.textContent = msg;
        status.className = 'msg';
        if (type === 'error') status.classList.add('msg-error');
        else if (type === 'success') status.classList.add('msg-success');
        else status.classList.add('msg-info');
        status.style.display = 'block';
    }

    function toggleDebug() {
        debugVisible = !debugVisible;
        debugBox.style.display = debugVisible ? 'block' : 'none';
    }

    // ============================================================
    // Login handler
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            log('❌ Please enter both email and password.', 'error');
            return;
        }

        log('🔐 Attempting login for ' + email, 'info');
        loginBtn.disabled = true;
        loginBtn.textContent = '⏳ Signing in...';

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                log('❌ Login failed: ' + error.message, 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 Sign In';
                return;
            }
            if (data.user) {
                log('✅ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                log('❌ Unexpected response – no user object.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 Sign In';
            }
        } catch (err) {
            log('❌ Error: ' + err.message, 'error');
            loginBtn.disabled = false;
            loginBtn.textContent = '🔐 Sign In';
        }
    });

    // ============================================================
    // Auto‑redirect if already logged in
    // ============================================================
    supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) {
            log('👤 Session found, redirecting...', 'info');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 500);
        } else {
            log('👤 No session – please log in.', 'info');
        }
    }).catch(() => {});

    // Keyboard shortcut: Enter
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const active = document.activeElement;
            if (active && (active.id === 'loginEmail' || active.id === 'loginPassword')) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        }
    });

    // Log startup
    log('🚀 Login page ready. Enter your credentials.', 'info');
</script>

</body>
</html>
