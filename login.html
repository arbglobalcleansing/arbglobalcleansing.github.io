<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – ARB Monitoring</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
<div class="container">
    <div class="login-container">
        <h1>🏛️ ARB Monitoring</h1>
        <p class="subtitle">Department of Agrarian Reform</p>
        <div id="errorMsg" class="error-msg"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">🔐 Sign In</button>
        </form>
        <div class="register-link">
            Don't have an account? <a href="#" onclick="showRegister()">Register here</a>
        </div>
        <div id="registerForm" style="display:none; margin-top:25px; border-top:1px solid #e2e8f0; padding-top:20px;">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="Juan Dela Cruz">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password (min 6 characters)</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login" style="background:#2e7d32;">📝 Register</button>
                <button type="button" class="btn-login" style="background:#64748b; margin-top:8px;" onclick="hideRegister()">Cancel</button>
            </form>
        </div>
    </div>
</div>

<script>
    const errorDiv = document.getElementById('errorMsg');

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
    }

    function hideError() {
        errorDiv.style.display = 'none';
    }

    window.showRegister = function() {
        document.getElementById('registerForm').style.display = 'block';
        hideError();
    };

    window.hideRegister = function() {
        document.getElementById('registerForm').style.display = 'none';
        hideError();
    };

    // ---------- LOGIN ----------
    window.handleLogin = async function(e) {
        e.preventDefault();
        hideError();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showError('❌ Please enter both email and password.');
            return;
        }

        console.log('Attempting login for:', email);

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
            console.error('Login error:', error);
            showError('❌ ' + error.message);
            return;
        }

        if (data.user) {
            console.log('Login successful:', data.user.email);
            window.location.href = 'arb.html';
        }
    };

    // ---------- REGISTRATION ----------
    window.handleRegister = async function(e) {
        e.preventDefault();
        hideError();

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!name || !email || !password) {
            showError('❌ Please fill in all fields.');
            return;
        }

        console.log('Registering:', { email, name });

        try {
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { full_name: name }
                }
            });

            console.log('SignUp response:', { data, error });

            if (error) {
                console.error('Registration error:', error);
                // Show user‑friendly message
                if (error.message.includes('already registered')) {
                    showError('❌ This email is already registered. Please log in.');
                } else if (error.message.includes('Password should be at least 6 characters')) {
                    showError('❌ Password must be at least 6 characters.');
                } else {
                    showError('❌ ' + error.message);
                }
                return;
            }

            // Success: user object may exist, or confirmation may be required
            if (data.user) {
                // Check if email confirmation is required
                if (data.user.confirmed_at) {
                    // Already confirmed – go straight to login
                    alert('✅ Registration successful! You can now log in.');
                    hideRegister();
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                    // Optionally auto‑fill and focus
                    document.getElementById('loginEmail').focus();
                } else {
                    // Email confirmation required
                    alert('✅ Registration successful! Please check your email to confirm your account, then log in.');
                    hideRegister();
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                }
            } else {
                // Sometimes data.user is null (e.g., if email is taken, but error would have been caught)
                showError('❌ Registration failed. Please try again.');
            }
        } catch (err) {
            console.error('Unexpected error:', err);
            showError('❌ An unexpected error occurred. Please try again.');
        }
    };

    // ---------- AUTO-REDIRECT IF ALREADY LOGGED IN ----------
    supabase.auth.getUser()
        .then(({ data, error }) => {
            if (data.user) {
                window.location.href = 'arb.html';
            }
        })
        .catch(err => console.warn('Auto-login check failed:', err));

    // Also check session (for more reliable detection)
    supabase.auth.getSession()
        .then(({ data, error }) => {
            if (data.session) {
                window.location.href = 'arb.html';
            }
        })
        .catch(err => console.warn('Session check failed:', err));
</script>

</body>
</html>
