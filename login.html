<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Arial; background:#f0f4f8;">
    <div style="background:white; padding:40px; border-radius:10px; width:350px; box-shadow:0 4px 20px rgba(0,0,0,0.1); border-top:5px solid #e8a317;">
        <h1 style="text-align:center; color:#0a3d62;">ARB Monitoring</h1>
        <p style="text-align:center; color:#64748b;">Department of Agrarian Reform</p>
        <div id="error" style="color:#b91c1c; background:#fee2e2; padding:10px; border-radius:6px; margin-bottom:15px; display:none;"></div>
        <form onsubmit="handleLogin(event)">
            <div style="margin-bottom:15px;">
                <label style="font-weight:600;">Email Address</label>
                <input type="email" id="email" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:4px;" placeholder="arbglobalcleansing@gmail.com">
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-weight:600;">Password</label>
                <input type="password" id="password" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:4px;" placeholder="••••••••">
            </div>
            <button type="submit" style="width:100%; padding:12px; background:#0a3d62; color:white; border:none; border-radius:6px; font-size:1rem; cursor:pointer;">Sign In</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
                return;
            }

            if (data.user) {
                window.location.href = 'arb.html';
            }
        }

        // Auto-redirect if already logged in
        supabase.auth.getSession().then(({ data }) => {
            if (data.session) window.location.href = 'arb.html';
        });
    </script>
</body>
</html>
