<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – ARB Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="max-width:400px; margin:100px auto; padding:40px; background:white; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.1); font-family:Arial;">
        <h1 style="text-align:center; color:#0a3d62;">ARB Monitoring</h1>
        <p style="text-align:center; color:#64748b;">Department of Agrarian Reform</p>

        <div id="statusBox" style="padding:15px; margin:15px 0; border-radius:6px; display:none; font-weight:bold;"></div>

        <form id="loginForm">
            <div style="margin-bottom:15px;">
                <label style="font-weight:600;">Email</label>
                <input type="email" id="email" value="arbglobalcleansing@gmail.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;">
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-weight:600;">Password</label>
                <input type="password" id="password" value="111111" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;">
            </div>
            <button type="submit" id="loginBtn" style="width:100%; padding:12px; background:#0a3d62; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">Sign In</button>
        </form>

        <div style="margin-top:20px; text-align:center;">
            <button onclick="testConnection()" style="padding:8px 16px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer;">Test Connection</button>
            <button onclick="checkUser()" style="padding:8px 16px; background:#e8a317; color:white; border:none; border-radius:6px; cursor:pointer; margin-left:8px;">Check User</button>
        </div>

        <div id="logBox" style="margin-top:20px; padding:12px; background:#f8f9fa; border-radius:6px; font-size:13px; border:1px solid #dee2e6; max-height:200px; overflow-y:auto; white-space:pre-wrap;"></div>
    </div>

    <script>
        // ============================================================
        //  SUPABASE CONFIG
        // ============================================================
        const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================================
        //  DOM REFS
        // ============================================================
        const statusBox = document.getElementById('statusBox');
        const logBox = document.getElementById('logBox');

        // ============================================================
        //  LOG HELPER
        // ============================================================
        function log(msg, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${msg}\n`;
            logBox.textContent += line;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);

            // Show status box
            statusBox.style.display = 'block';
            statusBox.textContent = msg;
            statusBox.style.background = isError ? '#fee2e2' : '#d4edda';
            statusBox.style.color = isError ? '#991b1b' : '#155724';
            statusBox.style.borderLeft = isError ? '4px solid #b91c1c' : '4px solid #28a745';
        }

        // ============================================================
        //  TEST CONNECTION (works!)
        // ============================================================
        window.testConnection = function() {
            log('🔍 Testing Supabase connection...');
            supabase.auth.getSession()
                .then(({ data, error }) => {
                    if (error) {
                        log('❌ Connection failed: ' + error.message, true);
                    } else {
                        log('✅ Connection successful! Supabase is reachable.');
                        log('ℹ️ Session: ' + (data.session ? 'Active' : 'None'));
                    }
                })
                .catch(err => {
                    log('❌ Error: ' + err.message, true);
                });
        };

        // ============================================================
        //  CHECK USER (works!)
        // ============================================================
        window.checkUser = function() {
            const email = document.getElementById('email').value.trim();
            log('🔍 Checking user: ' + email);

            // We can't directly check if a user exists, but we can try to sign in with a wrong password
            // to see if the user exists (but this might trigger rate limiting)
            // Instead, let's just try to get the session
            supabase.auth.getUser()
                .then(({ data, error }) => {
                    if (error) {
                        log('❌ Not logged in. Error: ' + error.message, true);
                        return;
                    }
                    if (data.user) {
                        log('✅ Currently logged in as: ' + data.user.email);
                    } else {
                        log('ℹ️ No user is currently logged in.');
                    }
                })
                .catch(err => {
                    log('❌ Error: ' + err.message, true);
                });

            // Also check if the user has a profile in the profiles table
            supabase.from('profiles').select('*').limit(1)
                .then(({ data, error }) => {
                    if (error) {
                        log('ℹ️ Could not check profiles: ' + error.message);
                    } else if (data && data.length > 0) {
                        log('✅ Found ' + data.length + ' profile(s) in the database.');
                        data.forEach(p => {
                            log('   - ' + p.full_name + ' (role: ' + p.role + ')');
                        });
                    } else {
                        log('ℹ️ No profiles found in the database.');
                    }
                })
                .catch(err => {
                    log('❌ Error checking profiles: ' + err.message, true);
                });
        };

        // ============================================================
        //  LOGIN (works!)
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // prevents page reload
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            log('🔐 Attempting login: ' + email);

            if (!email || !password) {
                log('❌ Please enter both email and password.', true);
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Signing in...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    log('❌ Login failed: ' + error.message, true);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                    return;
                }

                if (data.user) {
                    log('✅ Login successful! User: ' + data.user.email);
                    log('🔄 Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = 'arb.html';
                    }, 1500);
                } else {
                    log('❌ Login failed – no user returned.', true);
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            } catch (err) {
                log('❌ Unexpected error: ' + err.message, true);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // ============================================================
        //  AUTO-REDIRECT IF ALREADY LOGGED IN
        // ============================================================
        supabase.auth.getSession().then(({ data }) => {
            if (data.session) {
                log('👤 Session found, redirecting...');
                setTimeout(() => {
                    window.location.href = 'arb.html';
                }, 1000);
            } else {
                log('👤 No active session. Please log in.');
            }
        }).catch(err => {
            log('❌ Session check failed: ' + err.message, true);
        });

        // ============================================================
        //  KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active && (active.id === 'email' || active.id === 'password')) {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================================
        //  INIT LOG
        // ============================================================
        log('🚀 Login page loaded successfully.');
        log('ℹ️ Supabase URL: ' + SUPABASE_URL);
        log('ℹ️ Click "Test Connection" to check if Supabase is reachable.');
        log('ℹ️ Click "Check User" to see if users exist in the database.');
        log('ℹ️ Enter credentials and click "Sign In" to log in.');
    </script>
</body>
</html>
