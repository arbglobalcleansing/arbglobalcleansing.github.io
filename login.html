<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – ARB Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
        body {
            background:#f0f4f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }
        .login-container {
            max-width:400px;
            width:100%;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
            border-top:5px solid #e8a317;
        }
        h1 { color:#0a3d62; text-align:center; margin-bottom:5px; }
        .subtitle { text-align:center; color:#64748b; margin-bottom:25px; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-weight:600; margin-bottom:5px; color:#1e293b; }
        input {
            width:100%;
            padding:10px 14px;
            border:1px solid #cbd5e1;
            border-radius:6px;
            font-size:1rem;
            transition:0.2s;
        }
        input:focus {
            outline:none;
            border-color:#0a3d62;
            box-shadow:0 0 0 3px rgba(10,61,98,0.15);
        }
        .btn {
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            font-size:1rem;
            font-weight:600;
            cursor:pointer;
            transition:0.2s;
            background:#0a3d62;
            color:white;
        }
        .btn:hover { background:#062b47; }
        .btn:disabled {
            opacity:0.6;
            cursor:not-allowed;
        }
        .msg {
            padding:12px;
            border-radius:6px;
            margin-bottom:15px;
            display:none;
            font-weight:500;
            font-size:0.95rem;
        }
        .msg-error {
            color:#991b1b;
            background:#fee2e2;
            border-left:4px solid #b91c1c;
        }
        .msg-success {
            color:#155724;
            background:#d4edda;
            border-left:4px solid #28a745;
        }
        .msg-info {
            color:#0c5460;
            background:#d1ecf1;
            border-left:4px solid #17a2b8;
        }
        .debug {
            margin-top:20px;
            padding:12px;
            background:#f8f9fa;
            border-radius:6px;
            font-size:0.85rem;
            color:#495057;
            border:1px solid #dee2e6;
            display:none;
        }
        .debug pre {
            white-space:pre-wrap;
            word-break:break-all;
            margin:0;
        }
        .loading-spinner {
            display:inline-block;
            width:16px;
            height:16px;
            border:2px solid rgba(255,255,255,0.3);
            border-top-color:white;
            border-radius:50%;
            animation:spin 0.6s linear infinite;
            vertical-align:middle;
            margin-right:8px;
        }
        @keyframes spin {
            to { transform:rotate(360deg); }
        }
        .test-section {
            margin-top:20px;
            padding-top:15px;
            border-top:1px solid #e2e8f0;
            text-align:center;
        }
        .test-section button {
            background:#64748b;
            color:white;
            border:none;
            padding:8px 16px;
            border-radius:6px;
            cursor:pointer;
            font-size:0.85rem;
        }
        .test-section button:hover { background:#475569; }
    </style>
</head>
<body>
<div class="login-container">
    <h1>🏛️ ARB Monitoring</h1>
    <p class="subtitle">Department of Agrarian Reform</p>

    <div id="errorMsg" class="msg msg-error"></div>
    <div id="successMsg" class="msg msg-success"></div>
    <div id="infoMsg" class="msg msg-info"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input
                type="email"
                id="loginEmail"
                required
                placeholder="arbglobalcleansing@gmail.com"
                value="arbglobalcleansing@gmail.com"
            >
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                required
                placeholder="••••••••"
                value="111111"
            >
        </div>
        <button type="submit" class="btn" id="loginBtn">🔐 Sign In</button>
    </form>

    <div class="test-section">
        <button onclick="testConnection()">🔧 Test Connection</button>
        <button onclick="showDebug()">📋 Show Debug Info</button>
    </div>

    <div class="debug" id="debugBox">
        <pre id="debugContent">Click "Show Debug Info"</pre>
    </div>
</div>

<script>
    // ============================================================
    //  SUPABASE CONFIG
    // ============================================================
    const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================================
    //  DOM REFS
    // ============================================================
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');
    const infoDiv = document.getElementById('infoMsg');
    const loginBtn = document.getElementById('loginBtn');
    const debugBox = document.getElementById('debugBox');
    const debugContent = document.getElementById('debugContent');

    // ============================================================
    //  HELPERS
    // ============================================================
    function hideAll() {
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        infoDiv.style.display = 'none';
    }

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        successDiv.style.display = 'none';
        infoDiv.style.display = 'none';
        console.error('❌ ' + msg);
    }

    function showSuccess(msg) {
        successDiv.textContent = msg;
        successDiv.style.display = 'block';
        errorDiv.style.display = 'none';
        infoDiv.style.display = 'none';
        console.log('✅ ' + msg);
    }

    function showInfo(msg) {
        infoDiv.textContent = msg;
        infoDiv.style.display = 'block';
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        console.log('ℹ️ ' + msg);
    }

    function setLoading(loading) {
        if (loading) {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
        } else {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Sign In';
        }
    }

    // ============================================================
    //  SHOW DEBUG INFO
    // ============================================================
    window.showDebug = async function() {
        debugBox.style.display = 'block';
        let info = '';

        // 1. Check Supabase client
        info += '🔹 Supabase client:\n';
        info += `   URL: ${SUPABASE_URL}\n`;
        info += `   Key: ${SUPABASE_KEY.substring(0, 15)}...\n\n`;

        // 2. Check session
        try {
            const { data, error } = await supabase.auth.getSession();
            info += '🔹 Session check:\n';
            if (error) info += `   ❌ Error: ${error.message}\n`;
            else if (data.session) info += `   ✅ Session exists (user: ${data.session.user.email})\n`;
            else info += `   ℹ️ No active session\n\n`;
        } catch (e) {
            info += `   ❌ Exception: ${e.message}\n\n`;
        }

        // 3. Check current user
        try {
            const { data, error } = await supabase.auth.getUser();
            info += '🔹 User check:\n';
            if (error) info += `   ❌ Error: ${error.message}\n`;
            else if (data.user) info += `   ✅ User logged in: ${data.user.email}\n`;
            else info += `   ℹ️ No user logged in\n\n`;
        } catch (e) {
            info += `   ❌ Exception: ${e.message}\n\n`;
        }

        debugContent.textContent = info;
    };

    // ============================================================
    //  TEST CONNECTION
    // ============================================================
    window.testConnection = async function() {
        hideAll();
        showInfo('🔍 Testing Supabase connection...');

        try {
            // Simple health check – try to get session (doesn't require auth)
            const { data, error } = await supabase.auth.getSession();

            if (error) {
                showError('❌ Connection test failed: ' + error.message);
                return;
            }

            showSuccess('✅ Connection successful! Supabase is reachable.');

            // Also check if the admin user exists
            const email = document.getElementById('loginEmail').value.trim();
            if (email) {
                showInfo('ℹ️ Checking if user exists...');
                try {
                    // We can't directly check if a user exists, but we can try a sign-in with wrong password
                    // Just to see if the user exists
                    const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: 'wrong_password_test_123'
                    });

                    // If error is "Invalid login credentials" with email not found, it means user doesn't exist
                    // But this is messy. Let's just tell them to check manually.
                    showInfo('ℹ️ To verify if your user exists, go to Supabase Dashboard → Authentication → Users and look for your email.');
                } catch (e) {
                    // ignore
                }
            }
        } catch (err) {
            showError('❌ Connection test failed: ' + err.message);
        }
    };

    // ============================================================
    //  LOGIN HANDLER
    // ============================================================
    window.handleLogin = async function(e) {
        e.preventDefault();  // IMPORTANT: prevents page reload
        hideAll();
        setLoading(true);

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        console.log('🔐 Login attempt:', { email });

        if (!email || !password) {
            showError('❌ Please enter both email and password.');
            setLoading(false);
            return;
        }

        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            console.log('📦 Login response:', { data, error });

            if (error) {
                // Detailed error messages
                let msg = error.message;
                if (msg.includes('Invalid login credentials')) {
                    showError('❌ Invalid email or password. Please check your credentials.');
                } else if (msg.includes('Email not confirmed')) {
                    showError('❌ Email not confirmed. Please check your inbox and click the confirmation link.');
                } else if (msg.includes('User not found')) {
                    showError('❌ User not found. This email is not registered.');
                } else {
                    showError('❌ ' + msg);
                }
                setLoading(false);
                return;
            }

            if (data.user) {
                console.log('✅ Login success:', data.user.email);
                showSuccess('✅ Login successful! Redirecting...');

                // Small delay so the user sees the success message
                setTimeout(() => {
                    window.location.href = 'arb.html';
                }, 800);
            } else {
                showError('❌ Login failed – no user returned. Please try again.');
                setLoading(false);
            }

        } catch (err) {
            console.error('💥 Unexpected error:', err);
            showError('❌ An unexpected error occurred: ' + err.message);
            setLoading(false);
        }
    };

    // ============================================================
    //  AUTO-REDIRECT IF ALREADY LOGGED IN
    // ============================================================
    async function checkSession() {
        try {
            const { data, error } = await supabase.auth.getSession();
            if (data.session) {
                console.log('👤 Session found, redirecting...');
                window.location.href = 'arb.html';
            } else {
                console.log('👤 No session, staying on login.');
            }
        } catch (err) {
            console.warn('Session check failed:', err);
        }
    }

    // ============================================================
    //  KEYBOARD SHORTCUT: Enter key submits the form
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const active = document.activeElement;
            if (active && (active.id === 'loginEmail' || active.id === 'loginPassword')) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        }
    });

    // ============================================================
    //  INIT
    // ============================================================
    checkSession();

    // Log that the page is ready
    console.log('✅ Login page loaded successfully.');
    console.log('🔹 Supabase URL:', SUPABASE_URL);
    console.log('🔹 To test, click "Test Connection" button.');
</script>

</body>
</html>
