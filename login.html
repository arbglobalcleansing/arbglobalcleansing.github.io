<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Load Supabase from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div style="max-width:400px; margin:50px auto; padding:30px; background:white; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.1); font-family:Arial;">
    <h1 style="text-align:center; color:#0a3d62;">ARB Monitoring</h1>
    <p style="text-align:center; color:#64748b;">Department of Agrarian Reform</p>

    <!-- STATUS BOX - shows messages -->
    <div id="status" style="padding:12px; margin:15px 0; border-radius:6px; background:#f8f9fa; border:1px solid #dee2e6; min-height:40px; font-size:14px;"></div>

    <!-- FORM -->
    <form id="loginForm">
        <div style="margin-bottom:15px;">
            <label style="font-weight:600;">Email</label>
            <input type="email" id="email" value="arbglobalcleansing@gmail.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;">
        </div>
        <div style="margin-bottom:20px;">
            <label style="font-weight:600;">Password</label>
            <input type="password" id="password" value="111111" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:5px;">
        </div>
        <button type="submit" id="loginBtn" style="width:100%; padding:12px; background:#0a3d62; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">Sign In</button>
    </form>

    <!-- TEST BUTTONS -->
    <div style="margin-top:15px; display:flex; gap:10px;">
        <button onclick="alert('Button 1 works!')" style="flex:1; padding:10px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer;">Test 1</button>
        <button onclick="document.getElementById('status').innerHTML='✅ Test 2 works!'" style="flex:1; padding:10px; background:#e8a317; color:white; border:none; border-radius:6px; cursor:pointer;">Test 2</button>
        <button onclick="testConnection()" style="flex:1; padding:10px; background:#2e7d32; color:white; border:none; border-radius:6px; cursor:pointer;">Test DB</button>
    </div>

    <!-- LOG BOX -->
    <div id="logBox" style="margin-top:20px; padding:12px; background:#1e1e1e; color:#d4d4d4; border-radius:6px; font-family:monospace; font-size:12px; max-height:200px; overflow-y:auto; white-space:pre-wrap;"></div>
</div>

<script>
    // ============================================================
    // 1. CHECK IF JAVASCRIPT IS WORKING
    // ============================================================
    console.log('✅ JavaScript is working!');
    document.getElementById('status').innerHTML = '✅ JavaScript loaded!';

    // ============================================================
    // 2. LOG HELPER
    // ============================================================
    function log(msg) {
        const logBox = document.getElementById('logBox');
        const timestamp = new Date().toLocaleTimeString();
        logBox.textContent += `[${timestamp}] ${msg}\n`;
        logBox.scrollTop = logBox.scrollHeight;
        console.log(msg);
        document.getElementById('status').innerHTML = msg;
    }

    log('🚀 Page loaded');

    // ============================================================
    // 3. SUPABASE CONFIG (hardcoded, no external file needed)
    // ============================================================
    try {
        const SUPABASE_URL = 'https://xnwttnpfzcjbszwxsgox.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zEh0y_OAF7nVwLBuTTB74w_gPX0XomI';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        log('✅ Supabase client created');
        window.supabase = supabase;
    } catch (err) {
        log('❌ Supabase init failed: ' + err.message);
    }

    // ============================================================
    // 4. TEST CONNECTION BUTTON
    // ============================================================
    window.testConnection = function() {
        log('🔍 Testing connection...');
        if (!window.supabase) {
            log('❌ Supabase client not initialized');
            return;
        }
        window.supabase.auth.getSession()
            .then(({ data, error }) => {
                if (error) {
                    log('❌ Connection failed: ' + error.message);
                } else {
                    log('✅ Connected! Session: ' + (data.session ? 'Active' : 'None'));
                }
            })
            .catch(err => {
                log('❌ Error: ' + err.message);
            });
    };

    // ============================================================
    // 5. LOGIN FORM
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        log('🔐 Login button clicked!');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        log('📧 Email: ' + email);

        if (!window.supabase) {
            log('❌ Supabase not initialized');
            return;
        }

        window.supabase.auth.signInWithPassword({ email, password })
            .then(({ data, error }) => {
                if (error) {
                    log('❌ Login failed: ' + error.message);
                    return;
                }
                if (data.user) {
                    log('✅ Login success! User: ' + data.user.email);
                    log('🔄 Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'arb.html';
                    }, 1000);
                } else {
                    log('❌ No user returned');
                }
            })
            .catch(err => {
                log('❌ Error: ' + err.message);
            });
    });

    // ============================================================
    // 6. AUTO-REDIRECT CHECK
    // ============================================================
    if (window.supabase) {
        window.supabase.auth.getSession().then(({ data }) => {
            if (data.session) {
                log('👤 Session found, redirecting...');
                setTimeout(() => {
                    window.location.href = 'arb.html';
                }, 1000);
            } else {
                log('👤 No session, ready to login');
            }
        }).catch(err => {
            log('⚠️ Session check: ' + err.message);
        });
    }

    // ============================================================
    // 7. KEYBOARD SHORTCUT
    // ============================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const active = document.activeElement;
            if (active && (active.id === 'email' || active.id === 'password')) {
                log('⏎ Enter pressed, submitting form');
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        }
    });

    // ============================================================
    // 8. ADD CLICK LOGGING TO ALL BUTTONS
    // ============================================================
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            log('🖱️ Clicked: ' + (this.textContent || 'button'));
        });
    });

    log('✅ All event listeners attached');
</script>

</body>
</html>
